// ngan_tu({mo, chot, s}) Ổ KHOÁ 2: tủ hồ sơ 4 ngăn (Kiểu 4, nói chung thay cho cụ thể). mo = 'a'|'b'|'c'|'d' (ngăn đang kéo ra). Gốc = giữa chân. Rộng 118, cao 152.
function ngan_tu(o = {}){
  const s = o.s || 1, R = _R(), mo = o.mo || '', ch = o.chot || ['', '', '', ''];
  const ngan = i => { const k = 'abcd'[i], y = -146 + i * 36, mi = mo === k, dy = mi ? 12 : 0, mauT = [RP.cam, RP.xanh_sang, RP.jade_sang];
    return `<g class="ngan ngan-${k}">${mi ? `<polygon points="-50,${y + 6} 50,${y + 6} 56,${y + 16} -56,${y + 16}" fill="${RP.navy_toi}"/>${mauT.map((c, j) => `<rect x="${-34 + j * 26}" y="${y - 3}" width="18" height="12" rx="2" fill="${c}"/>`).join('')}` : ''}
    <rect x="-54" y="${y + dy}" width="108" height="33" rx="4" fill="${R.v('nf' + i, RP.thep, .3, -.2)}" ${R.S(1.3)}/><rect x="-22" y="${y + dy + 6}" width="44" height="12" rx="2" fill="${RP.giay}" stroke="${ch[i] ? _led(ch[i]) : RP.xam_toi}" stroke-opacity="${ch[i] ? 1 : .45}" stroke-width="${ch[i] ? 2.4 : 1.2}"/>
    <rect x="-14" y="${y + dy + 22}" width="28" height="6" rx="3" fill="${RP.thep_toi}"/><circle cx="-46" cy="${y + dy + 7}" r="1.8" fill="${RP.thep_toi}"/><circle cx="46" cy="${y + dy + 7}" r="1.8" fill="${RP.thep_toi}"/></g>`; };
  return R.out(`<g class="o-khoa ngan-tu" transform="scale(${s})">${R.bong(0, 3, 70, 6, .3)}
    <rect x="-59" y="-152" width="118" height="152" rx="6" fill="${R.v('than', RP.xam_toi, .2, -.3)}" ${R.S(1.8)}/>${[0, 1, 2, 3].map(ngan).join('')}
    ${['a', 'b', 'c', 'd'].map((k, i) => `<rect class="vung vung-${k}" x="-56" y="${-148 + i * 36}" width="112" height="36" fill="transparent"/>`).join('')}
    <rect x="-52" y="-6" width="104" height="6" fill="${RP.navy_toi}" opacity=".6"/></g>`);
}
// can_gat_khoa({vt, chot, s}) Ổ KHOÁ 3: bảng cần gạt (Kiểu 5, đổi cách nói phủ định). vt 0..3 vị trí cần gạt. Gốc = tâm bảng. Rộng 156, cao 96.
function can_gat_khoa(o = {}){
  const s = o.s || 1, R = _R(), vt = o.vt == null ? 0 : o.vt, ch = o.chot || ['', '', '', ''], X = [-54, -18, 18, 54];
  const dau = ch.map((t, i) => `<g class="chot chot-${'abcd'[i]}"><circle cx="${X[i]}" cy="-22" r="8.4" fill="${RP.navy_toi}" ${R.S(1)}/><circle cx="${X[i]}" cy="-22" r="5.6" fill="${_led(t)}"/>${t ? `<circle cx="${X[i]}" cy="-22" r="11" fill="${_led(t)}" opacity=".3"/>` : ''}<circle cx="${X[i] - 1.6}" cy="-23.6" r="1.6" fill="#fff" opacity=".7"/></g>`).join('');
  return R.out(`<g class="o-khoa can-gat" transform="scale(${s})">${R.bong(0, 52, 78, 6, .3)}
    <rect x="-78" y="-48" width="156" height="96" rx="11" fill="${R.v('bang', RP.thep, .25, -.28)}" ${R.S(1.8)}/><rect x="-72" y="-42" width="144" height="84" rx="7" fill="${RP.navy}" opacity=".92"/>
    ${[[-70, -40], [70, -40], [-70, 40], [70, 40]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${RP.thep}"/>`).join('')}${dau}
    <rect x="-62" y="12" width="124" height="20" rx="10" fill="${RP.navy_toi}" ${R.S(1)}/>${X.map(x => `<circle cx="${x}" cy="22" r="2.6" fill="${RP.thep_toi}"/>`).join('')}
    <rect x="${X[vt] - 12}" y="2" width="24" height="40" rx="9" fill="${R.v('can', RP.cam, .22, -.2)}" ${R.S(1.4)}/><rect x="${X[vt] - 8}" y="8" width="16" height="4" rx="2" fill="#fff" opacity=".5"/>${[16, 22, 28].map(y => `<line x1="${X[vt] - 7}" y1="${y + 6}" x2="${X[vt] + 7}" y2="${y + 6}" stroke="${RP.go_toi}" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>`).join('')}
    ${['a', 'b', 'c', 'd'].map((k, i) => `<rect class="vung vung-${k}" x="${X[i] - 17}" y="-34" width="34" height="78" fill="transparent"/>`).join('')}</g>`);
}

/* ---------- tài liệu và khay manh mối ---------- */
// to_bao_cao({w,h,s}) tờ báo cáo mật (Đoán nhanh, đoạn văn ngắn). Có .o-chu để đặt chữ. Gốc = tâm.
function to_bao_cao(o = {}){
  const w = o.w || 140, hh = o.h || 104, s = o.s || 1, R = _R(), x = -w / 2, y = -hh / 2;
  return R.out(`<g transform="scale(${s}) rotate(-1.6)">${R.bong(0, hh / 2 + 5, w * .46, 5, .22)}
    <rect x="${x + 5}" y="${y + 5}" width="${w}" height="${hh}" rx="4" fill="${RP.giay_toi}" ${R.S(1)}/>
    <rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="4" fill="${R.v('giay', RP.giay, .3, -.05)}" ${R.S()}/>
    <rect x="${x}" y="${y}" width="${w}" height="13" rx="4" fill="${RP.navy}"/><rect x="${x + 10}" y="${y + 5}" width="40" height="3.4" rx="1.7" fill="${RP.thep}" opacity=".7"/>
    <circle cx="${x + w - 24}" cy="${y + 34}" r="14" fill="none" stroke="${RP.do}" stroke-width="2.2" opacity=".6" stroke-dasharray="3 2"/><path d="M${x + w - 24} ${y + 26} l2.4 5.2 5.6 .7 -4.1 3.8 1.1 5.6 -5 -2.8 -5 2.8 1.1 -5.6 -4.1 -3.8 5.6 -.7 Z" fill="${RP.do}" opacity=".6"/>
    <path d="M${x + 14} ${y - 10} v22 a5 5 0 0 0 10 0 v-18 a3 3 0 0 0 -6 0 v16" fill="none" stroke="${RP.thep}" stroke-width="2.4" stroke-linecap="round"/>
    <rect class="o-chu" x="${x + 10}" y="${y + 20}" width="${w - 20}" height="${hh - 30}" rx="2" fill="none"/></g>`);
}
// ho_so({w,h,s}) tập hồ sơ bìa vàng (đặt bài đọc BD3). Có .o-chu. Gốc = tâm.
function ho_so(o = {}){
  const w = o.w || 170, hh = o.h || 116, s = o.s || 1, R = _R(), x = -w / 2, y = -hh / 2, bia = '#E3BF92';
  return R.out(`<g transform="scale(${s})">${R.bong(0, hh / 2 + 5, w * .46, 5, .22)}
    <path d="M${x} ${y + 10} a6 6 0 0 1 6 -6 h44 l8 10 h${w - 58} a6 6 0 0 1 6 6 v${hh - 20} a6 6 0 0 1 -6 6 h${-(w - 12)} a6 6 0 0 1 -6 -6 Z" fill="${R.v('lung', _rmix(bia, -.12), .05, -.2)}" ${R.S()}/>
    <rect x="${x + 6}" y="${y + 18}" width="${w - 12}" height="${hh - 32}" rx="3" fill="${R.v('giay', RP.giay, .3, -.05)}" ${R.S(1)}/>
    <path d="M${x} ${y + 30} h${w} v${hh - 40} a6 6 0 0 1 -6 6 h${-(w - 12)} a6 6 0 0 1 -6 -6 Z" fill="${R.v('bia', bia, .18, -.1)}" ${R.S()}/>
    <rect class="o-chu" x="${x + 10}" y="${y + 36}" width="${w - 20}" height="${hh - 52}" rx="3" fill="${RP.giay}" opacity=".96"/>
    <path d="M${x + w - 14} ${y + 6} v14" stroke="${RP.do}" stroke-width="3.2" stroke-linecap="round"/><circle cx="${x + w - 14}" cy="${y + 22}" r="3.6" fill="${R.rad('tr', RP.do)}"/></g>`);
}
// khay_manh_moi({n, co, w, s}) khay túi bằng chứng: n ngăn, mỗi ngăn đựng một câu bằng chứng (bước ②). co[i] = true thì túi có giấy. Gốc = tâm khay.
function khay_manh_moi(o = {}){
  const n = o.n || 3, co = o.co || [], w = o.w || 200, hh = 62, s = o.s || 1, R = _R(), cw = (w - 16 - (n - 1) * 8) / n;
  const tui = Array.from({ length: n }, (_, i) => { const x = -w / 2 + 8 + i * (cw + 8), c = co[i];
    return `<g class="tui tui-${i + 1}"><rect x="${x}" y="-22" width="${cw}" height="44" rx="4" fill="${c ? RP.thep_sang : '#fff'}" opacity="${c ? .38 : .14}" ${R.S(1)}/>
    ${c ? `<rect x="${x + 5}" y="-14" width="${cw - 10}" height="28" rx="2" fill="${RP.giay}" ${R.S(.8)}/><rect x="${x + 9}" y="-8" width="${cw - 18}" height="3" fill="${RP.jade}" opacity=".7"/><rect x="${x + 9}" y="-1" width="${cw - 26}" height="3" fill="${RP.xam}" opacity=".5"/>` : ''}
    <rect x="${x}" y="-22" width="${cw}" height="7" rx="3" fill="${c ? RP.jade_sang : RP.thep}" opacity=".9"/><line x1="${x + 4}" y1="-18.5" x2="${x + cw - 4}" y2="-18.5" stroke="#fff" stroke-opacity=".6" stroke-dasharray="2 2.4"/></g>`; }).join('');
  return R.out(`<g class="khay" transform="scale(${s})">${R.bong(0, hh / 2 + 3, w * .46, 4, .22)}
    <rect x="${-w / 2}" y="${-hh / 2}" width="${w}" height="${hh}" rx="9" fill="${R.v('khay', RP.navy_sang, .15, -.25)}" ${R.S(1.5)}/><rect x="${-w / 2 + 4}" y="${-hh / 2 + 4}" width="${w - 8}" height="${hh - 8}" rx="6" fill="${RP.navy_toi}" opacity=".55"/>${tui}</g>`);
}

/* ---------- bản đồ 13 chìa ---------- */
// ban_do_13_chia({dat:[số bài đã có chìa], sang:số bài đang mở, ontap:[số bài chìa gỉ], w}) mặt cắt toà nhà 2 tầng + Cổng thi. viewBox "-230 -158 460 316".
// Mỗi phòng có class `phong phong-N` (N = 1..13), `phong-cp1`, `phong-cp2`, `cong-thi` để file bài gắn nhãn và sự kiện HTML.
function ban_do_13_chia(o = {}){
  const dat = o.dat || [], on = o.ontap || [], sang = o.sang == null ? 1 : o.sang, R = _R(), cw = 52;
  const chim = (x, y, gi, n) => `<g transform="translate(${x} ${y + 4}) scale(.4)">${chia_so({ gi, n })}</g>`;
  const lo = (x, y) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${RP.navy_toi}"/><path d="M${x - 1.6} ${y + 2} L${x - 3} ${y + 9} h6 L${x + 1.6} ${y + 2} Z" fill="${RP.navy_toi}"/>`;
  const cua = (x, y, id, loai) => {
    const co = typeof id === 'number' && dat.includes(id), gi = typeof id === 'number' && on.includes(id), hien = id === sang, cp = loai === 'cp';
    const fill = hien ? R.v('cs' + id, RP.vang, .2, -.1) : co ? R.v('cd' + id, RP.jade_sang, .05, -.2) : cp ? R.v('cc' + id, RP.do, .0, -.3) : R.v('ck' + id, RP.navy_sang, .0, -.2);
    return `<g class="phong ${typeof id === 'number' ? 'phong-' + id : 'phong-' + id}">${hien ? `<rect x="${x - 25}" y="${y - 34}" width="50" height="68" rx="10" fill="${RP.vang}" opacity=".3"/>` : ''}
      <rect x="${x - 19}" y="${y - 28}" width="38" height="56" rx="6" fill="${fill}" ${R.S(1.3)}/><rect x="${x - 14}" y="${y - 23}" width="28" height="46" rx="4" fill="#000" opacity=".1"/>
      ${co ? chim(x, y + 3, gi, id) : lo(x, y + (cp ? 2 : 4))}${cp ? `<path d="M${x - 12} ${y - 20} h24" stroke="#fff" stroke-opacity=".5" stroke-width="2.4" stroke-dasharray="4 3"/>` : ''}</g>`; };
  let tang1 = '', tang2 = '';
  for(let i = 0; i < 6; i++) tang1 += cua(-182 + i * cw, 66, i + 1);
  tang1 += cua(-182 + 6 * cw, 66, 'cp1', 'cp');
  for(let i = 0; i < 7; i++) tang2 += cua(-182 + i * cw, -26, i + 7);
  tang2 += cua(-182 + 7 * cw, -26, 'cp2', 'cp');
  const thang = `<g><rect x="168" y="30" width="38" height="70" rx="4" fill="${RP.navy_toi}" opacity=".6"/>${[0, 1, 2, 3, 4].map(i => `<path d="M${172 + i * 6} ${96 - i * 12} h${30 - i * 6} v6 h${-(30 - i * 6)} Z" fill="${RP.thep}"/>`).join('')}</g>`;
  const cong = `<g class="cong-thi"><path d="M-48 -92 V-118 a48 48 0 0 1 96 0 V-92 Z" transform="translate(0 6)" fill="${R.v('cg', RP.go, .12, -.28)}" ${R.S(1.6)}/><path d="M-34 -92 V-116 a34 34 0 0 1 68 0 V-92 Z" transform="translate(0 6)" fill="${RP.navy_toi}"/>
    <circle cx="0" cy="-108" r="9" fill="${R.rad('khc', RP.vang)}" ${R.S(1.2)}/><path d="M-3.4 -104 L-6 -88 h12 L3.4 -104 Z" fill="${RP.vang}"/><circle cx="0" cy="-108" r="3.4" fill="${RP.navy_toi}"/></g>`;
  return R.out(`<g class="ban-do">
    <rect x="-226" y="-154" width="452" height="308" rx="16" fill="${R.v('nha', RP.navy, .05, -.25)}" ${R.S(1.8)}/>
    <rect x="-216" y="-60" width="432" height="10" fill="${RP.thep_toi}" opacity=".7"/><rect x="-216" y="32" width="432" height="10" fill="${RP.thep_toi}" opacity=".7"/>
    <rect x="-216" y="120" width="432" height="26" rx="6" fill="${RP.go_den}" opacity=".8"/>${cong}${tang2}${tang1}${thang}</g>`);
}
</script>
<script>/* ===== ASSET READING v2: phong cách điệp viên, 2.5D (nạp SAU reading-asset-1.js và reading-asset-2.js; hàm trùng tên sẽ thay bản v1) =====
   Ngôn ngữ hình v2:
   - Bảng màu "phòng mật": xanh đêm (#102921 đến #1F4C3D), đèn vàng hổ phách làm ánh sáng chính, xanh neon (#58D5A6) làm ánh sáng viền, tia laser đỏ (#E68264).
   - Chiều sâu: căn phòng vẽ theo phối cảnh một điểm tụ (tường trái, tường phải, trần, sàn bóng); đồ vật vẽ khối hộp chiếu xiên (mặt trước, mặt trên sáng, mặt bên tối), có vát cạnh, đinh tán, vệt sáng.
   - Ánh sáng: nguồn chính trên trái; chùm đèn trần; màn hình toả sáng; tối dần ở rìa (vignette). Không dùng bộ lọc SVG (nhẹ máy). */
const RP2 = { neon: '#58D5A6', neon_toi: '#28966D', laser: '#E68264', dem: '#102921', dem2: '#193A2F', dem3: '#1F4C3D', thep3: '#527167', tim: '#63A292', kaki: '#B79A6E' };

// _hop: khối hộp chiếu xiên. (x,y) góc trên trái mặt trước; (dx,dy) độ sâu (lên phải: dx > 0, dy < 0); c = màu vật liệu.
function _hop(R, n, x, y, w, h, dx, dy, c, o = {}){
  const side = `<polygon points="${x + w},${y} ${x + w + dx},${y + dy} ${x + w + dx},${y + h + dy} ${x + w},${y + h}" fill="${R.lin(n + 's', [[0, _rmix(c, -.3)], [1, _rmix(c, -.52)]], 1, 0)}" ${R.S(1.2)}/>`;
  const top = `<polygon points="${x},${y} ${x + w},${y} ${x + w + dx},${y + dy} ${x + dx},${y + dy}" fill="${R.lin(n + 't', [[0, _rmix(c, .55)], [1, _rmix(c, .3)]], 1, 0)}" ${R.S(1.2)}/>`;
  const front = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx == null ? 4 : o.rx}" fill="${R.lin(n + 'f', [[0, _rmix(c, .26)], [.55, c], [1, _rmix(c, -.24)]], .35, 1)}" ${R.S(1.5)}/>`;
  const vat = `<path d="M${x + 3} ${y + h - 3} V${y + 3} H${x + w - 3}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.6" stroke-linecap="round"/><path d="M${x + w - 3} ${y + 3} V${y + h - 3} H${x + 3}" fill="none" stroke="#000" stroke-opacity=".26" stroke-width="1.6" stroke-linecap="round"/>`;
  return side + top + front + vat;
}
const _dinh = (x, y, r = 2.6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#2D423B"/><circle cx="${x - r * .25}" cy="${y - r * .25}" r="${r * .75}" fill="#9CB4AC"/><circle cx="${x - r * .4}" cy="${y - r * .45}" r="${r * .3}" fill="#fff" opacity=".85"/>`;
const _den3 = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r * 2}" fill="${c}" opacity=".25"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x - r * .3}" cy="${y - r * .35}" r="${r * .38}" fill="#fff" opacity=".8"/>`;

/* ---------- căn phòng: phối cảnh một điểm tụ ---------- */
// phong_giai_ma({w,h,tran,laser}) viewBox "0 0 w h" (mặc định 760x300). Tường sau là khối chữ nhật (22% đến 78% bề ngang, 13% đến 57% bề cao); sàn từ đó xuống mép dưới.
// Tường trái có dãy màn hình giám sát, tường phải có cửa an ninh, tường sau có bản đồ ghim dây đỏ, trần có đèn. laser: thêm vài tia laser đỏ ngang phòng.
function phong_giai_ma(o = {}){
  const w = o.w || 760, h = o.h || 300, T = o.tran == null ? 300 : o.tran, R = _R();
  const bx1 = w * .224, bx2 = w - bx1, by1 = h * .133, by2 = h * .567;
  const L = (d, hh) => { const top = by1 * d, bot = h - (h - by2) * d; return [bx1 * d, bot - hh * (bot - top)]; };      // tường trái: d = 0 (mép màn) đến 1 (góc sâu), hh = 0 (sàn) đến 1 (trần)
  const Rr = (d, hh) => { const p = L(d, hh); return [w - p[0], p[1]]; };
  const pt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const quad = (F, d1, d2, h1, h2) => [F(d1, h1), F(d2, h1), F(d2, h2), F(d1, h2)];
  const bil = (F, d1, d2, h1, h2, u, v) => F(d1 + (d2 - d1) * u, h1 + (h2 - h1) * v);
  const poly = (pts, fill, ex = '') => `<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" ${ex}/>`;
  const cx = w / 2;
  // nền tràn
  let b = `<rect x="${-T}" y="${-T}" width="${w + 2 * T}" height="${T + by1 * .5}" fill="#0B1C16"/><rect x="${-T}" y="${h - 2}" width="${w + 2 * T}" height="${T + 2}" fill="#111E1A"/>
    <rect x="${-T}" y="0" width="${T + 2}" height="${h}" fill="${RP2.dem2}"/><rect x="${w - 2}" y="0" width="${T + 2}" height="${h}" fill="${RP2.dem2}"/>`;
  // các mặt phòng
  b += `<rect x="${bx1}" y="${by1}" width="${bx2 - bx1}" height="${by2 - by1}" fill="${R.lin('tsau', [[0, '#2C6553'], [1, '#1A4336']])}"/>`;
  b += poly([[0, 0], [bx1, by1], [bx1, by2], [0, h]], R.lin('ttrai', [[0, '#122E25'], [1, '#215242']], 1, 0));
  b += poly([[w, 0], [bx2, by1], [bx2, by2], [w, h]], R.lin('tphai', [[0, '#255847'], [1, '#133027']], 1, 0));
  b += poly([[0, 0], [w, 0], [bx2, by1], [bx1, by1]], R.lin('tran', [[0, '#07130F'], [1, '#193D31']]));
  b += poly([[0, h], [w, h], [bx2, by2], [bx1, by2]], R.lin('san', [[0, '#203C33'], [1, '#0D1E18']]));
  // gạch sàn (phối cảnh)
  let gach = ''; for(let i = -5; i <= 5; i++){ const xb = cx + i * (bx2 - bx1) / 10, xf = cx + i * w / 10 * 1.0; gach += `<line x1="${xb}" y1="${by2}" x2="${xf}" y2="${h}" stroke="#89F5D2" stroke-opacity=".09" stroke-width="1.4"/>`; }
  for(let k = 1; k <= 7; k++){ const t = Math.pow(k / 7, 1.75), y = by2 + (h - by2) * t, xl = bx1 * (1 - t), xr = w - xl; gach += `<line x1="${xl}" y1="${y}" x2="${xr}" y2="${y}" stroke="#89F5D2" stroke-opacity="${.05 + t * .06}" stroke-width="${1 + t}"/>`; }
  b += gach + `<defs><radialGradient id="${R.id}vp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F9BB70" stop-opacity=".42"/><stop offset=".6" stop-color="#F9BB70" stop-opacity=".14"/><stop offset="1" stop-color="#F9BB70" stop-opacity="0"/></radialGradient></defs><ellipse cx="${cx}" cy="${by2 + (h - by2) * .6}" rx="${w * .26}" ry="${(h - by2) * .5}" fill="url(#${R.id}vp)"/>`;
  // đường chân tường
  b += `<line x1="${bx1}" y1="${by2}" x2="${bx2}" y2="${by2}" stroke="#000" stroke-opacity=".5" stroke-width="2"/><polygon points="${pt([0, h])} ${pt([bx1, by2])} ${pt(L(1, .05))} ${pt(L(0, .05))}" fill="#060E0C" opacity=".5"/><polygon points="${pt([w, h])} ${pt([bx2, by2])} ${pt(Rr(1, .05))} ${pt(Rr(0, .05))}" fill="#060E0C" opacity=".5"/>`;
  // tường trái: 3x2 màn hình giám sát
  let man = '';
  for(let r = 0; r < 2; r++) for(let c = 0; c < 3; c++){

    else { let l = ''; for(let i = 0; i < 4; i++){ const a = bil(L, d1, d2, h1, h2, .12, .25 + i * .17), c2 = bil(L, d1, d2, h1, h2, .35 + (i * 37 % 5) * .1, .25 + i * .17); l += `<line x1="${a[0]}" y1="${a[1]}" x2="${c2[0]}" y2="${c2[1]}" stroke="${sang}" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>`; } ve = l; }
    man += poly(khung, '#0C1B16', `stroke="#3D5D53" stroke-width="1"`) + poly(mh, R.lin('mh' + k, [[0, _rmix(sang, -.7)], [1, _rmix(sang, -.82)]])) + ve + poly(mh, '#fff', 'opacity=".05"');

  { const a = bil(Rr, .36, .74, 0, .8, .1, .1), c = bil(Rr, .36, .74, 0, .8, .9, .9); b += `<polygon points="${[bil(Rr, .36, .74, 0, .8, .06, .06), bil(Rr, .36, .74, 0, .8, .94, .06), bil(Rr, .36, .74, 0, .8, .94, .94), bil(Rr, .36, .74, 0, .8, .06, .94)].map(pt).join(' ')}" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/>`; }
  const kp = quad(Rr, .78, .86, .36, .6);
  b += poly(kp, '#0E1E19', 'stroke="#4E7266" stroke-width="1"');
  for(let r = 0; r < 3; r++) for(let c = 0; c < 2; c++){ const p = bil(Rr, .78, .86, .36, .6, .28 + c * .44, .2 + r * .28); b += `<circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="${RP2.neon}" opacity=".85"/>`; }
  { const p = bil(Rr, .78, .86, .36, .6, .5, .92); b += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${RP2.laser}"/><circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${RP2.laser}" opacity=".3"/>`; }
  // tường sau: bản đồ ghim dây

    <path d="M${x + 22} ${y + 20} q16 -14 38 -6 q14 4 10 18 q-8 14 -24 12 q-18 -4 -24 -24z M${x + 100} ${y + 14} q22 -10 46 2 q12 10 0 22 q-10 8 -22 2 q-16 8 -26 -4 q-4 -12 2 -22z M${x + 160} ${y + 42} q20 -8 38 4 q8 12 -4 22 q-18 6 -30 -2 q-10 -12 -4 -24z M${x + 60} ${y + 52} q14 -6 26 4 q4 14 -8 20 q-16 0 -20 -12 q0 -8 2 -12z" fill="#357F64" opacity=".75"/>

  b += soc;
  // đèn trần và chùm sáng
  const dtr = (x1, x2) => `<polygon points="${x1 - 10},${by1 * .62} ${x2 + 10},${by1 * .62} ${x2 + 90},${by2 + 36} ${x1 - 90},${by2 + 36}" fill="${R.lin('cd' + x1, [[0, '#F9BB70', .24], [.7, '#F9BB70', .07], [1, '#F9BB70', 0]])}"/><rect x="${x1}" y="${by1 * .3}" width="${x2 - x1}" height="${by1 * .26}" rx="4" fill="${R.lin('lp' + x1, [[0, '#FEEEDB'], [1, '#FAC37F']])}" opacity=".95"/>`;

  return R.out(`<g class="phong">${b}</g>`);
}

    ${R.bong(2, 2, 46, 5, .38)}
    <path d="M-36 -20 Q-56 -36 -44 -4 Q-40 6 -24 4 M36 -20 Q56 -36 44 -4 Q40 6 24 4" fill="none" stroke="#111E1A" stroke-width="7" stroke-linecap="round"/>
    <rect x="-8" y="-24" width="16" height="9" rx="4" fill="${R.lin('cau', [[0, '#CADED7'], [1, '#607D73']])}" ${R.S(1)}/>${thau(-22)}${thau(22)}
    <rect x="30" y="-40" width="12" height="6" rx="2.4" fill="#283D36"/><circle cx="36" cy="-37" r="2" fill="${RP2.laser}"/>
    ${sang ? sao(-50, -46, 1) + sao(48, -50, .8) + sao(2, -52, .65) : ''}</g>`);
}

/* ---------- kho vật phẩm: danh sách vật phẩm đặc biệt sau mỗi vòng ---------- */
// vp_icon(n): biểu tượng nhỏ của vật phẩm bài n (vẽ trong ô 60x60, gốc = tâm). Hiện mới có bài 1; các bài khác là chỗ giữ chỗ đến khi dựng bài đó.
function vp_icon(n){
  if(n === 1) return `<g transform="translate(0 9) scale(.4)">${kinh_diep_vien_vat()}</g>`;
  return '';
}
// kho_vat_pham({co:[số bài đã lượm], moi:số bài vừa lượm, w, s}) bảng vật phẩm: 13 ô (7 trên, 6 dưới). viewBox "-230 -90 460 180".
// Ô đã lượm: huy hiệu có vật phẩm; ô chưa lượm: bóng mờ có ổ khoá. Class `vp vp-N` để file bài gắn nhãn (tên vật phẩm, công dụng) bằng HTML.
function kho_vat_pham(o = {}){
  const co = o.co || [], moi = o.moi, R = _R(), s = o.s || 1;
  const o1 = n => { const hang = n <= 7 ? 0 : 1, cot = n <= 7 ? n - 1 : n - 8, x = (n <= 7 ? -180 : -150) + cot * 60, y = -42 + hang * 84, c = co.includes(n), m = moi === n;
    return `<g class="vp vp-${n}" transform="translate(${x} ${y})">${m ? `<circle r="35" fill="${RP.vang}" opacity=".35"/><circle r="32" fill="none" stroke="${RP.vang}" stroke-width="2.6"/>` : ''}
      <circle r="28" fill="${R.lin('kv' + n, [[0, '#DEEDE8'], [.5, '#82A197'], [1, '#304C43']], 1, 1)}" ${R.S(1.2)}/><circle r="25" fill="${R.lin('mk' + n, [[0, '#306453'], [1, '#112C23']], .4, 1)}"/><circle r="24" fill="none" stroke="${RP2.neon}" stroke-width="1.2" opacity="${c ? .85 : .2}"/>
      ${c ? vp_icon(n) : `<g opacity=".55" transform="translate(0 2)"><path d="M-6 -3 V-8 a6 6 0 0 1 12 0 V-3" fill="none" stroke="#CADED7" stroke-width="3" stroke-linecap="round"/><rect x="-9.5" y="-3" width="19" height="14" rx="3.4" fill="${R.v('lk' + n, RP.thep, .25, -.2)}"/><circle cx="0" cy="4" r="2.2" fill="${RP.navy}"/></g>`}</g>`; };
  return R.out(`<g class="kho-vat-pham" transform="scale(${s})"><rect x="-226" y="-84" width="452" height="168" rx="14" fill="${R.v('nen', RP.navy, .05, -.3)}" ${R.S(1.6)}/>${Array.from({ length: 13 }, (_, i) => o1(i + 1)).join('')}</g>`);
}
</script>
<script>/* ===== ASSET READING v2 (đợt 4): điệp viên (học sinh), trang bị, phòng nạp kỹ năng, đồng đội bị nhốt. Nạp sau reading-asset-4.js ===== */

// diep_vien({gioi, ao, mu, kinh, giay, gang, s, bieu_cam}) nhân vật điệp viên (học sinh), dùng HỆ CHIBI của Tool (chibi.js) cho thân, đầu, tay, chân; trang bị vẽ chồng lên.
// gioi: 'nam' | 'nu'. ao, mu, kinh, giay, gang: true khi đã nhận trang bị. Gốc = giữa hai bàn chân, cao khoảng 170 ở s = 1. Tư thế đứng thẳng (toạ độ chồng theo tư thế này).
const NHAN_VAT_DV = { nam: { gioi: 'nam', kieu_toc: 'ngan', toc: 'den', ao: 'jade' }, nu: { gioi: 'nu', kieu_toc: 'bui_doi', toc: 'den', ao: 'cam', vay: true, quan: '#375B4F' } };
function diep_vien(o = {}){
  const s = o.s || 1, R = _R(), base = NHAN_VAT_DV[o.gioi || 'nam'];
  const than = chibi({ ...base, ao_khoac: o.ao ? RP2.kaki : undefined, bieu_cam: o.bieu_cam || 'cuoi', tu_the: 'dung', s: 1 });
  const ao = o.ao ? `<path d="M-17 -43 L-22 -9 Q0 -4 22 -9 L17 -43 Z" fill="${R.v('aol', RP2.kaki, .08, -.3)}" ${R.S(1.3)}/><rect x="-17.5" y="-62" width="35" height="6" fill="#5C4630" ${R.S(.9)}/><rect x="-4.5" y="-63.5" width="9" height="9" rx="1.4" fill="${RP.vang}" opacity=".92"/><path d="M-9 -73 L0 -60 L9 -73 L15 -67 L0 -48 L-15 -67 Z" fill="${_rmix(RP2.kaki, -.2)}" ${R.S(1)}/><path d="M0 -58 V-12" stroke="#000" stroke-opacity=".22" stroke-width="1.4"/>` : '';
  const giay = o.giay ? [-1, 1].map(k => `<g transform="translate(${k * 7.2} 0)"><rect x="-6" y="-14" width="12" height="14" rx="3.4" fill="${R.v('bt' + k, '#1D2E29', .12, -.25)}" ${R.S(.9)}/><rect x="-8" y="-6" width="18" height="8.4" rx="4.2" transform="translate(${k > 0 ? 1 : -3} 0)" fill="${R.v('bf' + k, '#1D2E29', .12, -.25)}" ${R.S(.9)}/><rect x="-8" y="1" width="18" height="2.6" rx="1.3" transform="translate(${k > 0 ? 1 : -3} 0)" fill="${RP2.neon}"/></g>`).join('') : '';
  const gang = o.gang ? [-1, 1].map(k => `<g transform="translate(${k * 20.5} -37.5)"><circle r="6.6" fill="${R.v('gg' + k, '#1D2E29', .2, -.2)}" ${R.S(.9)}/><rect x="-5.4" y="-11" width="10.8" height="5" rx="2" fill="#2D423B" ${R.S(.8)}/><path d="M-3 -2 v-3 M0 -2 v-3.4 M3 -2 v-3" stroke="#fff" stroke-opacity=".25" stroke-width=".9" stroke-linecap="round"/></g>`).join('') : '';
  const kinh = o.kinh ? [-1, 1].map(k => `<g transform="translate(${k * 13} -100)"><circle r="11.4" fill="${R.lin('kv' + k, [[0, '#E7F4F0'], [.5, '#91B1A6'], [1, '#3D5B51']], 1, 1)}" stroke="#11211C" stroke-opacity=".6" stroke-width="1"/><circle r="9" fill="#0D2920"/><circle r="9" fill="${RP2.neon}" opacity=".55"/><path d="M-9 0 H9 M0 -9 V9" stroke="#C3F6E3" stroke-opacity=".8" stroke-width=".8"/><path d="M-7 -4.5 A8 8 0 0 1 0 -8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".8"/></g>`).join('') + `<rect x="-4.5" y="-103" width="9" height="4.4" rx="2.2" fill="#819F95"/><path d="M-24 -101 Q-33 -101 -35 -95 M24 -101 Q33 -101 35 -95" stroke="#111E1A" stroke-width="3.6" fill="none" stroke-linecap="round"/>` : '';
  const mu = o.mu ? `<g transform="translate(0 -128)"><ellipse cx="0" cy="4" rx="46" ry="10" fill="#101F1A" ${R.S(1)}/><path d="M-27 2 C-27 -24 -16 -33 0 -33 C16 -33 27 -24 27 2 Z" fill="${R.v('mu', '#2D423B', .15, -.3)}" ${R.S(1.2)}/><path d="M-27 -3 H27 V-10 H-27 Z" fill="${RP.do}"/><path d="M-13 -31 Q0 -24 13 -31" stroke="#000" stroke-opacity=".4" fill="none" stroke-width="2"/></g>` : '';
  return R.out(`<g transform="scale(${s})">${than}${ao}${giay}${gang}${kinh}${mu}</g>`);
}

// vp_ao(sang), vp_mu(sang), vp_giay(sang): trang bị nằm trên bàn, chờ học sinh chạm lượm. Gốc = giữa mặt bàn dưới món đồ.
function _vp_khung(R, sang, ruot, rong = 56){
  const sao = (x, y, k) => `<path d="M${x} ${y - 7 * k} L${x + 1.8 * k} ${y - 1.8 * k} L${x + 7 * k} ${y} L${x + 1.8 * k} ${y + 1.8 * k} L${x} ${y + 7 * k} L${x - 1.8 * k} ${y + 1.8 * k} L${x - 7 * k} ${y} L${x - 1.8 * k} ${y - 1.8 * k} Z" fill="#fff" opacity=".95"/>`;
  return `<g class="vat-pham">${sang ? `<g class="goi-y"><defs><radialGradient id="${R.id}qh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${RP.vang}" stop-opacity=".55"/><stop offset=".6" stop-color="${RP.vang}" stop-opacity=".18"/><stop offset="1" stop-color="${RP.vang}" stop-opacity="0"/></radialGradient></defs><ellipse cx="0" cy="-18" rx="${rong + 14}" ry="46" fill="url(#${R.id}qh)"/></g>` : ''}${R.bong(2, 2, rong * .8, 5, .38)}${ruot}${sang ? sao(-rong + 6, -50, 1) + sao(rong - 4, -52, .8) + sao(0, -56, .65) : ''}</g>`;
}
function vp_ao(o = {}){ const R = _R(), s = o.s || 1; return R.out(`<g transform="scale(${s})">${_vp_khung(R, o.sang, `
  <path d="M-30 -2 L-30 -34 L-14 -42 L0 -30 L14 -42 L30 -34 L30 -2 Z" fill="${R.v('ao', RP2.kaki, .1, -.3)}" ${R.S(1.4)}/><path d="M-14 -42 L0 -28 L14 -42 L8 -46 L0 -38 L-8 -46 Z" fill="${_rmix(RP2.kaki, -.22)}" ${R.S(1.1)}/>
  <rect x="-30" y="-20" width="60" height="6" fill="#5C4630"/><rect x="-5" y="-22" width="10" height="10" rx="1.6" fill="${RP.vang}"/><path d="M0 -28 V-2" stroke="#000" stroke-opacity=".25" stroke-width="1.4"/>`)}</g>`); }
function vp_mu(o = {}){ const R = _R(), s = o.s || 1; return R.out(`<g transform="scale(${s})">${_vp_khung(R, o.sang, `
  <ellipse cx="0" cy="-8" rx="38" ry="10" fill="#101F1A" ${R.S(1.2)}/><path d="M-23 -9 C-23 -34 -14 -42 0 -42 C14 -42 23 -34 23 -9 Z" fill="${R.v('mu', '#2D423B', .15, -.3)}" ${R.S(1.3)}/><path d="M-23 -13 H23 V-20 H-23 Z" fill="${RP.do}"/><path d="M-12 -40 Q0 -33 12 -40" stroke="#000" stroke-opacity=".4" fill="none" stroke-width="2"/><path d="M-30 -10 Q0 -2 30 -10" stroke="#fff" stroke-opacity=".25" fill="none" stroke-width="2"/>`)}</g>`); }
function vp_giay(o = {}){ const R = _R(), s = o.s || 1, bot = x => `<g transform="translate(${x} 0)"><rect x="-8" y="-26" width="16" height="26" rx="5" fill="${R.v('bt' + x, '#1D2E29', .14, -.25)}" ${R.S(1)}/><rect x="-10" y="-12" width="30" height="12" rx="6" fill="${R.v('bf' + x, '#1D2E29', .14, -.25)}" ${R.S(1)}/><rect x="-10" y="-3" width="30" height="3.4" rx="1.7" fill="${RP2.neon}"/><path d="M-5 -22 V-6" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/></g>`;
  return R.out(`<g transform="scale(${s})">${_vp_khung(R, o.sang, bot(-22) + bot(18))}</g>`); }

function vp_gang(o = {}){ const R = _R(), s = o.s || 1, g = x => `<g transform="translate(${x} 0) scale(${x < 0 ? -1 : 1} 1)"><path d="M-12 -4 L-12 -28 Q-12 -34 -7 -34 Q-3 -34 -3 -28 L-3 -36 Q-3 -42 2 -42 Q7 -42 7 -36 L7 -34 Q10 -36 13 -33 Q15 -30 13 -22 L12 -4 Z" fill="${R.v('gv' + x, '#1D2E29', .16, -.22)}" ${R.S(1.2)}/><rect x="-13" y="-8" width="26" height="8" rx="3" fill="#2D423B" ${R.S(1)}/><path d="M-7 -30 V-14 M2 -36 V-14" stroke="#fff" stroke-opacity=".18" stroke-width="1.6" stroke-linecap="round"/></g>`;
  return R.out(`<g transform="scale(${s})">${_vp_khung(R, o.sang, g(-20) + g(20), 62)}</g>`); }

// dong_doi_nhot({s}) đồng đội bị nhốt: bóng người ngồi sau ô kính có song sắt và đèn báo đỏ. Gốc = giữa chân. Rộng 110, cao 120.
function dong_doi_nhot(o = {}){
  const s = o.s || 1, R = _R();
  return R.out(`<g transform="scale(${s})" class="dong-doi">
    <rect x="-55" y="-120" width="110" height="120" rx="8" fill="${R.lin('lk', [[0, '#1D4135'], [1, '#0D1E19']])}" ${R.S(1.6)}/>
    <ellipse cx="0" cy="-44" rx="40" ry="16" fill="${RP.vang}" opacity=".14"/>
    <circle cx="0" cy="-68" r="15" fill="#0B1713"/><path d="M-24 -4 C-24 -38 -14 -52 0 -52 C14 -52 24 -38 24 -4 Z" fill="#0B1713"/><path d="M-30 -8 L-34 -52 M30 -8 L34 -52" stroke="#0B1713" stroke-width="7" stroke-linecap="round"/>
    ${[-36, -18, 0, 18, 36].map(x => `<rect x="${x - 2.4}" y="-118" width="4.8" height="116" rx="2.4" fill="${R.lin('sb' + x, [[0, '#CADED7'], [1, '#607D73']], 1, 0)}" ${R.S(.8)}/>`).join('')}
    <rect x="-55" y="-62" width="110" height="5" fill="#607D73" ${R.S(.8)}/>
    ${_den3(0, -134, 6, RP2.laser)}<polygon points="-30,-122 30,-122 40,-132 -40,-132" fill="#2D423B"/></g>`);
}

// phong_nap_ky_nang({w,h,tran,nap,cua}) phòng nạp kỹ năng: phối cảnh như phòng giải mã, tường sau là màn hình lớn có 4 thanh nạp, tường trái là dãy tủ đồ, tường phải là cửa gia cố
// (cua: 0 đóng đèn đỏ, 1 mở đèn xanh). nap: mảng 4 số 0..1, độ đầy của 4 thanh nạp. viewBox "0 0 w h" (760x300).
function phong_nap_ky_nang(o = {}){
  const w = o.w || 760, h = o.h || 300, T = o.tran == null ? 300 : o.tran, R = _R(), nap = o.nap || [0, 0, 0, 0], cua = o.cua || 0;
  const bx1 = w * .224, bx2 = w - bx1, by1 = h * .133, by2 = h * .567, cx = w / 2;
  const L = (d, hh) => { const top = by1 * d, bot = h - (h - by2) * d; return [bx1 * d, bot - hh * (bot - top)]; }, Rr = (d, hh) => { const p = L(d, hh); return [w - p[0], p[1]]; };
  const pt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1), quad = (F, d1, d2, h1, h2) => [F(d1, h1), F(d2, h1), F(d2, h2), F(d1, h2)], poly = (pts, fill, ex = '') => `<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" ${ex}/>`;
  let b = `<rect x="${-T}" y="${-T}" width="${w + 2 * T}" height="${T + by1 * .5}" fill="#0B1C16"/><rect x="${-T}" y="${h - 2}" width="${w + 2 * T}" height="${T + 2}" fill="#111E1A"/><rect x="${-T}" y="0" width="${T + 2}" height="${h}" fill="${RP2.dem2}"/><rect x="${w - 2}" y="0" width="${T + 2}" height="${h}" fill="${RP2.dem2}"/>`;
  b += `<rect x="${bx1}" y="${by1}" width="${bx2 - bx1}" height="${by2 - by1}" fill="${R.lin('tsau', [[0, '#2C6553'], [1, '#1A4336']])}"/>` + poly([[0, 0], [bx1, by1], [bx1, by2], [0, h]], R.lin('ttrai', [[0, '#122E25'], [1, '#215242']], 1, 0)) + poly([[w, 0], [bx2, by1], [bx2, by2], [w, h]], R.lin('tphai', [[0, '#255847'], [1, '#133027']], 1, 0))
    + poly([[0, 0], [w, 0], [bx2, by1], [bx1, by1]], R.lin('tran', [[0, '#07130F'], [1, '#193D31']])) + poly([[0, h], [w, h], [bx2, by2], [bx1, by2]], R.lin('san', [[0, '#203C33'], [1, '#0D1E18']]));
  let g = ''; for(let i = -5; i <= 5; i++) g += `<line x1="${cx + i * (bx2 - bx1) / 10}" y1="${by2}" x2="${cx + i * w / 10}" y2="${h}" stroke="#89F5D2" stroke-opacity=".09" stroke-width="1.4"/>`;
  for(let k = 1; k <= 7; k++){ const t = Math.pow(k / 7, 1.75), y = by2 + (h - by2) * t, xl = bx1 * (1 - t); g += `<line x1="${xl}" y1="${y}" x2="${w - xl}" y2="${y}" stroke="#89F5D2" stroke-opacity="${.05 + t * .06}" stroke-width="${1 + t}"/>`; }
  b += g + `<defs><radialGradient id="${R.id}vp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#58D5A6" stop-opacity=".22"/><stop offset="1" stop-color="#58D5A6" stop-opacity="0"/></radialGradient></defs><ellipse cx="${cx}" cy="${by2 + (h - by2) * .6}" rx="${w * .26}" ry="${(h - by2) * .5}" fill="url(#${R.id}vp)"/>`;
  // tường sau: màn hình lớn + 4 thanh nạp kỹ năng
  const sx = bx1 + 44, sy = by1 + 10, sw = bx2 - bx1 - 88, sh = by2 - by1 - 24;
  b += `<rect x="${sx - 6}" y="${sy - 6}" width="${sw + 12}" height="${sh + 12}" rx="8" fill="#0B1814" stroke="#3D5D53" stroke-width="1.4"/><rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="4" fill="${R.lin('scr', [[0, '#174A39'], [1, '#0E3326']])}"/>`
    + `<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="4" fill="none" stroke="${RP2.neon}" stroke-opacity=".5" stroke-width="1.4"/>`
    + nap.map((v, i) => { const y = sy + 14 + i * ((sh - 28) / nap.length), bw = sw - 40; return `<rect x="${sx + 20}" y="${y}" width="${bw}" height="8" rx="4" fill="#081A14"/><rect x="${sx + 20}" y="${y}" width="${Math.max(0, bw * v)}" height="8" rx="4" fill="${v >= 1 ? '#6BE39A' : RP2.neon}" opacity=".95"/><circle cx="${sx + 12}" cy="${y + 4}" r="4" fill="${v >= 1 ? '#6BE39A' : '#2E4F44'}"/>`; }).join('');
  // tường trái: dãy tủ đồ
  for(let c = 0; c < 3; c++){ const d1 = .26 + c * .24, d2 = d1 + .21, q = quad(L, d1, d2, .02, .86); b += poly(q, '#0C1B16', 'stroke="#3D5D53" stroke-width="1"') + poly(quad(L, d1 + .02, d2 - .02, .06, .82), R.lin('lk' + c, [[0, '#2F5548'], [1, '#1E3D33']], 1, 0)); const hnd = L((d1 + d2) / 2 + .03, .46); b += `<circle cx="${hnd[0]}" cy="${hnd[1]}" r="2.4" fill="${RP.thep}"/>`; }
  // tường phải: cửa gia cố, đèn khoá
  const cs = quad(Rr, .34, .74, 0, .82), den = cua >= 1 ? '#6BE39A' : RP2.laser;
  b += poly(quad(Rr, .32, .76, 0, .85), '#0B1814', 'stroke="#3D5D53" stroke-width="1.2"') + poly(cs, R.lin('cuaP', [[0, '#3D5D53'], [1, '#244037']], 1, 0), 'stroke="#000" stroke-opacity=".4"');
  for(let i = 0; i < 6; i++){ const a = Rr(.34, .06 + i * .13), c2 = Rr(.74, .06 + i * .13 + .06); b += `<polygon points="${pt(a)} ${pt(Rr(.74, .06 + i * .13))} ${pt(c2)} ${pt(Rr(.34, .06 + i * .13 + .06))}" fill="${i % 2 ? '#EBA855' : '#1D2E29'}" opacity=".22"/>`; }
  { const p = Rr(.55, .93); b += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${den}"/><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${den}" opacity=".3"/>`; }
  b += `<polygon points="${bx1 + 30},${by1 * .3} ${bx2 - 30},${by1 * .3} ${bx2 - 50},${by1 * .62} ${bx1 + 50},${by1 * .62}" fill="#D2F4E8" opacity=".85"/>`;
  b += `<defs><radialGradient id="${R.id}vi" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient></defs><rect x="${-T}" y="${-T}" width="${w + 2 * T}" height="${h + 2 * T}" fill="url(#${R.id}vi)" pointer-events="none"/>`;
  return R.out(`<g class="phong-nap">${b}</g>`);
}

// cua_gia_co({mo, s}) cửa gia cố của phòng giải cứu: khung thép, dải vàng đen, cánh cửa trượt lên (mo 0..1), đèn đỏ chuyển xanh khi mở. Gốc = giữa chân. Rộng 120, cao 130.
function cua_gia_co(o = {}){
