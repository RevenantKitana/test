<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bài 1: Nhận diện cách diễn đạt tương đương</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bộ màu chuẩn của hệ thống (02_design_tiengAnh_v6.md, Mục 1). Nền phòng tối, nhưng mọi màu giao diện lấy từ token này. */
:root{
  --cream:#FAF7F0;--cream-2:#F0EADD;--cream-3:#E7DECC;--paper:#FFFDF8;--line:#E5DECF;--line-2:#D6CCB6;
  --ink:#1A1A1A;--ink-2:#514C44;--ink-3:#7C756A;--ink-faint:#ABA396;
  --jade:#3CA57A;--jade-deep:#2A8167;--jade-dark:#14432F;--jade-text:#1B5E48;--jade-soft:#A9D0BE;--jade-pale:#DCEAE1;
  --sage:#A8C9B8;--sage-deep:#7CA792;--sage-text:#46685A;--sage-pale:#E1ECE4;
  --accent:#E8A24A;--accent-deep:#CE8A33;--accent-text:#8A551A;--accent-pale:#F7E7CD;
  --correct:#2A8167;--correct-bg:#DCEAE1;--wrong:#A84B2C;--wrong-bg:#F3E2D6;--warning:#C58A2E;--info:#4E7F92;--info-bg:#DCE7EB;
  --white:#FFFFFF;--radius-lg:22px;--radius:14px;--radius-sm:10px;
  --bg:#0C2219;--bg-2:#14432F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom))}
#stage{--kho:0px;position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--radius-lg);background:#08170F;box-shadow:0 0 0 1px #ffffff1a}
#nen{position:absolute;inset:0}#nen svg{width:100%;height:100%;display:block}
#nen::after{content:"";position:absolute;inset:0;background:rgba(6,22,15,.55)}
#nen.sang::after{background:rgba(6,22,15,0)}
#man{position:absolute;left:0;right:0;bottom:0;top:var(--kho);overflow:auto;padding:10px 12px 70px;display:flex;flex-direction:column;align-items:center}
#cu{position:absolute;inset:0;display:none}#cu svg{width:100%;height:100%;display:block}
#nd{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;margin:auto 0}
#nd #day{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
#kho{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:7;display:none;gap:6px;pointer-events:none;align-items:flex-start}
#kho .o{width:70px;text-align:center;opacity:.42;filter:grayscale(1)}#kho .o.co{opacity:1;filter:drop-shadow(0 0 6px #E8A24Aaa)}
#kho .o svg{width:42px;height:42px;display:block;margin:0 auto}
#kho small{display:block;font-size:12px;line-height:1.2;font-weight:700;color:var(--cream);margin-top:1px;text-shadow:0 1px 3px #000}
#tiep{position:absolute;right:12px;bottom:12px;z-index:8;min-width:132px;min-height:48px;padding:0 22px;border:0;border-radius:var(--radius-lg);background:var(--jade-deep);color:var(--white);font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--jade-dark),0 8px 16px #0006;display:none}
#tiep:active{transform:translateY(2px);box-shadow:0 2px 0 var(--jade-dark)}
#loi{display:flex;gap:10px;align-items:stretch;margin:8px 0 0;padding:8px 12px;background:var(--bg-2);border-radius:var(--radius-lg);color:var(--cream);min-height:84px;max-height:32%;overflow:auto;box-shadow:0 0 0 1px #ffffff1a}
#ava{flex:none;width:64px;height:64px;margin:auto 0}#ava svg{width:100%;height:100%;display:block}
#txt{font-size:16px;line-height:1.5;margin:auto 0}#txt b{color:var(--jade-soft)}#txt i{color:var(--accent);font-style:normal;font-weight:600}
#tien{display:flex;gap:6px;justify-content:center;padding:8px 0 2px}#tien i{width:9px;height:9px;border-radius:50%;background:#ffffff33}#tien i.xong{background:var(--jade)}#tien i.nay{background:var(--accent);box-shadow:0 0 0 3px #E8A24A44}
/* thẻ nội dung */
.the{background:var(--paper);border-radius:var(--radius-lg);padding:14px 16px;width:100%;max-width:640px;box-shadow:0 8px 24px #0007;font-size:16px;line-height:1.55;color:var(--ink)}
.huong{width:100%;max-width:640px;text-align:center;color:var(--cream);font-size:15px;font-weight:700;margin-bottom:10px;text-shadow:0 1px 4px #000a}
.tk-h{width:100%;max-width:640px;text-align:center;color:var(--jade-soft);font-weight:800;font-size:17px;margin-bottom:10px;text-shadow:0 1px 4px #000a}
.stem{margin:0 0 4px;font-weight:600}
/* bức điện, bài đọc */
.dien{position:relative;background:var(--paper);border-radius:var(--radius-sm);padding:30px 18px 16px 30px;width:100%;max-width:520px;box-shadow:0 6px 16px #0008;font-size:19px;line-height:1.6;color:var(--ink)}
.dien::before{content:"";position:absolute;left:0;top:0;right:0;height:16px;background:var(--accent-deep);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.dien::after{content:"";position:absolute;left:10px;top:34px;bottom:14px;width:6px;background:radial-gradient(circle,#7C756A66 2px,transparent 3px) 0 0/6px 22px}
.dien+.dien{margin-top:14px}
.dien b.cum{font-weight:800;border-bottom:3px dashed var(--accent);cursor:pointer;padding:3px 3px;border-radius:5px;display:inline-block;min-height:30px;color:var(--ink)}
.dien b.cum.on{background:var(--accent-pale);border-bottom:3px solid var(--accent-deep);color:var(--accent-text)}
.bao{background:var(--paper);border-radius:var(--radius-sm);padding:20px 18px 14px;width:100%;max-width:600px;box-shadow:0 6px 16px #0008;position:relative;font-size:17px;line-height:1.65;color:var(--ink)}
.bao::before{content:"";position:absolute;left:0;top:0;right:0;height:12px;background:var(--jade-dark);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.bao::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 38px 38px 0;border-color:transparent var(--accent) transparent transparent}
.dv{font-size:17px}
.bao.mini{width:120px;padding:22px 12px 12px;font-size:0}.bao.mini::after{border-width:0 22px 22px 0}.barra{height:8px;border-radius:4px;background:var(--line-2);margin:7px 0}.barra.c{width:70%}.barra.b{width:85%;background:var(--accent)}
.doc2{display:flex;align-items:center;gap:0;width:100%;max-width:560px;justify-content:center}.doc2 svg{width:84px;height:32px;flex:none}
/* ghép cặp, chip */
.cip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:560px}
.chip{min-height:56px;border:2px solid var(--line-2);border-radius:var(--radius);background:var(--cream);color:var(--ink);font-weight:700;font-size:17px;padding:6px 8px;box-shadow:0 3px 0 var(--line-2)}
.chip.chon{border-color:var(--accent);background:var(--accent-pale);box-shadow:0 3px 0 var(--accent-deep)}
.chip.khoa{border-color:var(--jade-deep);background:var(--jade-pale);color:var(--jade-text);box-shadow:none;cursor:default;display:flex;align-items:center;justify-content:center;text-align:center}
.chip.rung{animation:rung .3s;border-color:var(--wrong);background:var(--wrong-bg)}
.chip.big{font-size:16px;font-weight:600;min-height:58px;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px}.chip.big b{color:var(--accent-text);font-weight:800}
@keyframes rung{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.capxong{display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px;margin-bottom:10px}.cap{display:flex;align-items:center}.cap .chip{flex:1}.cap svg{width:76px;height:30px;flex:none}
.capxong.v{gap:14px}.par{display:flex;flex-direction:column;align-items:center;gap:0;width:100%}.par .chip{width:100%}.par svg{width:28px;height:30px;flex:none}
@media (min-width:760px){.capxong.v{max-width:760px}.par{flex-direction:row}.par .chip{flex:1;width:auto}.par svg{width:70px;height:28px;transform:rotate(90deg)}}
/* câu trắc nghiệm */
.pas{display:flex;flex-direction:column;gap:8px;margin-top:12px;width:100%}
.pa{display:flex;gap:10px;align-items:flex-start;min-height:48px;padding:8px 12px;border:2px solid var(--line-2);border-radius:var(--radius);background:var(--white);text-align:left;color:var(--ink);font-size:16px;line-height:1.45;width:100%}
.pa .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--jade-dark);color:var(--white);font-weight:800;display:grid;place-items:center;font-size:14px;margin-top:1px}
.pa.chon{border-color:var(--accent);background:var(--accent-pale)}
.pa.dung{border-color:var(--correct);background:var(--correct-bg)}.pa.dung .l{background:var(--correct)}
.pa.sai{border-color:var(--wrong);background:var(--wrong-bg)}.pa.sai .l{background:var(--wrong)}
.pa.rung{animation:rung .3s}.pa.kh{opacity:.55}.pa .dau{margin-left:auto;font-weight:800;font-size:18px}.pa.mau{cursor:default}
.pa.lua{border-color:var(--accent);background:var(--accent-pale)}.pa.lua .dau{color:var(--accent-deep);animation:hien .3s}
/* tô cụm */
.w{border-radius:4px}.w.chung{opacity:.38}
.w.ha{background:var(--info-bg);box-shadow:0 0 0 2px var(--info-bg);color:var(--info)}
.w.hb{background:var(--accent-pale);box-shadow:0 0 0 2px var(--accent-pale);color:var(--accent-text)}
.w.hc{background:var(--accent);color:var(--ink);font-weight:800;box-shadow:0 0 0 3px #E8A24A99}
.w.hs{background:var(--wrong-bg);color:var(--wrong);font-weight:700;box-shadow:0 0 0 2px var(--wrong-bg)}
.w.nhap{background:var(--accent-pale);color:var(--accent-text);font-weight:800;cursor:pointer;animation:nhap 1s ease-in-out infinite}
@keyframes nhap{0%,100%{box-shadow:0 0 0 2px var(--accent-pale)}50%{box-shadow:0 0 0 6px #E8A24A99}}
/* lời giải, nút phụ */
.gt{margin-top:10px;padding:10px 12px;border-radius:var(--radius);background:var(--jade-pale);border-left:5px solid var(--jade-deep);font-size:15.5px;line-height:1.55;color:var(--ink)}
.gt.sai{background:var(--wrong-bg);border-left-color:var(--wrong)}.gt p{margin:0 0 6px}.gt p:last-child{margin:0}
.nut2{min-height:44px;padding:0 16px;border-radius:var(--radius-lg);border:2px solid var(--jade-deep);background:var(--white);color:var(--jade-text);font-weight:700;font-size:15px;margin-top:8px}.nut2.on{background:var(--jade-deep);color:var(--white)}
.dich{margin-top:8px;font-size:15.5px;background:var(--cream-2);border-radius:var(--radius-sm);padding:8px 12px;color:var(--ink)}
.tbl{border-collapse:collapse;width:100%;margin:6px 0;font-size:14.5px}.tbl td,.tbl th{border:1px solid var(--line-2);padding:6px 8px;text-align:left;vertical-align:top;color:var(--ink)}.tbl th{background:var(--cream-2)}
.vd{background:var(--cream);border-radius:var(--radius);padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.55;color:var(--ink)}.vd p{margin:0 0 6px}
.vd b,.the b,.gt b,.dich b{color:var(--accent-text)}.vd .vi{color:var(--ink-3);font-size:14.5px}.vd .lb{color:var(--ink-3);font-weight:700;font-size:14px;display:block}
.en{color:var(--accent);font-weight:800}
.hoi{color:var(--accent-text)}
/* dụng cụ, thẻ tiến trình */
.dc{display:flex;gap:8px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.dcs{display:inline-block;width:78px;height:78px}.dcs.lon{width:104px;height:104px}.dcs svg{width:100%;height:100%;display:block}
.dots18{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;width:100%;max-width:420px;margin:12px 0}.dots18 i{aspect-ratio:1;border-radius:50%;background:#ffffff22;box-shadow:inset 0 0 0 2px #ffffff44}.dots18 i.on{background:linear-gradient(var(--jade),var(--jade-deep));box-shadow:0 0 12px #3CA57A66}
.tt{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:stretch;width:100%;max-width:760px}.tt .mt{display:flex;align-items:center;font-size:30px;font-weight:800;color:var(--jade-soft)}
.st{width:158px;min-height:176px;border-radius:var(--radius-lg);border:2px solid var(--line-2);background:var(--paper);color:var(--ink);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14.5px;line-height:1.3;text-align:center}
.st .sn{width:34px;height:34px;border-radius:50%;background:var(--jade-deep);color:var(--white);font-size:20px;display:grid;place-items:center}.st.on{background:var(--accent-pale);border-color:var(--accent);box-shadow:0 0 0 3px #E8A24A66}.st.on .sn{background:var(--accent-deep);color:var(--white)}
.mv{display:flex;flex-direction:column;gap:5px;width:112px;margin:4px 0}.mv .r{display:flex;gap:4px;height:14px;background:var(--white);border-radius:5px;padding:3px;box-shadow:0 1px 4px #0003}.mv .r i{flex:1;border-radius:3px;background:var(--line-2)}.mv .r i.d{flex:1.4;background:var(--accent)}.mv .pg{display:flex;flex-direction:column;gap:5px;background:var(--white);padding:7px;border-radius:6px;box-shadow:0 1px 4px #0003}.mv .pg i{height:6px;border-radius:3px;background:var(--line-2)}.mv .pg i.on{background:var(--accent)}.mv .lk{display:flex;align-items:center;justify-content:center;gap:2px}.mv .lk b{width:34px;height:20px;background:var(--white);border-radius:4px;box-shadow:0 1px 4px #0003}.mv .lk s{width:26px;height:5px;border-radius:3px;background:var(--jade);text-decoration:none}.mv .ok{font-size:34px;color:var(--jade-deep);text-align:center;font-weight:800}
.bv{min-height:150px;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.vz{display:flex;flex-direction:column;gap:10px;align-items:center}.vz.row{flex-direction:row;gap:0}.vz.row svg{width:90px;height:34px}
.vz-op{display:flex;gap:6px;width:240px;height:30px;background:var(--white);border-radius:9px;padding:6px;box-shadow:0 4px 10px #0005}.vz-op i{flex:1;border-radius:4px}.vz-op i.c{background:var(--line-2);opacity:.7}.vz-op i.d{flex:1.4;background:var(--accent)}
.vz-op.sm{width:120px}.vz-op.ok{outline:3px solid var(--correct);background:var(--correct-bg);position:relative}.vz-op.ok span{position:absolute;right:-30px;top:-2px;color:var(--jade);font-weight:800;font-size:22px}
.vz-pg{display:flex;flex-direction:column;gap:7px;width:240px;padding:12px;background:var(--paper);border-radius:9px;box-shadow:0 4px 10px #0005}.vz-pg i{height:9px;border-radius:4px;background:var(--line-2)}.vz-pg i.on{background:var(--accent)}.vz-pg.sm{width:120px}
/* điều khiển Xem mẫu */
.ctl{display:flex;gap:8px;margin-top:10px}.ctl button{flex:1;min-height:48px;border-radius:var(--radius-lg);border:0;font-weight:800;font-size:16px;background:var(--jade-deep);color:var(--white)}.ctl button.ph{background:var(--jade-pale);color:var(--jade-text)}
.kq{display:flex;gap:10px;font-weight:800;font-size:18px;margin:8px 0;color:var(--ink)}
.chon-nv{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;width:100%}.nv{border:3px solid var(--jade-soft);border-radius:var(--radius-lg);background:var(--paper);padding:10px 16px 12px;color:var(--ink);font-weight:800;font-size:18px;min-width:150px;box-shadow:0 6px 18px #0006}.nv svg{width:130px;height:190px;display:block;margin:0 auto}.nv:focus-visible,.nv.on{outline:4px solid var(--accent)}
.goi-y{animation:tho 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tho{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes hien{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
@media (max-width:560px){#kho{gap:4px}#kho .o{width:56px}#kho .o svg{width:38px;height:38px}#loi{min-height:76px}#txt{font-size:15.5px}.dien{font-size:18px}#ava{width:56px;height:56px}
  .tt{flex-direction:column;align-items:center}.tt .mt{transform:rotate(90deg);height:30px;justify-content:center}.st{width:100%;max-width:320px;min-height:0;flex-direction:row;text-align:left}.mv{width:100px;flex:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== file 2: phòng giải cứu ===== */
#kho .o.dcm{width:50px;opacity:1;filter:none}
.chia{display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:1040px;align-items:start}
@media (min-width:900px){.chia{grid-template-columns:minmax(320px,42%) 1fr}.trai{position:sticky;top:0}}
.hs{background:var(--paper);border-radius:var(--radius-lg);padding:10px 14px 14px;box-shadow:0 8px 24px #0007;color:var(--ink);width:100%}.hs.one{max-width:680px}
.hs::before{content:"";display:block;height:10px;margin:-10px -14px 8px;background:var(--jade-dark);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.hs-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.hs-i{width:44px;height:34px;display:block}.hs-i svg{width:100%;height:100%}
.nut2.sm{min-height:40px;margin-top:0;padding:0 12px;font-size:14px}.hs-h .tg{margin-left:auto}
.hs-t{font-size:16px;line-height:1.7;max-height:min(46vh,420px);overflow:auto;padding-right:4px}.hs.one .hs-t{max-height:none}.hs.thu .hs-t{display:none}
.dn{margin:0 0 8px}.sd{color:var(--jade-text);font-size:14px;margin-right:2px}
.sc{border-radius:5px}.sc.chon-c{cursor:pointer;background:var(--cream-2);box-shadow:0 0 0 2px var(--cream-2);animation:nhap 1.4s ease-in-out infinite}
.sc.sel{background:var(--accent-pale);box-shadow:0 0 0 2px var(--accent);color:var(--accent-text);font-weight:700;animation:none}
.sc.ok{background:var(--accent);color:var(--ink);font-weight:700;box-shadow:0 0 0 2px var(--accent)}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.gl span{background:var(--cream-2);border-radius:var(--radius-sm);padding:4px 9px;font-size:14.5px;color:var(--ink-2)}
.phai{display:flex;flex-direction:column;gap:10px;min-width:0}
.kh{display:flex;align-items:center;justify-content:center;gap:10px;background:#00000040;border-radius:var(--radius-lg);padding:6px 10px}.ko{width:min(46%,190px)}.ko svg{width:100%;display:block}
.kt{display:flex;flex-direction:column;align-items:center;gap:6px}.kt .dcs{width:64px;height:64px}
.bcs{display:flex;gap:6px}.bcs i{width:30px;height:30px;border-radius:50%;background:#ffffff26;color:var(--cream);font-style:normal;font-weight:800;font-size:16px;display:grid;place-items:center}.bcs i.nay{background:var(--accent);color:var(--ink);box-shadow:0 0 0 3px #E8A24A66}.bcs i.xong{background:var(--jade);color:var(--white)}
.buoc-h{font-weight:800;color:var(--jade-text);font-size:15.5px;margin:10px 0 6px}
.mo-mo{opacity:.5}
.w.tu{cursor:pointer;padding:1px 2px;border-radius:5px;border-bottom:2px dashed var(--accent)}.w.tu.mk{background:var(--accent-pale);border-bottom:2px solid var(--accent-deep);color:var(--accent-text);font-weight:700}
.xg{width:100%;background:var(--jade-deep);color:var(--white);border-color:var(--jade-deep)}
.manh-h{width:150px;margin:0 auto -6px}.manh-h svg{width:100%;display:block}
.manh{background:var(--paper);border-left:5px solid var(--jade-deep);border-radius:var(--radius);padding:8px 12px;font-size:15px;line-height:1.5;color:var(--ink);box-shadow:0 4px 12px #0005;margin-top:6px}
.dct{display:flex;flex-direction:column;gap:8px}.dcr{display:flex;flex-direction:column;gap:6px;border:2px solid var(--line-2);border-radius:var(--radius);padding:8px 10px;background:var(--white)}

  "lines": [
   "Every year, the Reuters Institute at the University of Oxford publishes its Digital News Report, one of the largest studies of how people get their news. The 2025 edition was based on a survey of nearly 100,000 people in 48 countries and territories. One of its main findings concerned trust. Only 40% of people said that they trusted most news most of the time, and this figure has stayed at the same level for three years in a row. However, the global average hides large differences. In Finland, 67% of people trusted the news, while in Hungary and Greece the figure was just 22%.",
   "Low trust is closely connected with another trend: news avoidance. In 2025, 40% of people said that they sometimes or often avoided the news, compared with 29% in 2017. According to the report, many people feel that the news is often upsetting, and younger audiences increasingly say that it is too hard to understand.",
   "The way people get their news is also changing. The share of people who watch news videos on social platforms reached 65% in 2025, up from 52% five years earlier. In the United States, social media and video platforms became the most common way to get news for the first time. They were used by 54% of people, compared with 50% for television and 48% for news websites.",
   "Age plays an important role in these changes. Among 18- to 24-year-olds, 44% said that social media and video networks were their main source of news, compared with only 20% of people aged 55 and over. Older people still tend to prefer television, websites and written news. To reach younger audiences, some news organisations are trying new ideas. The BBC, for example, is using artificial intelligence to offer news that matches each user's interests."

<script>/* ===== ATHENA: mascot của team, vẽ lại bằng SVG theo hình gốc "Athena Mascot.png" =====
   athena(opt) → chuỗi <g>, gốc (0,0) = giữa hai chân trên mặt đất; cao ~140 ở s = 1 (thấp hơn học sinh chibi một chút).
   opt: { bieu_cam:'vui'|'cuoi'|'noi'|'ngac_nhien'|'boi_roi'|'nham_mat'|'tap_trung', mieng_mo:bool (nhép miệng khi nói),
          quay:1|-1, s, man_hinh: chuỗi SVG hiện trên mặt nạ thay cho mặt (ví dụ biểu tượng), phat_sang:bool (mặt nạ sáng) }
   Athena không có tay. Cử chỉ thể hiện bằng nghiêng người, nhún nhảy, biểu cảm trên mặt nạ và tia chiếu từ mặt nạ.
   athena_mat(opt) → avatar cho ô lời thoại: đúng hình athena() toàn thân trong khung tròn, viewBox "-60 -60 120 120"
   Điểm phát tia chiếu (toạ độ gốc, trước khi nhân s): ATHENA_TIA = {x: 0, y: -80}                                  */
const ATHENA_PAL = { xanh:'#62A88A', xanh_toi:'#4A8C71', xanh_nhat:'#8CC7AE', kem:'#F4E7C9', kem_toi:'#E2D1AC', mat_na:'#1D2321', mat:'#7FE3B8' };
const ATHENA_TIA = { x: 0, y: -80 };
let _athId = 0;
const _athNs = 'ath' + Math.random().toString(36).slice(2, 6) + '_';

function _athena_mat_na(o, id, P, bc){   // mặt nạ, mắt, miệng của athena()
  let d = '';
  const mn = 'M-48 -82 C-50 -102 -38 -108 -22 -106 C-12 -115 12 -115 22 -106 C38 -108 50 -102 48 -82 C47 -62 28 -52 0 -52 C-28 -52 -47 -62 -48 -82 Z';
  if(o.phat_sang) d += `<ellipse cx="0" cy="-84" rx="58" ry="40" fill="url(#${id}gl)"/>`;
  d += `<path d="${mn}" fill="url(#${id}mn)"/><path d="M-38 -98 Q-26 -104 -14 -102" stroke="#fff" stroke-width="2.4" fill="none" opacity=".22" stroke-linecap="round"/>`;
  if(o.man_hinh) d += `<g transform="translate(0 -84)">${o.man_hinh}</g>`;
  else {
    const M = P.mat, eye = (x) => ({
      vui: `<path d="M${x - 6} -84 Q${x} -93 ${x + 6} -84" stroke="${M}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
      nham_mat: `<path d="M${x - 6} -86 Q${x} -81 ${x + 6} -86" stroke="${M}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`,
      ngac_nhien: `<ellipse cx="${x}" cy="-87" rx="7" ry="9" fill="${M}"/><ellipse cx="${x - 2}" cy="-90" rx="2" ry="2.6" fill="#fff" opacity=".7"/>`,
      tap_trung: `<rect x="${x - 5.5}" y="-89" width="11" height="7" rx="3.5" fill="${M}"/>`,
    }[bc] || `<rect x="${x - 6.5}" y="-96" width="13" height="21" rx="6.5" fill="${M}"/><rect x="${x - 3.5}" y="-92" width="3.5" height="6" rx="1.7" fill="#fff" opacity=".55"/>`);
    let eyes = eye(-18) + eye(18);
    if(bc === 'boi_roi') eyes = `<rect x="-23.5" y="-95" width="11" height="17" rx="5.5" fill="${M}"/><path d="M12 -87 H24" stroke="${M}" stroke-width="4" stroke-linecap="round"/>`;
    const mouth = o.mieng_mo || bc === 'noi' ? `<ellipse cx="0" cy="-66" rx="6" ry="4.5" fill="${M}"/>`
      : bc === 'ngac_nhien' ? `<circle cx="0" cy="-66" r="4" fill="none" stroke="${M}" stroke-width="3"/>`
      : bc === 'boi_roi' ? `<path d="M-7 -65 q3.5 -4 7 0 t7 0" stroke="${M}" stroke-width="3" fill="none" stroke-linecap="round"/>`
      : `<path d="M-8 -70 Q0 -60 8 -70 Z" fill="${M}"/>`;
    d += eyes + mouth;
  }
  return d;
}

/* athena_mat(opt): AVATAR cho ô lời thoại = đúng hình athena() toàn thân, giữ nguyên tỉ lệ, đặt trọn trong khung tròn.
   Gốc (0,0) = tâm; dùng với viewBox "-60 -60 120 120". opt: như athena() (bieu_cam, mieng_mo, phat_sang), nen: màu nền, khung: false để bỏ nền */
function athena_mat(o = {}){
  const id = _athNs + (++_athId);
  let d = o.khung === false ? '' : `<defs><radialGradient id="${id}nen" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#F4FBF7"/><stop offset="1" stop-color="${o.nen || '#D6EEE2'}"/></radialGradient></defs><circle r="60" fill="url(#${id}nen)"/>`;
  return `<g>${d}<g transform="translate(0 49) scale(.72)">${athena({ ...o, s: 1, quay: 1 })}</g></g>`;
}

function athena(o = {}){
  const P = ATHENA_PAL, id = _athNs + (++_athId), s = o.s || 1, f = o.quay === -1 ? -1 : 1, bc = o.bieu_cam || 'cuoi';
  const body = 'M-64 -42 C-68 -100 -46 -130 0 -132 C46 -130 68 -100 64 -42 C62 -10 34 1 0 1 C-34 1 -62 -10 -64 -42 Z';
  let d = `<defs>
    <clipPath id="${id}cl"><path d="${body}"/></clipPath>
    <radialGradient id="${id}kem" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFF8E6"/><stop offset=".6" stop-color="${P.kem}"/><stop offset="1" stop-color="${P.kem_toi}"/></radialGradient>
    <linearGradient id="${id}xanh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${P.xanh_nhat}"/><stop offset=".35" stop-color="${P.xanh}"/><stop offset="1" stop-color="${P.xanh_toi}"/></linearGradient>
    <radialGradient id="${id}mn" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#34403C"/><stop offset="1" stop-color="${P.mat_na}"/></radialGradient>
    <radialGradient id="${id}gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${P.mat}" stop-opacity=".55"/><stop offset="1" stop-color="${P.mat}" stop-opacity="0"/></radialGradient>
    <filter id="${id}bl" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>`;
  d += `<ellipse cx="0" cy="2" rx="60" ry="8" fill="#1F2A24" opacity=".25" filter="url(#${id}bl)"/>`;
  // tai: kem, viền ngoài xanh
  for(const k of [-1, 1]) d += `<g transform="scale(${k} 1)"><path d="M-24 -126 C-34 -142 -52 -146 -60 -136 C-66 -126 -66 -112 -60 -98 Z" fill="${P.xanh}"/><path d="M-60 -136 C-66 -126 -66 -112 -60 -98 L-54 -104 C-58 -114 -58 -126 -54 -132 Z" fill="${P.xanh_toi}" opacity=".6"/></g>`;
  // chân
  for(const k of [-1, 1]) d += `<g transform="translate(${k * 46} -8)"><ellipse rx="23" ry="13" fill="${P.kem}"/><path d="M-23 0 A23 13 0 0 0 23 0 Z" fill="${P.xanh}"/></g>`;
  // thân: nửa trên kem, nửa dưới xanh, chóp đầu xanh
  d += `<g clip-path="url(#${id}cl)"><rect x="-70" y="-140" width="140" height="142" fill="url(#${id}xanh)"/>
    <path d="M-70 -140 H70 V-60 Q34 -40 0 -40 Q-34 -40 -70 -60 Z" fill="url(#${id}kem)"/>
    <path d="M-34 -140 H34 V-124 Q0 -112 -34 -124 Z" fill="${P.xanh}"/>
    <path d="M-70 -60 Q-34 -40 0 -40 Q34 -40 70 -60 V-54 Q34 -34 0 -34 Q-34 -34 -70 -54 Z" fill="#000" opacity=".08"/>
    <path d="M22 -140 C48 -120 54 -80 48 -30" stroke="#000" stroke-width="14" fill="none" opacity=".07"/>
    <path d="M-40 -118 C-48 -96 -48 -70 -44 -52" stroke="#fff" stroke-width="5" fill="none" opacity=".35" stroke-linecap="round"/></g>`;
  d += _athena_mat_na(o, id, P, bc);
  return `<g transform="scale(${s * f} ${s})">${d}</g>`;
}

if(typeof module !== 'undefined') module.exports = { athena, athena_mat, ATHENA_PAL, ATHENA_TIA };
</script>
<script>/* ===== HIỆU ỨNG dùng chung cho cảnh SVG (không cần thư viện ngoài) =====
   Mọi hàm hiệu ứng nhận `lop` = một phần tử <g> trong SVG để vẽ vào, và trả về Promise (chờ xong hiệu ứng).
   HU.tween(ms, fn(k_êm, k_thô)) · HU.sleep(ms) · HU.lerp · HU.mau(a, b, t)
   HU.hologram(svg)      → bản xám xanh kiểu "bản chiếu" (đổi mã màu trong chuỗi SVG)
   HU.phac_chi(svg)      → bản phác bút chì (nền giấy, nét chì)
   HU.tia(lop, tu, den)  → tia chiếu từ mặt nạ Athena tới một điểm
   HU.vong_mau(circle, R)→ vòng màu lan ra (dùng với mask hiện màu)
   HU.net_muc(lop, d)    → nét mực tự vẽ theo đường path
   HU.to_mau(lop, x, y, svg_mau, svg_chi) → bút chì tô màu dần từ trái sang phải
   HU.may_keo(lop, ...)  → mây đen trôi tới, bóng mây phủ mặt đất, rồi mưa
   HU.bong_nghi(lop, x, y, noi_dung) → bong bóng suy nghĩ bật ra (nảy)
   HU.tia_lua(lop, x, y) → tia lửa loé sáng (quyết định ngay)
   HU.phao_hoa(lop, x, y) · HU.phao_giay(lop, x0, x1, y) · HU.song_dt(lop, a, b)
   HU.phao_hoa_hinh(lop, x, y, icon) → pháo nổ rồi đọng thành hình biểu tượng (dùng cho 6 chòm pháo hoa)
   HU.vet_sang(lop, x0, x1, y) → vệt sáng chạy dọc đường ray · HU.mua_lap(x0, x1, y0, y1) → chuỗi SVG mưa rơi lặp
   HU.bau_troi(phut)     → màu trời trên/dưới, độ tối, vị trí mặt trời/trăng (0..1) theo giờ trong ngày
   HU.am.*               → âm thanh hiệu ứng tạo bằng WebAudio (gọi HU.mo_am() sau lần chạm đầu)
   HU.rung(kieu)         → rung nhẹ điện thoại (Android) khi đúng/sai
   HU.giam_chuyen_dong   → true nếu máy bật "giảm chuyển động": các hiệu ứng tự rút ngắn                                  */
const HU = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const giam = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const nay = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };   // nảy nhẹ khi hiện
  const lerp = (a, b, t) => a + (b - a) * t;
  const sleep = ms => new Promise(r => setTimeout(r, giam ? Math.min(ms, 200) : ms));
  function tween(ms, fn, e = ease){ if(giam) ms = Math.min(ms, 250); return new Promise(res => { const t0 = performance.now(); const st = now => { const k = Math.min(1, (now - t0) / ms); fn(e(k), k); k < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); }); }
  const hex2 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mau = (a, b, t) => { const A = hex2(a), B = hex2(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };
  const el = (tag, at = {}, html = '') => { const e = document.createElementNS(NS, tag); for(const k in at) e.setAttribute(k, at[k]); if(html) e.innerHTML = html; return e; };

  const hologram = svg => svg.replace(/#[0-9a-fA-F]{6}\b/g, m => { const [r, g, b] = hex2(m), l = (r * .3 + g * .59 + b * .11) / 255; return mau('#1C3A44', '#BFE9DD', Math.min(1, l * 1.05)); });
  const phac_chi = svg => svg
    .replace(/stop-color="#[0-9a-fA-F]{6}"/g, 'stop-color="#FDFBF6"')
    .replace(/fill="#[0-9a-fA-F]{6}"/g, 'fill="#FDFBF6"')
    .replace(/stroke="#[0-9a-fA-F]{6}"/g, 'stroke="#56616B"')
    .replace(/stroke-opacity="[.\d]+"/g, 'stroke-opacity=".9"')
    .replace(/stroke-width="([.\d]+)"/g, (m, w) => `stroke-width="${Math.max(1.2, +w)}"`);

  async function tia(lop, [sx, sy], [tx, ty], ms = 900){
    let defs = lop.ownerSVGElement.querySelector('#hu-tia-g');
    if(!defs){ const d = el('defs'); d.innerHTML = '<linearGradient id="hu-tia-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FE3B8" stop-opacity=".95"/><stop offset="1" stop-color="#BFF5DC" stop-opacity=".35"/></linearGradient>'; lop.ownerSVGElement.prepend(d); }
    const p = el('path', { fill: 'url(#hu-tia-g)', opacity: 0 }), spk = el('g'); lop.append(p, spk); HU.am.tia();
    await tween(ms, (k, r) => { const w = 14 + 10 * Math.sin(r * 20); p.setAttribute('d', `M${sx} ${sy - 5} L${tx} ${ty - w} L${tx} ${ty + w} L${sx} ${sy + 5} Z`); p.setAttribute('opacity', Math.sin(r * Math.PI) * .9);
      spk.innerHTML = Array.from({length: 6}, (_, i) => { const q = (r * 3 + i / 6) % 1; return `<circle cx="${lerp(sx, tx, q)}" cy="${lerp(sy, ty, q) + Math.sin(q * 12 + i) * 8}" r="${2 + i % 3}" fill="#fff" opacity="${.9 - q * .6}"/>`; }).join(''); });
    p.remove(); spk.remove();
  }
  async function vong_mau(circle, R = 460, ms = 1400, lopVong){
    const cx = +circle.getAttribute('cx'), cy = +circle.getAttribute('cy'), ring = el('circle', { cx, cy, r: 0, fill: 'none', stroke: '#BFF5DC', 'stroke-width': 8 });
    (lopVong || circle.ownerSVGElement).append(ring); HU.am.dung();
    await tween(ms, (k, r) => { circle.setAttribute('r', R * k); ring.setAttribute('r', R * k); ring.setAttribute('opacity', 1 - r); ring.setAttribute('stroke-width', 10 - 8 * r); });
    ring.remove();
  }
  function net_muc(lop, d, { mau: m = '#1D3557', w = 5, ms = 1400, gach = 12 } = {}){
    const p = el('path', { d, fill: 'none', stroke: m, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }); lop.append(p);
    const L = p.getTotalLength(); p.setAttribute('stroke-dasharray', gach ? `${gach} ${gach}` : L);
    if(!gach){ p.setAttribute('stroke-dashoffset', L); return tween(ms, k => p.setAttribute('stroke-dashoffset', L * (1 - k))).then(() => p); }
    const mk = el('mask', { id: 'hu-m' + Math.random().toString(36).slice(2, 7), maskUnits: 'userSpaceOnUse' }); const mp = el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': w + 4, 'stroke-dasharray': L, 'stroke-dashoffset': L });
    mk.append(mp); lop.append(mk); p.setAttribute('mask', `url(#${mk.id})`);
    return tween(ms, k => mp.setAttribute('stroke-dashoffset', L * (1 - k))).then(() => p);
  }
  async function to_mau(lop, x, y, svgMau, { w = 120, h = 120, ms = 1500 } = {}){   // vật đang là bản phác chì → tô màu dần; (x,y) = gốc vật; w,h = khung vật
    const id = 'hu-c' + Math.random().toString(36).slice(2, 7);
    const g = el('g', { transform: `translate(${x} ${y})` });
    g.innerHTML = `<defs><clipPath id="${id}"><rect x="${-w / 2 - 10}" y="${-h - 10}" width="0" height="${h + 30}"/></clipPath></defs><g>${phac_chi(svgMau)}</g><g clip-path="url(#${id})">${svgMau}</g>
      <g class="chi"><path d="M0 0 L-8 -30 L8 -30 Z" fill="#F4E3C8"/><path d="M0 0 l-3 -10 l6 0z" fill="#34495E"/><rect x="-8" y="-86" width="16" height="56" fill="#F2C14E"/><rect x="-8" y="-96" width="16" height="10" fill="#E46C8C"/></g>`;
    lop.append(g); const rc = g.querySelector('rect'), chi = g.querySelector('.chi'); HU.am.chi();
    await tween(ms, (k, r) => { const xx = -w / 2 - 10 + (w + 20) * k; rc.setAttribute('width', (w + 20) * k); chi.setAttribute('transform', `translate(${xx} ${-h * .5 + Math.sin(r * 30) * h * .35}) rotate(25)`); });
    chi.remove(); return g;
  }
  async function may_keo(lop, { tu = -300, den = 0, y = 120, mat_dat = 460, ms = 2200, mua = true, svgMay }){
    const g = el('g'), bong = el('ellipse', { cx: tu, cy: mat_dat, rx: 240, ry: 26, fill: '#1F2A24', opacity: 0 }), may = el('g'), toi = el('rect', { x: -2000, y: -2000, width: 6000, height: 6000, fill: '#16233A', opacity: 0 });
    may.innerHTML = svgMay || ''; g.append(toi, bong, may); lop.append(g); HU.am.gio();
    await tween(ms, (k) => { const x = lerp(tu, den, k); may.setAttribute('transform', `translate(${x} ${y})`); bong.setAttribute('cx', x); bong.setAttribute('opacity', .28 * k); toi.setAttribute('opacity', .18 * k); });
    if(mua){ const r = el('g'); g.append(r); let run = true; (async () => { let t = 0; while(run){ t += 1; r.innerHTML = Array.from({length: 40}, (_, i) => { const xx = den - 220 + (i * 53) % 440, yy = y + ((i * 37 + t * 22) % (mat_dat - y)); return `<path d="M${xx} ${yy} l-5 16" stroke="#9CC9E4" stroke-width="2" opacity=".75" stroke-linecap="round"/>`; }).join(''); await new Promise(q => setTimeout(q, 50)); } })(); g.dung_mua = () => { run = false; r.remove(); }; }
    return g;
  }
  async function bong_nghi(lop, x, y, svgBong){
    const g = el('g'); g.innerHTML = svgBong; lop.append(g); HU.am.bop();
    await tween(600, (k) => g.setAttribute('transform', `translate(${x} ${y}) scale(${Math.max(.01, k)})`), nay);
    return g;
  }
  async function tia_lua(lop, x, y){
    const g = el('g', { transform: `translate(${x} ${y})` }), fl = el('rect', { x: -3000, y: -3000, width: 6000, height: 6000, fill: '#FFF6D8', opacity: 0 });
    g.innerHTML = `<g class="sao"><path d="M0 -60 L12 -16 L56 -24 L20 4 L44 44 L4 22 L-8 64 L-14 20 L-56 34 L-24 0 L-54 -30 L-12 -16 Z" fill="#E8A24A"/><path d="M0 -32 L6 -8 L28 -12 L10 2 L22 22 L2 11 L-4 32 L-7 10 L-28 17 L-12 0 L-27 -15 L-6 -8 Z" fill="#FFE08A"/></g>`;
    lop.append(fl, g); HU.am.lua();
    const tia = el('g'); g.append(tia);
    await tween(700, (k, r) => { g.querySelector('.sao').setAttribute('transform', `scale(${nay(Math.min(1, r * 1.6)) * (1 - r * .3)}) rotate(${r * 40})`); fl.setAttribute('opacity', Math.max(0, .5 - r * 1.2));
      tia.innerHTML = Array.from({length: 10}, (_, i) => { const a = i / 10 * Math.PI * 2, d1 = 40 + r * 60, d2 = d1 + 24 * (1 - r); return `<path d="M${Math.cos(a) * d1} ${Math.sin(a) * d1} L${Math.cos(a) * d2} ${Math.sin(a) * d2}" stroke="#F2C14E" stroke-width="4" stroke-linecap="round" opacity="${1 - r}"/>`; }).join(''); });
    fl.remove(); await tween(300, k => g.setAttribute('opacity', 1 - k)); g.remove();
  }
  function phao_hoa(lop, x, y, n = 36){
    const cols = ['#E8A24A', '#F2C14E', '#E46C8C', '#7FE3B8', '#3B7FB8', '#fff'], g = el('g'); lop.append(g); HU.am.no();
    const P = Array.from({length: n}, (_, i) => ({ a: i / n * Math.PI * 2 + Math.random() * .2, v: 2.2 + Math.random() * 2.4, c: cols[i % 6] }));
    return tween(1500, (k, r) => { g.innerHTML = P.map(p => { const d = p.v * 60 * r; return `<circle cx="${x + Math.cos(p.a) * d}" cy="${y + Math.sin(p.a) * d + 40 * r * r}" r="${3.4 * (1 - r) + .6}" fill="${p.c}" opacity="${1 - r * .9}"/>`; }).join(''); }, t => t).then(() => g.remove());
  }
  function phao_giay(lop, x0, x1, y0){
    const cols = ['#E8A24A', '#F2C14E', '#E46C8C', '#2A8167', '#3B7FB8', '#7B5EA7'], g = el('g'); lop.append(g);
    const P = Array.from({length: 70}, (_, i) => ({ x: lerp(x0, x1, Math.random()), y: y0 - Math.random() * 120, vy: 1.4 + Math.random() * 1.8, w: 5 + Math.random() * 5, r: Math.random() * 360, vr: (Math.random() - .5) * 14, c: cols[i % 6] }));
    return tween(3200, (k, r) => { g.innerHTML = P.map(p => { const yy = p.y + p.vy * 260 * r; return `<rect x="${p.x + Math.sin(r * 8 + p.r) * 12}" y="${yy}" width="${p.w}" height="${p.w * .5}" fill="${p.c}" transform="rotate(${p.r + p.vr * r * 60} ${p.x} ${yy})" opacity="${r > .85 ? (1 - r) / .15 : 1}"/>`; }).join(''); }, t => t).then(() => g.remove());
  }
  async function phao_hoa_hinh(lop, x, y, icon, { r = 44, tu = 420 } = {}){   // pháo bay lên, nổ, rồi đọng lại thành hình (biểu tượng SVG 48x48); trả về nhóm hình
    const svg = lop.ownerSVGElement;
    if(!svg.querySelector('#hu-ph-g')){ const d = el('defs'); d.innerHTML = '<radialGradient id="hu-ph-g"><stop offset="0" stop-color="#FFF3CF" stop-opacity=".75"/><stop offset=".6" stop-color="#FFE7A8" stop-opacity=".2"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>'; svg.prepend(d); }
    const vet = el('g'); lop.append(vet); tone(260, .5, 'sine', .05, 0, 900);
    await tween(650, (k, q) => { const yy = lerp(tu, y, k); vet.innerHTML = [0, 1, 2, 3].map(i => `<circle cx="${x + Math.sin(q * 20 + i) * 2}" cy="${yy + i * 12}" r="${3.5 - i * .7}" fill="#FFE7A8" opacity="${1 - i * .22}"/>`).join(''); });
    vet.remove(); phao_hoa(lop, x, y);
    const g = el('g', { transform: `translate(${x} ${y}) scale(.01)` });
    g.innerHTML = `<circle r="${r * 1.7}" fill="url(#hu-ph-g)"/><circle r="${r * 1.05}" fill="#fff" opacity=".12"/>` + icon.replace('<svg ', `<svg x="${-r}" y="${-r}" width="${r * 2}" height="${r * 2}" `);
    lop.append(g); await sleep(250);
    await tween(700, k => g.setAttribute('transform', `translate(${x} ${y}) scale(${Math.max(.01, k)})`), nay);
    return g;
  }
  async function vet_sang(lop, x0, x1, y, ms = 1400){   // vệt sáng chạy dọc đường ray (sự việc 1: lịch cố định)
    const svg = lop.ownerSVGElement;
    if(!svg.querySelector('#hu-vs-g')){ const d = el('defs'); d.innerHTML = '<linearGradient id="hu-vs-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'; svg.prepend(d); }
    const r = el('rect', { x: x0 - 300, y: y - 4, width: 300, height: 8, fill: 'url(#hu-vs-g)' }); lop.append(r); HU.am.chuong();
    await tween(ms, k => r.setAttribute('x', lerp(x0 - 300, x1, k))); r.remove();
  }
  const mua_lap = (x0, x1, y0, y1) => {   // chuỗi SVG mưa rơi lặp liền mạch (nhẹ, không cần JS)
    const P = 64; let d = '';
    for(let y = y0 - P; y < y1; y += P) for(let i = 0; i < (x1 - x0) / 26; i++){ const x = x0 + i * 26 + ((y / P) % 2) * 13 + (i * 7) % 11; d += `M${x} ${y + (i * 23) % P} l-5 16 `; }
    return `<g opacity=".8"><path d="${d}" stroke="#9CC9E4" stroke-width="2.2" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" from="0 0" to="-10 ${P}" dur=".32s" repeatCount="indefinite"/></path></g>`;
  };
  function song_dt(lop, [ax, ay], [bx, by], ms = 1800){
    const g = el('g'); lop.append(g); HU.am.reo();
    return tween(ms, (k, r) => { const x = lerp(ax, bx, r), y = lerp(ay, by, r) - Math.sin(r * Math.PI) * 60; g.innerHTML = [0, 1, 2].map(i => `<path d="M${x - i * 18} ${y - i * 3} q14 18 0 36" stroke="#7FE3B8" stroke-width="4" fill="none" opacity="${1 - i * .3}"/>`).join(''); }).then(() => g.remove());
  }

  const TROI = [[330, '#3A4C82', '#F2A98A'], [372, '#86C6EC', '#FCE3C4'], [450, '#8FD0F0', '#E8F6FB'], [720, '#6FC3EE', '#DDF2FB'], [1020, '#86B9E0', '#F9E0B0'], [1110, '#6B5B95', '#F79A6B'], [1170, '#2E3A6E', '#8B6FA0'], [1260, '#101A38', '#26345E'], [1320, '#0B1430', '#1D2A50']];
  function bau_troi(m){
    let i = 0; while(i < TROI.length - 2 && m > TROI[i + 1][0]) i++;
    const [a, c0, c1] = TROI[i], [b, d0, d1] = TROI[i + 1], k = Math.max(0, Math.min(1, (m - a) / (b - a)));
    const toi = m < 380 ? (380 - m) / 50 * .45 : m < 1050 ? 0 : Math.min(.62, (m - 1050) / 180 * .62);
    return { tren: mau(c0, d0, k), duoi: mau(c1, d1, k), toi, mat_troi: (m - 360) / 750, trang: (m - 1100) / 260 };
  }

  let AC = null;
  const mo_am = () => { if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } };
  function tone(f, d = .12, type = 'sine', v = .12, when = 0, f2){ if(!AC) return; const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); }
  function nhieu(d = .6, v = .05, lp = 800){ if(!AC) return; const n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0); for(let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v; s.buffer = buf; s.connect(f).connect(g).connect(AC.destination); s.start(); }
  const am = {
    tich: () => tone(1200, .03, 'square', .02), bop: () => tone(520, .09, 'sine', .14, 0, 880),
    dung: () => { tone(660, .12, 'triangle', .14); tone(880, .14, 'triangle', .14, .1); tone(1320, .22, 'triangle', .12, .2); },
    sai: () => { tone(220, .18, 'sawtooth', .06); tone(180, .22, 'sawtooth', .06, .12); },
    tia: () => tone(300, .6, 'sine', .08, 0, 1400), cach: () => { tone(900, .04, 'square', .1); tone(300, .08, 'square', .08, .03); },
    reo: () => { for(let i = 0; i < 4; i++){ tone(1300, .07, 'square', .05, i * .14); tone(1050, .07, 'square', .05, i * .14 + .07); } },
    chuong: () => { tone(988, .5, 'sine', .12); tone(1319, .6, 'sine', .08, .15); },
    no: () => { tone(90, .5, 'sawtooth', .08, 0, 40); nhieu(.4, .06, 2400); }, nhay: () => tone(340, .07, 'sine', .07, 0, 520),
    chi: () => { for(let i = 0; i < 8; i++) tone(2600 + Math.random() * 800, .02, 'triangle', .012, i * .12); nhieu(1.2, .02, 5000); },
    gio: () => nhieu(1.8, .05, 600), lua: () => { tone(1500, .08, 'triangle', .1); tone(2200, .25, 'sine', .08, .05, 3300); }
  };
  const rung = k => { try{ navigator.vibrate && navigator.vibrate(k === 'sai' ? [40, 60, 40] : 25); }catch(e){} };
  return { tween, sleep, lerp, ease, nay, mau, el, hologram, phac_chi, tia, vong_mau, net_muc, to_mau, may_keo, bong_nghi, tia_lua, phao_hoa, phao_hoa_hinh, phao_giay, song_dt, vet_sang, mua_lap, bau_troi, am, mo_am, rung, giam_chuyen_dong: giam };
})();
if(typeof module !== 'undefined') module.exports = { HU };
</script>
<script>/* ===== CHIBI: bộ nhân vật dùng chung (SVG thuần, không ảnh, sắc nét mọi màn hình) =====
   chibi(opt) → chuỗi <g> đặt ở gốc (0,0) = giữa hai bàn chân; cao ~170 đơn vị ở scale 1.
   opt: { tuoi:'tre'|'hs'|'nguoi_lon'|'gia', gioi:'nam'|'nu',
          da:'sang'|'vua'|'ngam'|'nau'|'dam' (hoặc mã màu), toc:'den'|'nau'|'nau_sang'|'vang'|'vang_nhat'|'do'|'bac' (hoặc mã màu),
          kieu_toc:'ngan'|'duoi_ngua'|'dai'|'bob'|'bui'|'hoi'|'mu'|'xoan'|'tet'|'bui_doi'|'dinh'|'mai_bang'|'mu_len',
          ao:'jade'|'xanh'|'cam'|'hong'|'tim'|'do'|'trang'|'xam'|'vang' (hoặc mã màu), quan:mã màu, vay:bool, ao_khoac:mã màu,
          kinh:bool, bo_bot:bool (tay phải bó bột, đeo dây), ca_vat:mã màu, mu:mã màu (cho 'mu'/'mu_len'), phu_kien:'no'|'bang_do', mau_phu_kien:mã màu, tan_nhang:bool,
          tu_the:'dung'|'chao'|'vay_tay'|'noi'|'ngoi'|'ngoi_noi'|'ngoi_doc'|'chay'|'doc'|'nam', mau_sach: màu bìa sách khi đọc (thấy bìa sau),
          bieu_cam:'cuoi'|'noi'|'ngac_nhien'|'tap_trung'|'buon'|'ngu', quay:1|-1 (lật ngang), s: tỉ lệ }            */
const CHIBI_PAL = {
  da: { sang:'#FFE0C7', vua:'#F6CBA8', ngam:'#D9A47E', nau:'#C08A5E', dam:'#8C5B3A' },
  toc: { den:'#2B1D16', nau:'#5A3825', nau_sang:'#8A5A3B', vang:'#C9974C', vang_nhat:'#E9C46A', do:'#B5532E', bac:'#C9CED3' },
  ao: { jade:'#2A8167', xanh:'#3B7FB8', cam:'#E8A24A', hong:'#E46C8C', tim:'#7B5EA7', do:'#C0392B', trang:'#F4F1EA', xam:'#6C7A89', vang:'#F2C14E' },
  vien: '#3B2A22'
};
let _chibiId = 0;
const _chibiNs = 'cb' + Math.random().toString(36).slice(2, 6) + '_';   // tránh trùng id khi dán SVG đã vẽ sẵn từ trang khác
function chibi(o = {}){
  const id = _chibiNs + (++_chibiId);
  const P = CHIBI_PAL, s = o.s || 1, flip = o.quay === -1 ? -1 : 1;
  const tuoi = o.tuoi || 'hs', gia = tuoi === 'gia', tre = tuoi === 'tre', lon = tuoi === 'nguoi_lon' || gia;
  const da = P.da[o.da] || o.da || P.da.vua, toc = P.toc[o.toc] || o.toc || P.toc.den;
  const ao = P.ao[o.ao] || o.ao || P.ao.jade, quan = o.quan || '#34495E';
  const pose = o.tu_the || 'dung', mat = o.bieu_cam || 'cuoi';
  const k = tre ? .82 : lon ? 1.06 : 1;                 // chiều cao thân
  const R = tre ? 33 : 35;                              // bán kính đầu (to: chibi)
  const sit = pose.startsWith('ngoi'), run = pose === 'chay', lie = pose === 'nam';
  const hipY = sit ? -24 : -40 * k, neckY = hipY - 34 * k, headY = neckY - R + 4;
  const shade = (c, a) => `<linearGradient id="${id}${a}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity="1"/></linearGradient>`;
  let d = `<defs>
    <radialGradient id="${id}sk" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#FFF4EA"/><stop offset=".45" stop-color="${da}"/><stop offset="1" stop-color="${da}"/></radialGradient>
    <linearGradient id="${id}ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ao}"/><stop offset="1" stop-color="${ao}"/></linearGradient>
    <linearGradient id="${id}tc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${toc}" stop-opacity=".78"/><stop offset=".6" stop-color="${toc}"/></linearGradient>
    <filter id="${id}bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;
  const V = P.vien, sw = 1.6;
  // bóng đổ mềm dưới chân
  d += `<ellipse cx="0" cy="${sit ? 2 : 1}" rx="${sit ? 34 : 26}" ry="6" fill="#1F2A24" opacity=".22" filter="url(#${id}bl)"/>`;
  const hy = headY;
  if(o.kieu_toc === 'tet') {   // hai bím tóc thả hai bên
    for(const sx of [-1, 1]) for(let k2 = 0; k2 < 4; k2++) d += `<ellipse cx="${sx*(R-2)}" cy="${hy+10+k2*9}" rx="${6-k2*.6}" ry="6" fill="url(#${id}tc)" stroke="${V}" stroke-width="1.3"/>`;
    for(const sx of [-1, 1]) d += `<circle cx="${sx*(R-2)}" cy="${hy+46}" r="3.2" fill="${P.ao.hong}" stroke="${V}" stroke-width="1"/>`;
  }
  if(o.kieu_toc === 'xoan') d += `<g fill="url(#${id}tc)" stroke="${V}" stroke-width="1.4">${[[-R-2,hy+6],[R+2,hy+6],[-R-4,hy-8],[R+4,hy-8]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10"/>`).join('')}</g>`;
  if(o.kieu_toc === 'mai_bang') d += `<path d="M${-R-2} ${hy-4} Q${-R-4} ${hy+R+16} ${-R+6} ${hy+R+20} H${R-6} Q${R+4} ${hy+R+16} ${R+2} ${hy-4} Z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`;
  if(o.kieu_toc === 'dai' || o.kieu_toc === 'duoi_ngua' || o.kieu_toc === 'bob') {
    const back0 = o.kieu_toc === 'dai' ? `<path d="M${-R-2} ${hy-4} Q${-R-6} ${hy+R+22} ${-R+8} ${hy+R+26} H${R-8} Q${R+6} ${hy+R+22} ${R+2} ${hy-4} Z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`
      : o.kieu_toc === 'duoi_ngua' ? `<path d="M${R-6} ${hy-14} q${R*.9} 8 ${R*.5} ${R+18} q-10 -14 -${R*.45} -${R*.55}z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`
      : `<path d="M${-R-3} ${hy-2} Q${-R-4} ${hy+R*.8} ${-R+6} ${hy+R*.85} H${R-6} Q${R+4} ${hy+R*.8} ${R+3} ${hy-2} Z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`;
    d += back0;
  }
  // ----- chân
  const leg = (x, ang, len, shoeDir) => {
    const a = ang * Math.PI / 180, x2 = x + Math.sin(a) * len, y2 = hipY + Math.cos(a) * len;
    return `<path d="M${x} ${hipY} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${o.vay && !sit ? da : quan}" stroke-width="${tre ? 9 : 10}" stroke-linecap="round"/>
      <ellipse cx="${(x2 + 3 * shoeDir).toFixed(1)}" cy="${(y2 + 1).toFixed(1)}" rx="7" ry="4.6" fill="#2F2A36" stroke="${V}" stroke-width="1"/>`;
  };
  if(sit) d += leg(-8, 6, 22, -1) + leg(8, -6, 22, 1);
  else if(run) d += leg(-6, 38, 38 * k, 1) + leg(6, -30, 38 * k, -1);
  else d += leg(-7, 4, 38 * k + 2, -1) + leg(7, -4, 38 * k + 2, 1);
  // ----- thân (áo) + váy
  const bw = tre ? 30 : 34, bt = neckY + 2;
  d += `<path d="M${-bw/2} ${hipY+2} Q${-bw/2-2} ${bt+8} ${-bw/2+6} ${bt} H${bw/2-6} Q${bw/2+2} ${bt+8} ${bw/2} ${hipY+2} Z" fill="url(#${id}ao)" stroke="${V}" stroke-width="${sw}"/>`;
  d += `<clipPath id="${id}cp"><path d="M${-bw/2} ${hipY+2} Q${-bw/2-2} ${bt+8} ${-bw/2+6} ${bt} H${bw/2-6} Q${bw/2+2} ${bt+8} ${bw/2} ${hipY+2} Z"/></clipPath>
    <g clip-path="url(#${id}cp)"><rect x="${bw*0.12}" y="${bt}" width="${bw}" height="${hipY-bt+4}" fill="#1F2A24" opacity=".13"/><rect x="${-bw/2}" y="${bt}" width="${bw*0.22}" height="${hipY-bt+4}" fill="#fff" opacity=".14"/></g>`;
  if(o.vay) d += `<path d="M${-bw/2-3} ${hipY-2} L${-bw/2-8} ${hipY+16} H${bw/2+8} L${bw/2+3} ${hipY-2} Z" fill="${quan}" stroke="${V}" stroke-width="${sw}"/>`;
  d += `<path d="M-7 ${bt} L0 ${bt+9} L7 ${bt}" fill="#fff" stroke="${V}" stroke-width="1.2"/>`;           // cổ áo
  if(o.ao_khoac) d += `<path d="M${-bw/2} ${hipY+2} Q${-bw/2-2} ${bt+8} ${-bw/2+6} ${bt} H-4 L-3 ${hipY+2} Z" fill="${o.ao_khoac}" stroke="${V}" stroke-width="${sw}"/><path d="M${bw/2} ${hipY+2} Q${bw/2+2} ${bt+8} ${bw/2-6} ${bt} H4 L3 ${hipY+2} Z" fill="${o.ao_khoac}" stroke="${V}" stroke-width="${sw}"/>`;
  if(o.ca_vat) d += `<path d="M0 ${bt+8} l-3.5 5 3.5 12 3.5-12z" fill="${o.ca_vat}" stroke="${V}" stroke-width="1"/>`;
  // ----- tay: góc tính từ phương thẳng xuống, dương = ra ngoài thân (trái/phải tự đối xứng); tay giơ cao vẽ sau đầu
  const arm = (side, a1, a2) => {
    const sx = side * (bw/2 - 2), sy = bt + 6, L1 = 15 * k, L2 = 14 * k, r = Math.PI / 180;
    const ex = sx + side * Math.sin(a1 * r) * L1, ey = sy + Math.cos(a1 * r) * L1;
    const hx = ex + side * Math.sin(a2 * r) * L2, hy2 = ey + Math.cos(a2 * r) * L2;
    return `<path d="M${sx} ${sy} L${ex.toFixed(1)} ${ey.toFixed(1)} L${hx.toFixed(1)} ${hy2.toFixed(1)}" stroke="${V}" stroke-width="11.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M${sx} ${sy} L${ex.toFixed(1)} ${ey.toFixed(1)} L${hx.toFixed(1)} ${hy2.toFixed(1)}" stroke="${o.ao_khoac || ao}" stroke-width="8.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="${hx.toFixed(1)}" cy="${hy2.toFixed(1)}" r="5" fill="url(#${id}sk)" stroke="${V}" stroke-width="1.1"/>`;
  };
  // [trái:a1,a2] [phải:a1,a2]; a âm = vào trong thân
  const AR = {
    dung:[[14,8],[14,8]], chao:[[6,2],[6,2]], noi:[[14,8],[70,140]], vay_tay:[[14,8],[95,165]],
    chay:[[40,95],[25,-25]], doc:[[-25,-95],[-25,-95]], ngoi_doc:[[-25,-95],[-25,-95]], ngoi:[[-20,-80],[-20,-80]], ngoi_noi:[[-20,-80],[70,140]], nam:[[14,8],[14,8]]
  }[pose] || [[14,8],[14,8]];
  if(o.bo_bot) AR[1] = [18, -78];   // tay phải gập trước ngực, bó bột
  const armL = arm(-1, ...AR[0]), armR = arm(1, ...AR[1]);
  let bot = '';
  if(o.bo_bot){ const sx = bw/2 - 2, sy = bt + 6, L1 = 15 * k, L2 = 14 * k, r = Math.PI / 180, ex = sx + Math.sin(18 * r) * L1, ey = sy + Math.cos(18 * r) * L1, hx = ex + Math.sin(-78 * r) * L2, hy2 = ey + Math.cos(-78 * r) * L2;
    bot = `<path d="M${-bw/2+4} ${bt+2} L${(hx - 2).toFixed(1)} ${(hy2 + 4).toFixed(1)} M${(ex + 2).toFixed(1)} ${(ey + 4).toFixed(1)} L${bw/2-6} ${bt+1}" stroke="#3B7FB8" stroke-width="3.2" fill="none" stroke-linecap="round"/>`
      + `<path d="M${ex.toFixed(1)} ${ey.toFixed(1)} L${(hx + 3).toFixed(1)} ${hy2.toFixed(1)}" stroke="${V}" stroke-width="14.5" stroke-linecap="round"/><path d="M${ex.toFixed(1)} ${ey.toFixed(1)} L${(hx + 3).toFixed(1)} ${hy2.toFixed(1)}" stroke="#FFFDF6" stroke-width="11.5" stroke-linecap="round"/>`
      + `<path d="M${(ex - 3).toFixed(1)} ${(ey - 1).toFixed(1)} l2 5 M${((ex + hx) / 2).toFixed(1)} ${((ey + hy2) / 2 - 3).toFixed(1)} l1 6" stroke="#D6CBB5" stroke-width="1.2"/>`; }
  const raisedR = AR[1][1] > 100, raisedL = AR[0][1] > 100;
  if(!raisedL) d += armL; if(!raisedR) d += armR; d += bot;
  if((pose === 'doc' || pose === 'ngoi_doc') && o.mau_sach) d += `<g transform="translate(0 ${bt+18})"><path d="M-16 -9 H16 V11 H-16Z" fill="${o.mau_sach}" stroke="${V}" stroke-width="1.3" stroke-linejoin="round"/><path d="M0 -9 V11" stroke="${V}" stroke-width="1.1" opacity=".6"/><path d="M-16 -9 H16" stroke="#FFFDF6" stroke-width="2"/><path d="M7 -4 l1.6 3.2 3.4 .5 -2.5 2.4 .6 3.4 -3.1 -1.6 -3.1 1.6 .6 -3.4 -2.5 -2.4 3.4 -.5z" fill="#F2C14E"/></g>`;
  else if(pose === 'doc' || pose === 'ngoi_doc') d += `<g transform="translate(0 ${bt+18})"><path d="M-15 -8 Q0 -2 0 2 Q0 -2 15 -8 V8 Q0 12 0 14 Q0 12 -15 8Z" fill="#FFFDF6" stroke="${V}" stroke-width="1.2"/><path d="M0 2 V14" stroke="${V}" stroke-width="1"/><path d="M-11 -1 h8 M-11 3 h8 M3 -1 h8 M3 3 h8" stroke="#B7AFA3" stroke-width="1"/></g>`;
  // ----- đầu
  if(pose === 'chao') d += `<g transform="rotate(-4 0 ${neckY})">`;
  d += `<circle cx="0" cy="${hy}" r="${R}" fill="url(#${id}sk)" stroke="${V}" stroke-width="${sw}"/>`;
  d += `<ellipse cx="${-R+1}" cy="${hy+4}" rx="4.5" ry="6.5" fill="url(#${id}sk)" stroke="${V}" stroke-width="1.2"/><ellipse cx="${R-1}" cy="${hy+4}" rx="4.5" ry="6.5" fill="url(#${id}sk)" stroke="${V}" stroke-width="1.2"/>`;
  // mặt
  const ey = hy + 5, ex = 13;
  const eye = (x) => mat === 'ngu' ? `<path d="M${x-6} ${ey} q6 5 12 0" stroke="${V}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="${x}" cy="${ey}" rx="${mat==='ngac_nhien'?6.5:6}" ry="${mat==='ngac_nhien'?8.5:7.6}" fill="#2B211D"/><ellipse cx="${x}" cy="${ey+2.6}" rx="4.2" ry="3.6" fill="#6B4A3A" opacity=".85"/>
       <circle cx="${x+2.2}" cy="${ey-3}" r="2.3" fill="#fff"/><circle cx="${x-2.4}" cy="${ey+2.8}" r="1.1" fill="#fff" opacity=".9"/>`;
  d += eye(-ex) + eye(ex);
  const brow = mat === 'buon' ? [2, -2] : mat === 'tap_trung' ? [-2, 2] : [0, 0];
  d += `<path d="M${-ex-6} ${ey-12+brow[0]} q6 -3.5 12 0" stroke="${toc}" stroke-width="2.3" fill="none" stroke-linecap="round"/><path d="M${ex-6} ${ey-12+brow[1]} q6 -3.5 12 0" stroke="${toc}" stroke-width="2.3" fill="none" stroke-linecap="round"/>`;
  d += `<ellipse cx="${-ex-5}" cy="${ey+11}" rx="6" ry="3.4" fill="#F28B8B" opacity=".45"/><ellipse cx="${ex+5}" cy="${ey+11}" rx="6" ry="3.4" fill="#F28B8B" opacity=".45"/>`;
  const my = ey + 15;
  d += mat === 'noi' ? `<path d="M-5 ${my-1} q5 8 10 0 z" fill="#8B3A3A" stroke="${V}" stroke-width="1.2"/>`
     : mat === 'ngac_nhien' ? `<ellipse cx="0" cy="${my+1}" rx="3.6" ry="4.4" fill="#8B3A3A" stroke="${V}" stroke-width="1.2"/>`
     : mat === 'buon' ? `<path d="M-5 ${my+3} q5 -5 10 0" stroke="${V}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
     : mat === 'tap_trung' ? `<path d="M-4 ${my+1} h8" stroke="${V}" stroke-width="1.8" stroke-linecap="round"/>`
     : `<path d="M-6 ${my-1} q6 6 12 0" stroke="${V}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
  if(o.kinh) d += `<g fill="rgba(255,255,255,.18)" stroke="#3B2A22" stroke-width="1.8"><rect x="${-ex-9}" y="${ey-8}" width="18" height="15" rx="6"/><rect x="${ex-9}" y="${ey-8}" width="18" height="15" rx="6"/><path d="M-4 ${ey-2} h8"/></g>`;
  // tóc (trước)
  const kt = o.kieu_toc || (o.gioi === 'nu' ? 'duoi_ngua' : 'ngan');
  const top = hy - R;
  const fringe = {
    ngan:`<path d="M${-R-1} ${hy+2} Q${-R-3} ${top-8} 0 ${top-6} Q${R+3} ${top-8} ${R+1} ${hy+2} Q${R-6} ${hy-14} ${R*.3} ${hy-17} Q${R*.1} ${hy-10} ${-R*.15} ${hy-16} Q${-R*.5} ${hy-9} ${-R+4} ${hy-10} Z"/>`,
    duoi_ngua:`<path d="M${-R-1} ${hy+4} Q${-R-2} ${top-8} 0 ${top-5} Q${R+2} ${top-8} ${R+1} ${hy+4} Q${R-8} ${hy-18} ${-R*.1} ${hy-17} Q${-R*.6} ${hy-14} ${-R+3} ${hy-2} Z"/><circle cx="${R-8}" cy="${top+6}" r="4" fill="${P.ao.cam}" stroke="${V}" stroke-width="1"/>`,
    dai:`<path d="M${-R-1} ${hy+6} Q${-R-2} ${top-8} 0 ${top-5} Q${R+2} ${top-8} ${R+1} ${hy+6} Q${R-4} ${hy-12} ${R*.2} ${hy-18} Q0 ${hy-9} ${-R*.2} ${hy-18} Q${-R+4} ${hy-12} ${-R-1} ${hy+6} Z"/>`,
    bob:`<path d="M${-R-2} ${hy+8} Q${-R-3} ${top-8} 0 ${top-5} Q${R+3} ${top-8} ${R+2} ${hy+8} Q${R-2} ${hy-14} ${-R*.1} ${hy-15} Q${-R+2} ${hy-12} ${-R-2} ${hy+8} Z"/>`,
    bui:`<circle cx="0" cy="${top-6}" r="12"/><path d="M${-R-1} ${hy+2} Q${-R-2} ${top-6} 0 ${top-3} Q${R+2} ${top-6} ${R+1} ${hy+2} Q${R-10} ${hy-16} 0 ${hy-15} Q${-R+10} ${hy-16} ${-R-1} ${hy+2} Z"/>`,
    hoi:`<path d="M${-R-1} ${hy+2} Q${-R-2} ${hy-R*.4} ${-R*.6} ${hy-R*.7} Q${-R*.3} ${hy-R*.35} ${-R+6} ${hy-2} Z M${R+1} ${hy+2} Q${R+2} ${hy-R*.4} ${R*.6} ${hy-R*.7} Q${R*.3} ${hy-R*.35} ${R-6} ${hy-2} Z"/>`,
    mu:`<path d="M${-R-1} ${hy-R*.35} Q${-R-2} ${top-8} 0 ${top-7} Q${R+2} ${top-8} ${R+1} ${hy-R*.35} Z" fill="${o.mu||'#2A8167'}"/><path d="M${-R*.2} ${hy-R*.38} Q${R*.7} ${hy-R*.5} ${R+14} ${hy-R*.3}" stroke="${o.mu||'#2A8167'}" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="0" cy="${top-6}" r="3" fill="${o.mu||'#2A8167'}"/>`,
    xoan:`${[-.8,-.45,0,.45,.8].map((f,i)=>`<circle cx="${f*R}" cy="${top+6+Math.abs(f)*10}" r="${12-Math.abs(f)*2}"/>`).join('')}<circle cx="${-R*.25}" cy="${top-2}" r="11"/><circle cx="${R*.25}" cy="${top-2}" r="11"/>`,
    tet:`<path d="M${-R-1} ${hy+4} Q${-R-2} ${top-8} 0 ${top-5} Q${R+2} ${top-8} ${R+1} ${hy+4} Q${R-6} ${hy-14} ${R*.05} ${hy-18} Q${-R*.05} ${hy-10} ${-R*.1} ${hy-18} Q${-R+6} ${hy-14} ${-R-1} ${hy+4} Z"/><path d="M0 ${top-4} V${hy-17}" stroke="${V}" stroke-width="1" opacity=".5"/>`,
    bui_doi:`<circle cx="${-R*.62}" cy="${top+2}" r="11"/><circle cx="${R*.62}" cy="${top+2}" r="11"/><path d="M${-R-1} ${hy+2} Q${-R-2} ${top-4} 0 ${top-3} Q${R+2} ${top-4} ${R+1} ${hy+2} Q${R-8} ${hy-15} 0 ${hy-14} Q${-R+8} ${hy-15} ${-R-1} ${hy+2} Z"/>`,
    dinh:`<path d="M${-R+1} ${hy-4} Q${-R} ${top-2} 0 ${top-2} Q${R} ${top-2} ${R-1} ${hy-4} Q${R*.5} ${hy-R*.62} 0 ${hy-R*.64} Q${-R*.5} ${hy-R*.62} ${-R+1} ${hy-4} Z" opacity=".92"/>`,
    mai_bang:`<path d="M${-R-2} ${hy+8} Q${-R-3} ${top-8} 0 ${top-5} Q${R+3} ${top-8} ${R+2} ${hy+8} L${R-4} ${hy-8} H${-R+4} Z"/>`,
    mu_len:`<path d="M${-R-2} ${hy-R*.25} Q${-R-3} ${top-10} 0 ${top-10} Q${R+3} ${top-10} ${R+2} ${hy-R*.25} Z" fill="${o.mu||'#C0392B'}"/><rect x="${-R-3}" y="${hy-R*.36}" width="${2*R+6}" height="9" rx="4.5" fill="${o.mu||'#C0392B'}" stroke="${V}" stroke-width="1.4"/><circle cx="0" cy="${top-12}" r="7" fill="#F4F1EA" stroke="${V}" stroke-width="1.3"/>`
  }[kt];
  d += `<g fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}" stroke-linejoin="round">${fringe}</g>`;
  if(o.phu_kien === 'no') d += `<g transform="translate(${-R*.62} ${top+10}) rotate(-18)"><path d="M0 0 l-11 -7 v14z M0 0 l11 -7 v14z" fill="${P.ao.hong}" stroke="${V}" stroke-width="1.3" stroke-linejoin="round"/><circle r="3.2" fill="#fff" stroke="${V}" stroke-width="1.1"/></g>`;
  if(o.phu_kien === 'bang_do') d += `<path d="M${-R+2} ${hy-R*.45} Q0 ${top-12} ${R-2} ${hy-R*.45}" stroke="${o.mau_phu_kien||P.ao.cam}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(o.tan_nhang) d += `<g fill="#B5703F" opacity=".55">${[-17,-13,-15,13,17,15].map((x,i)=>`<circle cx="${x}" cy="${hy+14+(i%3)*2.5}" r="1.1"/>`).join('')}</g>`;
  if(gia) d += `<path d="M${-R*.5} ${hy+R*.55} q${R*.5} 6 ${R} 0" stroke="#D2B8A0" stroke-width="1.2" fill="none" opacity=".7"/>`;
  if(pose === 'chao') d += `</g>`;
  if(raisedL) d += armL; if(raisedR) d += armR;
  // ánh sáng viền (rim light) trên đầu
  d += `<path d="M${-R*.7} ${hy-R*.72} Q0 ${hy-R*1.08} ${R*.7} ${hy-R*.72}" stroke="#fff" stroke-width="2" fill="none" opacity=".35" stroke-linecap="round"/>`;
  const tr = lie ? `rotate(-90) translate(${-hipY} 0)` : '';
  return `<g transform="scale(${s * flip} ${s}) ${tr}">${d}</g>`;
}

/* ----- DÀN NHÂN VẬT PHỤ ĐẶT SẴN (chưa đặt tên; bài nào cần thì đặt tên và dùng) -----
   Dùng: chibi({...CHIBI_CAST.hs_nu_vang, tu_the:'vay_tay'})                                        */
const CHIBI_CAST = {
  hs_nam_den:     { gioi:'nam', kieu_toc:'ngan', ao:'xanh' },

  ba:             { tuoi:'gia', gioi:'nu', kieu_toc:'bui', toc:'bac', ao:'do', vay:true, quan:'#6B3A3A' },
  be_trai:        { tuoi:'tre', gioi:'nam', kieu_toc:'ngan', toc:'vang_nhat', ao:'cam', da:'sang' },

<script>/* ===== ASSET READING, phần 1: dây nối, kính dò chữ, chìa, bức điện, 5 dụng cụ, hộp dụng cụ =====
   Vẽ mới cho Reading (01/10/2026). Mọi hàm trả về chuỗi <g>. Cách dùng: bọc trong <svg viewBox> (luật T-19).
   Gốc toạ độ: đồ vật đứng trên mặt đất thì (0,0) = giữa chân; biểu tượng (dụng cụ) thì (0,0) = tâm.
   Màu lấy theo bảng team (DV_PAL) cộng vài màu "phòng điệp viên" (RP.navy...). Ánh sáng từ trên bên trái. Không emoji, không chữ trong hình. */
const RP = {
  navy:'#224137', navy_sang:'#336253', navy_toi:'#162D26', giay:'#F4EBDD', giay_toi:'#E3D5BC', trang:'#F7F4EE',
  thep:'#ABC1BA', thep_sang:'#D9E7E2', thep_toi:'#607D73', xam:'#8C96A0', xam_toi:'#4C5E58',
  jade:'#2A8167', jade_sang:'#3CA57A', jade_toi:'#14432F', cam:'#E8A24A', vang:'#EBA855', do:'#AB5940', do_sang:'#CF856F',
  xanh:'#44AF8B', xanh_sang:'#86D9BD', go:'#B98A5A', go_sang:'#D9B283', go_toi:'#8A6440', go_den:'#5A3F29', vien:'#2A1D14'
};
let _rdN = 0;
const _rdNs = 'rd' + Math.random().toString(36).slice(2, 6) + '_';
function _rmix(hex, t){   // t > 0: pha trắng, t < 0: pha đen
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, n >> 8 & 255, n & 255];
  return '#' + ch.map(c => Math.round(t > 0 ? c + (255 - c) * t : c * (1 + t)).toString(16).padStart(2, '0')).join('');
}
function _R(){   // bộ đồ nghề: gradient có id riêng, nét viền mờ, bao <g>
  const id = _rdNs + (++_rdN), defs = [];
  const lin = (n, stops, x2 = 0, y2 = 1) => { defs.push(`<linearGradient id="${id}${n}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ''}/>`).join('')}</linearGradient>`); return `url(#${id}${n})`; };
  const v = (n, c, a = .16, b = -.16) => lin(n, [[0, _rmix(c, a)], [1, _rmix(c, b)]]);
  const h = (n, c, a = .18, b = -.18) => lin(n, [[0, _rmix(c, a)], [1, _rmix(c, b)]], 1, 0);
  const tru = (n, c) => lin(n, [[0, _rmix(c, -.08)], [.3, _rmix(c, .3)], [.65, c], [1, _rmix(c, -.3)]], 1, 0);
  const rad = (n, c, cx = .35, cy = .3) => { defs.push(`<radialGradient id="${id}${n}" cx="${cx}" cy="${cy}" r=".8"><stop offset="0" stop-color="${_rmix(c, .38)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${_rmix(c, -.28)}"/></radialGradient>`); return `url(#${id}${n})`; };
  const S = (w = 1.4) => `stroke="#2A1D14" stroke-opacity=".3" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  const bong = (cx, cy, rx, ry = 5, op = .22) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#0F1F1A" opacity="${op}"/>`;
  const pat = (n, body, w, hh, rot = 0) => { defs.push(`<pattern id="${id}${n}" width="${w}" height="${hh}" patternUnits="userSpaceOnUse" patternTransform="rotate(${rot})">${body}</pattern>`); return `url(#${id}${n})`; };
  const out = body => `<g>${defs.length ? `<defs>${defs.join('')}</defs>` : ''}${body}</g>`;
  return { id, lin, v, h, tru, rad, S, bong, pat, out };
}
const _bez = (p0, p1, p2, p3, t) => { const u = 1 - t; return [u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]; };
const _poly = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

/* ---------- dây nối ---------- */
// day_xanh({x1,y1,x2,y2,cong}) dây liền màu xanh ngọc: hai cụm KHỚP (cùng ý). cong = độ cong 0..1
function day_xanh(o = {}){
  const { x1 = -60, y1 = 0, x2 = 60, y2 = 0, cong = .35 } = o, R = _R(), dx = (x2 - x1) * cong * 1.1, dy = (y2 - y1) * .15;
  const d = `M${x1} ${y1} C${x1 + dx} ${y1 + dy} ${x2 - dx} ${y2 - dy} ${x2} ${y2}`;
  const nut = (x, y) => `<circle cx="${x}" cy="${y}" r="7" fill="${RP.jade_toi}" opacity=".25"/><circle cx="${x}" cy="${y}" r="5.4" fill="${R.rad('n' + x, RP.jade_sang)}" stroke="#fff" stroke-width="1.8"/><circle cx="${x - 1.6}" cy="${y - 1.8}" r="1.6" fill="#fff" opacity=".7"/>`;
  return R.out(`<g class="day day-xanh"><path d="${d}" fill="none" stroke="${RP.jade_sang}" stroke-width="12" stroke-linecap="round" opacity=".16"/>
    <path d="${d}" fill="none" stroke="${RP.jade_toi}" stroke-width="5.6" stroke-linecap="round" opacity=".5"/>
    <path d="${d}" fill="none" stroke="${RP.jade}" stroke-width="4.2" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".5" transform="translate(-.6 -1)"/>${nut(x1, y1)}${nut(x2, y2)}</g>`);
}
// day_do_dut({x1,y1,x2,y2,cong}) dây đỏ đứt giữa chừng: KHÔNG KHỚP / Bẫy trùng từ (cùng chữ, khác ý)
function day_do_dut(o = {}){
  const { x1 = -60, y1 = 0, x2 = 60, y2 = 0, cong = .35 } = o, R = _R(), dx = (x2 - x1) * cong * 1.1, dy = (y2 - y1) * .15;
  const P = [[x1, y1], [x1 + dx, y1 + dy], [x2 - dx, y2 - dy], [x2, y2]], seg = (a, b) => { const pts = []; for(let i = 0; i <= 14; i++) pts.push(_bez(...P, a + (b - a) * i / 14)); return _poly(pts); };
  const A = _bez(...P, .43), B = _bez(...P, .57), M = _bez(...P, .5);
  const nut = (x, y) => `<circle cx="${x}" cy="${y}" r="7" fill="#50281C" opacity=".22"/><circle cx="${x}" cy="${y}" r="5.4" fill="${R.rad('n' + x, RP.do)}" stroke="#fff" stroke-width="1.8"/>`;
  const sd = d => `<path d="${d}" fill="none" stroke="${RP.do}" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="9 6"/><path d="${d}" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="9 6" opacity=".4" transform="translate(-.5 -.9)"/>`;
  const tia = `<path d="M${M[0] - 3} ${M[1] - 12} L${M[0] + 5} ${M[1] - 2} L${M[0] - 1} ${M[1] - 1} L${M[0] + 6} ${M[1] + 11} L${M[0] - 6} ${M[1] + 1} L${M[0] + 0} ${M[1] + 0} Z" fill="${RP.vang}" stroke="#7A4B10" stroke-opacity=".4" stroke-width="1" stroke-linejoin="round"/>`;
  return R.out(`<g class="day day-do">${sd(seg(0, .43))}${sd(seg(.57, 1))}
    <circle cx="${A[0]}" cy="${A[1]}" r="3.4" fill="${RP.do_sang}"/><circle cx="${B[0]}" cy="${B[1]}" r="3.4" fill="${RP.do_sang}"/>${tia}${nut(x1, y1)}${nut(x2, y2)}</g>`);
}

/* ---------- kính dò chữ: chỉ thấy chữ, không thấy ý ---------- */
// kinh_do_chu({sang, s}) kính lúp; sang: chùm sáng quét lên phía trên bên phải. Gốc = giữa chân cán kính.
function kinh_do_chu(o = {}){
  const s = o.s || 1, R = _R();
  const chum = o.sang ? `<path d="M-6 -40 L70 -112 L96 -78 L14 -22 Z" fill="${R.lin('ch', [[0, RP.vang, .5], [1, RP.vang, 0]], 1, 0)}"/>` : '';
  return R.out(`<g transform="scale(${s})">${chum}${R.bong(10, 2, 34, 6, .2)}
    <rect x="-5" y="-14" width="10" height="46" rx="5" fill="${R.h('can', RP.go_toi)}" transform="rotate(-38 0 -14) translate(14 4)" ${R.S()}/>
    <circle cx="-4" cy="-40" r="29" fill="${R.h('vk', RP.thep, .25, -.28)}" ${R.S(1.6)}/>
    <circle cx="-4" cy="-40" r="23.5" fill="${R.lin('kinh', [[0, '#D2F4E8', .9], [1, '#95DEC5', .75]])}" stroke="${RP.thep_toi}" stroke-opacity=".5" stroke-width="1.4"/>
    <path d="M-22 -48 Q-14 -62 2 -62" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".75"/>
    <g opacity=".85"><rect x="-17" y="-46" width="26" height="5" rx="2.5" fill="${RP.jade}"/><rect x="-17" y="-37" width="18" height="5" rx="2.5" fill="${RP.jade}" opacity=".55"/><rect x="-17" y="-28" width="23" height="4" rx="2" fill="${RP.xam}" opacity=".6"/></g></g>`);
}

/* ---------- chìa số 1 ---------- */
// chia_so({n, gi, s}) chìa vàng, đầu chìa ghi số bài n (1..13); gi: chìa mờ, gỉ (bài "Cần ôn lại"). Gốc = giữa cán chìa, đầu hướng lên.
function chia_so(o = {}){
  const s = o.s || 1, R = _R(), gi = !!o.gi, n = o.n || 1, vang = gi ? '#8C7B5A' : RP.vang, cam = gi ? '#6F6048' : RP.cam;
  const gr = R.lin('vg', [[0, _rmix(vang, .35)], [.5, vang], [1, _rmix(cam, -.15)]], 1, 1);
  const ri = gi ? `<circle cx="-6" cy="-46" r="2.4" fill="#7A4B2A" opacity=".7"/><circle cx="7" cy="-36" r="1.8" fill="#7A4B2A" opacity=".7"/><circle cx="2" cy="6" r="2" fill="#7A4B2A" opacity=".6"/>` : `<path d="M-12 -56 Q-4 -64 6 -62" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".7"/>`;
  const so = `<text x="0" y="-46" text-anchor="middle" dominant-baseline="central" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-weight="800" font-size="${n > 9 ? 21 : 28}" fill="${_rmix(cam, -.45)}">${n}</text>`;
  return R.out(`<g transform="scale(${s})" ${gi ? 'opacity=".8"' : ''}>${R.bong(0, 44, 18, 4.5, .2)}
    <rect x="-5" y="-26" width="10" height="68" rx="4" fill="${gr}" ${R.S()}/>
    <rect x="5" y="22" width="12" height="7" rx="2" fill="${gr}" ${R.S()}/><rect x="5" y="33" width="9" height="7" rx="2" fill="${gr}" ${R.S()}/><rect x="-5" y="-6" width="14" height="4" rx="2" fill="${_rmix(vang, -.15)}"/>
    <circle cx="0" cy="-46" r="25" fill="${gr}" ${R.S(1.6)}/><circle cx="0" cy="-46" r="19" fill="${_rmix(vang, .22)}" stroke="${_rmix(cam, -.2)}" stroke-opacity=".5" stroke-width="1.4"/>${so}${ri}</g>`);
}
const chia_so_1 = (o = {}) => chia_so({ ...o, n: 1 });

/* ---------- bức điện (thẻ giấy chứa câu) ---------- */
// buc_dien({w,h,mau,s}) mép thư hàng không (sọc đỏ, xanh). Có ô .o-chu để đặt chữ HTML. Gốc = tâm bức điện.
function buc_dien(o = {}){
  const w = o.w || 132, hh = o.h || 84, s = o.s || 1, R = _R(), x = -w / 2, y = -hh / 2;
  const soc = R.pat('soc', `<rect width="16" height="16" fill="${RP.trang}"/><rect width="5" height="16" fill="${RP.do}"/><rect x="8" width="5" height="16" fill="${RP.xanh}"/>`, 16, 16, 45);
  return R.out(`<g transform="scale(${s})">${R.bong(0, hh / 2 + 5, w * .46, 5, .2)}
    <rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="7" fill="${soc}" ${R.S()}/>
    <rect x="${x + 6}" y="${y + 6}" width="${w - 12}" height="${hh - 12}" rx="3.5" fill="${R.v('giay', RP.giay, .3, -.05)}"/>
    <rect x="${x + w - 40}" y="${y + 11}" width="26" height="26" rx="2" fill="${RP.giay_toi}" stroke="${RP.xam_toi}" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="2.6 2.2"/>
    <path d="M${x + w - 27} ${y + 17} l2.6 5.6 6 .8 -4.4 4.1 1.2 6 -5.4 -3 -5.4 3 1.2 -6 -4.4 -4.1 6 -.8 Z" fill="${RP.do}" opacity=".78"/>
    <rect x="${x + 14}" y="${y + 14}" width="${w - 62}" height="4" rx="2" fill="${RP.xam}" opacity=".35"/>
    <rect class="o-chu" x="${x + 14}" y="${y + 24}" width="${w - 28}" height="${hh - 40}" rx="3" fill="none"/></g>`);
}

/* ---------- 5 dụng cụ (biểu tượng, gốc = tâm, trong khung -40..40) ---------- */
// 1. Cân thăng bằng (Kiểu 1: thay bằng từ cùng nghĩa). nghieng: độ nghiêng đòn cân (0 = cân bằng)
function dc_can_thang_bang(o = {}){
  const R = _R(), a = (o.nghieng || 0) * Math.PI / 180, L = 27, py = -22;
  const ex = L * Math.cos(a), ey = L * Math.sin(a), lx = -ex, ly = py - ey, rx = ex, ry = py + ey;
  const dia = (cx, cy, mau) => `<line x1="${cx}" y1="${cy}" x2="${cx - 11}" y2="${cy + 22}" stroke="${RP.thep_toi}" stroke-width="1.4"/><line x1="${cx}" y1="${cy}" x2="${cx + 11}" y2="${cy + 22}" stroke="${RP.thep_toi}" stroke-width="1.4"/>
    <path d="M${cx - 15} ${cy + 22} Q${cx} ${cy + 32} ${cx + 15} ${cy + 22} Z" fill="${R.v('dia' + cx, RP.thep, .3, -.15)}" ${R.S(1.2)}/>
    <rect x="${cx - 8}" y="${cy + 12}" width="16" height="10" rx="2" fill="${mau}" ${R.S(1)}/><rect x="${cx - 5}" y="${cy + 15}" width="10" height="2" rx="1" fill="#fff" opacity=".7"/>`;
  return R.out(`<g>${R.bong(0, 36, 22, 3.6, .2)}
    <path d="M-18 36 L-12 28 L12 28 L18 36 Z" fill="${R.v('de', RP.go, .1, -.2)}" ${R.S()}/>
    <rect x="-2.6" y="-22" width="5.2" height="52" rx="2.4" fill="${R.h('tru', RP.thep, .3, -.25)}" ${R.S(1.2)}/>
    <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="${RP.go_toi}" stroke-width="5" stroke-linecap="round"/><line x1="${lx}" y1="${ly - 1}" x2="${rx}" y2="${ry - 1}" stroke="${RP.go_sang}" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    ${dia(lx, ly, RP.xanh_sang)}${dia(rx, ry, RP.jade_sang)}
    <circle cx="0" cy="${py}" r="5.2" fill="${R.rad('bi', RP.vang)}" ${R.S(1.2)}/></g>`);
}
// 2. Gương lật (Kiểu 2: viết câu theo cách khác). Cảnh trong gương đảo chiều.
function dc_guong_lat(o = {}){
  const R = _R();
  const mui = (x, y, quay, mau) => `<g transform="translate(${x} ${y}) scale(${quay} 1)"><path d="M-11 0 H8" stroke="${mau}" stroke-width="3.6" stroke-linecap="round"/><path d="M3 -6 L11 0 L3 6" fill="none" stroke="${mau}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  return R.out(`<g>${R.bong(0, 38, 16, 3.4, .2)}
    <rect x="-4.5" y="16" width="9" height="22" rx="4.5" fill="${R.h('can', RP.go_toi)}" ${R.S()}/>
    <circle cx="0" cy="-6" r="27" fill="${R.h('vk', RP.thep, .3, -.3)}" ${R.S(1.6)}/>
    <circle cx="0" cy="-6" r="22" fill="${R.lin('gk', [[0, '#EAFBF5'], [1, '#B9EAD9']])}" stroke="${RP.thep_toi}" stroke-opacity=".4" stroke-width="1.2"/>
    <line x1="-17" y1="-6" x2="17" y2="-6" stroke="${RP.xam}" stroke-width="1.2" stroke-dasharray="2.4 2.4" opacity=".7"/>
    ${mui(0, -15, 1, RP.cam)}${mui(0, 3, -1, RP.xanh)}
    <path d="M-16 -16 Q-12 -25 -2 -27" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/></g>`);
}
// 3. Thước đo (Kiểu 3: nói con số theo cách khác). pct: phần tô, vạch "một nửa" ở 50%
function dc_thuoc_do(o = {}){
  const R = _R(), pct = o.pct == null ? .55 : o.pct, W = 72, x0 = -W / 2, xf = x0 + W * pct, xm = 0;
  let tick = ''; for(let i = 0; i <= 4; i++) tick += `<line x1="${x0 + W * i / 4}" y1="9" x2="${x0 + W * i / 4}" y2="${i % 2 ? 13 : 16}" stroke="${RP.xam_toi}" stroke-width="1.6" stroke-linecap="round"/>`;
  return R.out(`<g transform="translate(0 4)">${R.bong(0, 21, 34, 3.4, .16)}
    <rect x="${x0 - 3}" y="-9" width="${W + 6}" height="22" rx="5" fill="${R.v('th', RP.giay, .3, -.08)}" ${R.S()}/>
    <rect x="${x0}" y="-6" width="${W}" height="14" rx="3" fill="${RP.giay_toi}"/>
    <rect x="${x0}" y="-6" width="${xf - x0}" height="14" rx="3" fill="${R.v('to', RP.jade_sang, .12, -.12)}"/>${tick}
    <line x1="${xm}" y1="-26" x2="${xm}" y2="12" stroke="${RP.do}" stroke-width="2.2" stroke-dasharray="3.4 2.6" stroke-linecap="round"/>
    <path d="M${xm} -30 L${xm + 12} -26 L${xm} -22 Z" fill="${RP.do}" ${R.S(1)}/>
    <path d="M${xf} -12 L${xf - 5} -20 L${xf + 5} -20 Z" fill="${RP.jade_toi}"/></g>`);
}
// 4. Túi phân loại (Kiểu 4: nói chung thay cho nói cụ thể). Vài vật nhỏ rơi vào túi lớn.
function dc_tui_phan_loai(o = {}){
  const R = _R();
  const bi = (x, y, c) => `<circle cx="${x}" cy="${y}" r="5.4" fill="${R.rad('b' + x, c)}" ${R.S(1)}/>`;
  return R.out(`<g>${R.bong(0, 36, 24, 3.8, .2)}
