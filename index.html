<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 7: Khổng lồ và Tí hon</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,700;0,800;1,500;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF7F0;--line:#E4DCC9;--ink:#1F2A24;--ink2:#4A5A51;--jade:#2A8167;--jade-dark:#14432F;--jade-light:#E8F6F0;--accent:#E8A24A;--accent-light:#FDF3E7;--en:#1D3557}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;height:100%;margin:0 auto;padding:8px 10px;display:flex;gap:10px}
button{font:inherit;cursor:pointer}
.btn{min-height:48px;border:3px solid #fff;border-radius:20px;background:linear-gradient(#3CA57A,#2A8167);color:#fff;font-weight:800;font-size:16px;padding:8px 22px;box-shadow:4px 4px 10px rgba(20,67,47,.18),inset -2px -2px 6px rgba(0,0,0,.08);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.94)}
.btn.phu{background:#fff;color:var(--jade-dark);border-color:var(--line)}
.trai{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
/* hàng đầu (điện thoại): bảng kỷ lục thu gọn, vòng, nút luật */
.dau{flex:none;display:flex;gap:8px;align-items:center;min-height:48px}
.dau .bang-nho{height:46px;flex:none}
.dau .bang-nho svg{height:46px;width:auto;display:block}
.dau .vong{flex:1;min-width:0;font-size:14px;font-weight:800;color:var(--jade-dark);line-height:1.25}
.dau .vong small{display:block;font-weight:700;color:var(--ink2);font-size:12.5px}
.hoi-luat{flex:none;width:44px;min-height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--jade);font-weight:800;font-size:18px}
/* sân khấu */
.san-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.canh{flex:1;min-height:170px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(20,67,47,.14);background:#14432F;position:relative}
.canh svg{display:block;width:100%;height:100%}
.the{transform-box:fill-box;transform-origin:center}
.canh .tiep{position:absolute;right:10px;bottom:10px;z-index:3;min-height:46px;padding:6px 18px;font-size:15px}
.mo-man{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:9% 16px 0;text-align:center;color:#fff;pointer-events:none}
.mo-man h1{margin:0;font-size:clamp(24px,5.4vw,40px);font-weight:800;letter-spacing:.01em;text-shadow:0 3px 14px rgba(0,0,0,.45)}
.mo-man p{margin:6px 0 0;max-width:460px;font-size:15px;line-height:1.4;font-weight:700;color:#FDF3E7;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.mo-man .btn{pointer-events:auto;position:absolute;left:50%;bottom:18px;transform:translateX(-50%)}
.bang-vong{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:3;background:#fff;border:3px solid #F2C14E;border-radius:20px;padding:10px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;transition:all .45s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.bang-vong.hien{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bang-vong b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.bang-vong span{font-size:21px;font-weight:800;color:var(--jade-dark)}
/* ô lời */
.say{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:6px 10px;display:grid;grid-template-columns:46px 1fr 44px;gap:10px;align-items:center;min-height:62px}
.say .face{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--jade-light)}
.say .face svg{width:46px;height:46px;display:block}
.say .txt{font-size:16px;line-height:1.4;min-height:44px;align-self:center}
.say .txt b{color:var(--jade-dark)}
.say .txt i{color:#C9761E;font-weight:800}
.say .txt .en{font-style:italic;font-weight:700;color:var(--en)}
.say .txt .trong{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--accent);margin:0 2px}
.say .loa{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--jade)}
.say .loa svg{width:22px;height:22px}.say .loa.tat{color:#B7AFA3}.say .loa.dang{background:var(--jade-light);border-color:var(--jade)}
.hd{flex:none;font-size:15px;font-weight:700;color:var(--jade-dark);text-align:center;min-height:20px}
/* 3 nút đáp án */
.khay{flex:none;display:grid;grid-template-columns:1fr;gap:8px}
.khay.giua{align-content:center}
.lc{min-height:48px;border:3px solid #fff;background:#fff;border-radius:20px;padding:8px 14px;font-size:17px;font-style:italic;font-weight:800;color:var(--en);box-shadow:3px 4px 10px rgba(20,67,47,.12),0 0 0 1.5px var(--line);transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.lc:active{transform:scale(.96)}
.lc.dung{background:var(--jade-light);box-shadow:0 0 0 3px var(--jade)}
.lc.sai{opacity:.45;animation:rung .4s}
.lc.sai s{color:#C0392B;text-decoration-thickness:2.5px}
.lc.goi-y{animation:goiY 1.4s ease-in-out infinite}
@keyframes goiY{50%{box-shadow:0 0 0 5px rgba(232,162,74,.8)}}
@keyframes rung{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cau-dung{background:#fff;border:2px solid var(--jade);border-radius:18px;padding:8px 14px;font-size:17px;font-style:italic;font-weight:700;color:var(--en);text-align:center;line-height:1.4}
.cau-dung u{text-decoration:none;color:#C9761E;font-weight:800;border-bottom:2.5px solid var(--accent)}
.bao-cao{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;font-size:15px;line-height:1.45;color:var(--ink2)}
.bao-cao .nhom-sai{display:inline-block;margin:2px 4px 2px 0;padding:0 7px;font-size:13.5px;border-radius:10px;background:var(--accent-light);font-weight:700;color:#7A4E12}
.hang-nut{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hang-nut .btn{text-decoration:none;display:inline-flex;align-items:center}
/* cột phải (máy tính) */
.phai{display:none}
.phai .panel{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.phai h2{margin:0;font-size:16px;color:var(--jade-dark)}
.phai .bang-lon svg{width:100%;height:auto;display:block}
.ds-vong{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ds-vong li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink2);padding:6px 8px;border-radius:12px;border:1.5px solid var(--line)}
.ds-vong li.dang{border-color:var(--accent);background:var(--accent-light);color:#7A4E12}
.ds-vong li.xong{color:var(--jade-dark)}
.ds-vong li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);color:#fff;font-style:normal;font-size:13px;display:grid;place-items:center}
.ds-vong li.dang i{background:var(--accent)}.ds-vong li.xong i{background:var(--jade)}
.phai .luot{font-size:14px;color:var(--ink2);font-weight:700}
/* luật chơi */
.luat{position:absolute;inset:0;z-index:6;background:rgba(250,247,240,.97);border-radius:22px;display:none;flex-direction:column;padding:16px;gap:10px;overflow:auto}
.luat h2{margin:0;font-size:19px;color:var(--jade-dark)}
.luat .muc{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;font-size:15.5px;line-height:1.4}
.luat .so{width:32px;height:32px;border-radius:50%;background:var(--jade);color:#fff;font-weight:800;display:grid;place-items:center}
.luat .cuoi{margin-top:auto;display:flex;justify-content:flex-end}
@media (min-width:900px) and (min-height:560px){
  .phai{display:flex;flex-direction:column;width:320px;flex:none}
  .dau .bang-nho{display:none}
  .khay{grid-template-columns:repeat(3,1fr)}
  .khay.mot{grid-template-columns:1fr}
}
@media (max-width:899px), (max-height:559px){ .khay{min-height:160px;align-content:start} .khay.giua{align-content:center} .say{min-height:86px} }
@media (max-width:560px){ .say .txt{font-size:15px} .lc{font-size:16px;padding:6px 12px} }
@media (max-height:700px) and (max-width:899px){ .lc{min-height:46px} .khay{min-height:154px} .say{min-height:80px} }
/* #edit */
.sua .say .txt{outline:2px dashed var(--accent);outline-offset:3px;border-radius:6px}
#xuatLoi{position:fixed;right:10px;top:10px;z-index:20;display:none}
.sua #xuatLoi{display:block}
</style>

  <div class="dau">

<script>/* ===== CHIBI: bộ nhân vật dùng chung (SVG thuần, không ảnh, sắc nét mọi màn hình) =====
   chibi(opt) → chuỗi <g> đặt ở gốc (0,0) = giữa hai bàn chân; cao ~170 đơn vị ở scale 1.
   opt: { tuoi:'tre'|'hs'|'nguoi_lon'|'gia', gioi:'nam'|'nu',
          da:'sang'|'vua'|'ngam'|'nau'|'dam' (hoặc mã màu), toc:'den'|'nau'|'nau_sang'|'vang'|'vang_nhat'|'do'|'bac' (hoặc mã màu),
          kieu_toc:'ngan'|'duoi_ngua'|'dai'|'bob'|'bui'|'hoi'|'mu'|'xoan'|'tet'|'bui_doi'|'dinh'|'mai_bang'|'mu_len',
          ao:'jade'|'xanh'|'cam'|'hong'|'tim'|'do'|'trang'|'xam'|'vang' (hoặc mã màu), quan:mã màu, vay:bool, ao_khoac:mã màu,
          kinh:bool, bo_bot:bool (tay phải bó bột, đeo dây), ca_vat:mã màu, mu:mã màu (cho 'mu'/'mu_len'), phu_kien:'no'|'bang_do', mau_phu_kien:mã màu, tan_nhang:bool,
          tu_the:'dung'|'chao'|'vay_tay'|'noi'|'ngoi'|'ngoi_noi'|'ngoi_doc'|'chay'|'doc'|'nam', mau_sach: màu bìa sách khi đọc (thấy bìa sau),
          bieu_cam:'cuoi'|'noi'|'ngac_nhien'|'tap_trung'|'buon'|'ngu', quay:1|-1 (lật ngang), s: tỉ lệ }            */
const CHIBI_PAL = {
  da: { sang:'#FFE0C7', vua:'#F6CBA8', ngam:'#D9A47E', nau:'#C08A5E', dam:'#8C5B3A' },
  toc: { den:'#2B1D16', nau:'#5A3825', nau_sang:'#8A5A3B', vang:'#C9974C', vang_nhat:'#E9C46A', do:'#B5532E', bac:'#C9CED3' },
  ao: { jade:'#2A8167', xanh:'#3B7FB8', cam:'#E8A24A', hong:'#E46C8C', tim:'#7B5EA7', do:'#C0392B', trang:'#F4F1EA', xam:'#6C7A89', vang:'#F2C14E' },
  vien: '#3B2A22'
};
let _chibiId = 0;
const _chibiNs = 'cb' + Math.random().toString(36).slice(2, 6) + '_';   // tránh trùng id khi dán SVG đã vẽ sẵn từ trang khác
function chibi(o = {}){
  const id = _chibiNs + (++_chibiId);
  const P = CHIBI_PAL, s = o.s || 1, flip = o.quay === -1 ? -1 : 1;
  const tuoi = o.tuoi || 'hs', gia = tuoi === 'gia', tre = tuoi === 'tre', lon = tuoi === 'nguoi_lon' || gia;
  const da = P.da[o.da] || o.da || P.da.vua, toc = P.toc[o.toc] || o.toc || P.toc.den;
  const ao = P.ao[o.ao] || o.ao || P.ao.jade, quan = o.quan || '#34495E';
  const pose = o.tu_the || 'dung', mat = o.bieu_cam || 'cuoi';
  const k = tre ? .82 : lon ? 1.06 : 1;                 // chiều cao thân
  const R = tre ? 33 : 35;                              // bán kính đầu (to: chibi)
  const sit = pose.startsWith('ngoi'), run = pose === 'chay', lie = pose === 'nam';
  const hipY = sit ? -24 : -40 * k, neckY = hipY - 34 * k, headY = neckY - R + 4;
  const shade = (c, a) => `<linearGradient id="${id}${a}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity="1"/></linearGradient>`;
  let d = `<defs>
    <radialGradient id="${id}sk" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#FFF4EA"/><stop offset=".45" stop-color="${da}"/><stop offset="1" stop-color="${da}"/></radialGradient>
    <linearGradient id="${id}ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ao}"/><stop offset="1" stop-color="${ao}"/></linearGradient>
    <linearGradient id="${id}tc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${toc}" stop-opacity=".78"/><stop offset=".6" stop-color="${toc}"/></linearGradient>
    <filter id="${id}bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;
  const V = P.vien, sw = 1.6;
  // bóng đổ mềm dưới chân
  d += `<ellipse cx="0" cy="${sit ? 2 : 1}" rx="${sit ? 34 : 26}" ry="6" fill="#1F2A24" opacity=".22" filter="url(#${id}bl)"/>`;
  const hy = headY;
  if(o.kieu_toc === 'tet') {   // hai bím tóc thả hai bên
    for(const sx of [-1, 1]) for(let k2 = 0; k2 < 4; k2++) d += `<ellipse cx="${sx*(R-2)}" cy="${hy+10+k2*9}" rx="${6-k2*.6}" ry="6" fill="url(#${id}tc)" stroke="${V}" stroke-width="1.3"/>`;
    for(const sx of [-1, 1]) d += `<circle cx="${sx*(R-2)}" cy="${hy+46}" r="3.2" fill="${P.ao.hong}" stroke="${V}" stroke-width="1"/>`;
  }
  if(o.kieu_toc === 'xoan') d += `<g fill="url(#${id}tc)" stroke="${V}" stroke-width="1.4">${[[-R-2,hy+6],[R+2,hy+6],[-R-4,hy-8],[R+4,hy-8]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10"/>`).join('')}</g>`;
  if(o.kieu_toc === 'mai_bang') d += `<path d="M${-R-2} ${hy-4} Q${-R-4} ${hy+R+16} ${-R+6} ${hy+R+20} H${R-6} Q${R+4} ${hy+R+16} ${R+2} ${hy-4} Z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`;
  if(o.kieu_toc === 'dai' || o.kieu_toc === 'duoi_ngua' || o.kieu_toc === 'bob') {
    const back0 = o.kieu_toc === 'dai' ? `<path d="M${-R-2} ${hy-4} Q${-R-6} ${hy+R+22} ${-R+8} ${hy+R+26} H${R-8} Q${R+6} ${hy+R+22} ${R+2} ${hy-4} Z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`
      : o.kieu_toc === 'duoi_ngua' ? `<path d="M${R-6} ${hy-14} q${R*.9} 8 ${R*.5} ${R+18} q-10 -14 -${R*.45} -${R*.55}z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`
      : `<path d="M${-R-3} ${hy-2} Q${-R-4} ${hy+R*.8} ${-R+6} ${hy+R*.85} H${R-6} Q${R+4} ${hy+R*.8} ${R+3} ${hy-2} Z" fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}"/>`;
    d += back0;
  }
  // ----- chân
  const leg = (x, ang, len, shoeDir) => {
    const a = ang * Math.PI / 180, x2 = x + Math.sin(a) * len, y2 = hipY + Math.cos(a) * len;
    return `<path d="M${x} ${hipY} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${o.vay && !sit ? da : quan}" stroke-width="${tre ? 9 : 10}" stroke-linecap="round"/>
      <ellipse cx="${(x2 + 3 * shoeDir).toFixed(1)}" cy="${(y2 + 1).toFixed(1)}" rx="7" ry="4.6" fill="#2F2A36" stroke="${V}" stroke-width="1"/>`;
  };
  if(sit) d += leg(-8, 6, 22, -1) + leg(8, -6, 22, 1);
  else if(run) d += leg(-6, 38, 38 * k, 1) + leg(6, -30, 38 * k, -1);
  else d += leg(-7, 4, 38 * k + 2, -1) + leg(7, -4, 38 * k + 2, 1);
  // ----- thân (áo) + váy
  const bw = tre ? 30 : 34, bt = neckY + 2;
  d += `<path d="M${-bw/2} ${hipY+2} Q${-bw/2-2} ${bt+8} ${-bw/2+6} ${bt} H${bw/2-6} Q${bw/2+2} ${bt+8} ${bw/2} ${hipY+2} Z" fill="url(#${id}ao)" stroke="${V}" stroke-width="${sw}"/>`;
  d += `<clipPath id="${id}cp"><path d="M${-bw/2} ${hipY+2} Q${-bw/2-2} ${bt+8} ${-bw/2+6} ${bt} H${bw/2-6} Q${bw/2+2} ${bt+8} ${bw/2} ${hipY+2} Z"/></clipPath>
    <g clip-path="url(#${id}cp)"><rect x="${bw*0.12}" y="${bt}" width="${bw}" height="${hipY-bt+4}" fill="#1F2A24" opacity=".13"/><rect x="${-bw/2}" y="${bt}" width="${bw*0.22}" height="${hipY-bt+4}" fill="#fff" opacity=".14"/></g>`;
  if(o.vay) d += `<path d="M${-bw/2-3} ${hipY-2} L${-bw/2-8} ${hipY+16} H${bw/2+8} L${bw/2+3} ${hipY-2} Z" fill="${quan}" stroke="${V}" stroke-width="${sw}"/>`;
  d += `<path d="M-7 ${bt} L0 ${bt+9} L7 ${bt}" fill="#fff" stroke="${V}" stroke-width="1.2"/>`;           // cổ áo
  if(o.ao_khoac) d += `<path d="M${-bw/2} ${hipY+2} Q${-bw/2-2} ${bt+8} ${-bw/2+6} ${bt} H-4 L-3 ${hipY+2} Z" fill="${o.ao_khoac}" stroke="${V}" stroke-width="${sw}"/><path d="M${bw/2} ${hipY+2} Q${bw/2+2} ${bt+8} ${bw/2-6} ${bt} H4 L3 ${hipY+2} Z" fill="${o.ao_khoac}" stroke="${V}" stroke-width="${sw}"/>`;
  if(o.ca_vat) d += `<path d="M0 ${bt+8} l-3.5 5 3.5 12 3.5-12z" fill="${o.ca_vat}" stroke="${V}" stroke-width="1"/>`;
  // ----- tay: góc tính từ phương thẳng xuống, dương = ra ngoài thân (trái/phải tự đối xứng); tay giơ cao vẽ sau đầu
  const arm = (side, a1, a2) => {
    const sx = side * (bw/2 - 2), sy = bt + 6, L1 = 15 * k, L2 = 14 * k, r = Math.PI / 180;
    const ex = sx + side * Math.sin(a1 * r) * L1, ey = sy + Math.cos(a1 * r) * L1;
    const hx = ex + side * Math.sin(a2 * r) * L2, hy2 = ey + Math.cos(a2 * r) * L2;
    return `<path d="M${sx} ${sy} L${ex.toFixed(1)} ${ey.toFixed(1)} L${hx.toFixed(1)} ${hy2.toFixed(1)}" stroke="${V}" stroke-width="11.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M${sx} ${sy} L${ex.toFixed(1)} ${ey.toFixed(1)} L${hx.toFixed(1)} ${hy2.toFixed(1)}" stroke="${o.ao_khoac || ao}" stroke-width="8.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="${hx.toFixed(1)}" cy="${hy2.toFixed(1)}" r="5" fill="url(#${id}sk)" stroke="${V}" stroke-width="1.1"/>`;
  };
  // [trái:a1,a2] [phải:a1,a2]; a âm = vào trong thân
  const AR = {
    dung:[[14,8],[14,8]], chao:[[6,2],[6,2]], noi:[[14,8],[70,140]], vay_tay:[[14,8],[95,165]],
    chay:[[40,95],[25,-25]], doc:[[-25,-95],[-25,-95]], ngoi_doc:[[-25,-95],[-25,-95]], ngoi:[[-20,-80],[-20,-80]], ngoi_noi:[[-20,-80],[70,140]], nam:[[14,8],[14,8]]
  }[pose] || [[14,8],[14,8]];
  if(o.bo_bot) AR[1] = [18, -78];   // tay phải gập trước ngực, bó bột
  const armL = arm(-1, ...AR[0]), armR = arm(1, ...AR[1]);
  let bot = '';
  if(o.bo_bot){ const sx = bw/2 - 2, sy = bt + 6, L1 = 15 * k, L2 = 14 * k, r = Math.PI / 180, ex = sx + Math.sin(18 * r) * L1, ey = sy + Math.cos(18 * r) * L1, hx = ex + Math.sin(-78 * r) * L2, hy2 = ey + Math.cos(-78 * r) * L2;
    bot = `<path d="M${-bw/2+4} ${bt+2} L${(hx - 2).toFixed(1)} ${(hy2 + 4).toFixed(1)} M${(ex + 2).toFixed(1)} ${(ey + 4).toFixed(1)} L${bw/2-6} ${bt+1}" stroke="#3B7FB8" stroke-width="3.2" fill="none" stroke-linecap="round"/>`
      + `<path d="M${ex.toFixed(1)} ${ey.toFixed(1)} L${(hx + 3).toFixed(1)} ${hy2.toFixed(1)}" stroke="${V}" stroke-width="14.5" stroke-linecap="round"/><path d="M${ex.toFixed(1)} ${ey.toFixed(1)} L${(hx + 3).toFixed(1)} ${hy2.toFixed(1)}" stroke="#FFFDF6" stroke-width="11.5" stroke-linecap="round"/>`
      + `<path d="M${(ex - 3).toFixed(1)} ${(ey - 1).toFixed(1)} l2 5 M${((ex + hx) / 2).toFixed(1)} ${((ey + hy2) / 2 - 3).toFixed(1)} l1 6" stroke="#D6CBB5" stroke-width="1.2"/>`; }
  const raisedR = AR[1][1] > 100, raisedL = AR[0][1] > 100;
  if(!raisedL) d += armL; if(!raisedR) d += armR; d += bot;
  if((pose === 'doc' || pose === 'ngoi_doc') && o.mau_sach) d += `<g transform="translate(0 ${bt+18})"><path d="M-16 -9 H16 V11 H-16Z" fill="${o.mau_sach}" stroke="${V}" stroke-width="1.3" stroke-linejoin="round"/><path d="M0 -9 V11" stroke="${V}" stroke-width="1.1" opacity=".6"/><path d="M-16 -9 H16" stroke="#FFFDF6" stroke-width="2"/><path d="M7 -4 l1.6 3.2 3.4 .5 -2.5 2.4 .6 3.4 -3.1 -1.6 -3.1 1.6 .6 -3.4 -2.5 -2.4 3.4 -.5z" fill="#F2C14E"/></g>`;
  else if(pose === 'doc' || pose === 'ngoi_doc') d += `<g transform="translate(0 ${bt+18})"><path d="M-15 -8 Q0 -2 0 2 Q0 -2 15 -8 V8 Q0 12 0 14 Q0 12 -15 8Z" fill="#FFFDF6" stroke="${V}" stroke-width="1.2"/><path d="M0 2 V14" stroke="${V}" stroke-width="1"/><path d="M-11 -1 h8 M-11 3 h8 M3 -1 h8 M3 3 h8" stroke="#B7AFA3" stroke-width="1"/></g>`;
  // ----- đầu
  if(pose === 'chao') d += `<g transform="rotate(-4 0 ${neckY})">`;
  d += `<circle cx="0" cy="${hy}" r="${R}" fill="url(#${id}sk)" stroke="${V}" stroke-width="${sw}"/>`;
  d += `<ellipse cx="${-R+1}" cy="${hy+4}" rx="4.5" ry="6.5" fill="url(#${id}sk)" stroke="${V}" stroke-width="1.2"/><ellipse cx="${R-1}" cy="${hy+4}" rx="4.5" ry="6.5" fill="url(#${id}sk)" stroke="${V}" stroke-width="1.2"/>`;
  // mặt
  const ey = hy + 5, ex = 13;
  const eye = (x) => mat === 'ngu' ? `<path d="M${x-6} ${ey} q6 5 12 0" stroke="${V}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="${x}" cy="${ey}" rx="${mat==='ngac_nhien'?6.5:6}" ry="${mat==='ngac_nhien'?8.5:7.6}" fill="#2B211D"/><ellipse cx="${x}" cy="${ey+2.6}" rx="4.2" ry="3.6" fill="#6B4A3A" opacity=".85"/>
       <circle cx="${x+2.2}" cy="${ey-3}" r="2.3" fill="#fff"/><circle cx="${x-2.4}" cy="${ey+2.8}" r="1.1" fill="#fff" opacity=".9"/>`;
  d += eye(-ex) + eye(ex);
  const brow = mat === 'buon' ? [2, -2] : mat === 'tap_trung' ? [-2, 2] : [0, 0];
  d += `<path d="M${-ex-6} ${ey-12+brow[0]} q6 -3.5 12 0" stroke="${toc}" stroke-width="2.3" fill="none" stroke-linecap="round"/><path d="M${ex-6} ${ey-12+brow[1]} q6 -3.5 12 0" stroke="${toc}" stroke-width="2.3" fill="none" stroke-linecap="round"/>`;
  d += `<ellipse cx="${-ex-5}" cy="${ey+11}" rx="6" ry="3.4" fill="#F28B8B" opacity=".45"/><ellipse cx="${ex+5}" cy="${ey+11}" rx="6" ry="3.4" fill="#F28B8B" opacity=".45"/>`;
  const my = ey + 15;
  d += mat === 'noi' ? `<path d="M-5 ${my-1} q5 8 10 0 z" fill="#8B3A3A" stroke="${V}" stroke-width="1.2"/>`
     : mat === 'ngac_nhien' ? `<ellipse cx="0" cy="${my+1}" rx="3.6" ry="4.4" fill="#8B3A3A" stroke="${V}" stroke-width="1.2"/>`
     : mat === 'buon' ? `<path d="M-5 ${my+3} q5 -5 10 0" stroke="${V}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
     : mat === 'tap_trung' ? `<path d="M-4 ${my+1} h8" stroke="${V}" stroke-width="1.8" stroke-linecap="round"/>`
     : `<path d="M-6 ${my-1} q6 6 12 0" stroke="${V}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
  if(o.kinh) d += `<g fill="rgba(255,255,255,.18)" stroke="#3B2A22" stroke-width="1.8"><rect x="${-ex-9}" y="${ey-8}" width="18" height="15" rx="6"/><rect x="${ex-9}" y="${ey-8}" width="18" height="15" rx="6"/><path d="M-4 ${ey-2} h8"/></g>`;
  // tóc (trước)
  const kt = o.kieu_toc || (o.gioi === 'nu' ? 'duoi_ngua' : 'ngan');
  const top = hy - R;
  const fringe = {
    ngan:`<path d="M${-R-1} ${hy+2} Q${-R-3} ${top-8} 0 ${top-6} Q${R+3} ${top-8} ${R+1} ${hy+2} Q${R-6} ${hy-14} ${R*.3} ${hy-17} Q${R*.1} ${hy-10} ${-R*.15} ${hy-16} Q${-R*.5} ${hy-9} ${-R+4} ${hy-10} Z"/>`,
    duoi_ngua:`<path d="M${-R-1} ${hy+4} Q${-R-2} ${top-8} 0 ${top-5} Q${R+2} ${top-8} ${R+1} ${hy+4} Q${R-8} ${hy-18} ${-R*.1} ${hy-17} Q${-R*.6} ${hy-14} ${-R+3} ${hy-2} Z"/><circle cx="${R-8}" cy="${top+6}" r="4" fill="${P.ao.cam}" stroke="${V}" stroke-width="1"/>`,
    dai:`<path d="M${-R-1} ${hy+6} Q${-R-2} ${top-8} 0 ${top-5} Q${R+2} ${top-8} ${R+1} ${hy+6} Q${R-4} ${hy-12} ${R*.2} ${hy-18} Q0 ${hy-9} ${-R*.2} ${hy-18} Q${-R+4} ${hy-12} ${-R-1} ${hy+6} Z"/>`,
    bob:`<path d="M${-R-2} ${hy+8} Q${-R-3} ${top-8} 0 ${top-5} Q${R+3} ${top-8} ${R+2} ${hy+8} Q${R-2} ${hy-14} ${-R*.1} ${hy-15} Q${-R+2} ${hy-12} ${-R-2} ${hy+8} Z"/>`,
    bui:`<circle cx="0" cy="${top-6}" r="12"/><path d="M${-R-1} ${hy+2} Q${-R-2} ${top-6} 0 ${top-3} Q${R+2} ${top-6} ${R+1} ${hy+2} Q${R-10} ${hy-16} 0 ${hy-15} Q${-R+10} ${hy-16} ${-R-1} ${hy+2} Z"/>`,
    hoi:`<path d="M${-R-1} ${hy+2} Q${-R-2} ${hy-R*.4} ${-R*.6} ${hy-R*.7} Q${-R*.3} ${hy-R*.35} ${-R+6} ${hy-2} Z M${R+1} ${hy+2} Q${R+2} ${hy-R*.4} ${R*.6} ${hy-R*.7} Q${R*.3} ${hy-R*.35} ${R-6} ${hy-2} Z"/>`,
    mu:`<path d="M${-R-1} ${hy-R*.35} Q${-R-2} ${top-8} 0 ${top-7} Q${R+2} ${top-8} ${R+1} ${hy-R*.35} Z" fill="${o.mu||'#2A8167'}"/><path d="M${-R*.2} ${hy-R*.38} Q${R*.7} ${hy-R*.5} ${R+14} ${hy-R*.3}" stroke="${o.mu||'#2A8167'}" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="0" cy="${top-6}" r="3" fill="${o.mu||'#2A8167'}"/>`,
    xoan:`${[-.8,-.45,0,.45,.8].map((f,i)=>`<circle cx="${f*R}" cy="${top+6+Math.abs(f)*10}" r="${12-Math.abs(f)*2}"/>`).join('')}<circle cx="${-R*.25}" cy="${top-2}" r="11"/><circle cx="${R*.25}" cy="${top-2}" r="11"/>`,
    tet:`<path d="M${-R-1} ${hy+4} Q${-R-2} ${top-8} 0 ${top-5} Q${R+2} ${top-8} ${R+1} ${hy+4} Q${R-6} ${hy-14} ${R*.05} ${hy-18} Q${-R*.05} ${hy-10} ${-R*.1} ${hy-18} Q${-R+6} ${hy-14} ${-R-1} ${hy+4} Z"/><path d="M0 ${top-4} V${hy-17}" stroke="${V}" stroke-width="1" opacity=".5"/>`,
    bui_doi:`<circle cx="${-R*.62}" cy="${top+2}" r="11"/><circle cx="${R*.62}" cy="${top+2}" r="11"/><path d="M${-R-1} ${hy+2} Q${-R-2} ${top-4} 0 ${top-3} Q${R+2} ${top-4} ${R+1} ${hy+2} Q${R-8} ${hy-15} 0 ${hy-14} Q${-R+8} ${hy-15} ${-R-1} ${hy+2} Z"/>`,
    dinh:`<path d="M${-R+1} ${hy-4} Q${-R} ${top-2} 0 ${top-2} Q${R} ${top-2} ${R-1} ${hy-4} Q${R*.5} ${hy-R*.62} 0 ${hy-R*.64} Q${-R*.5} ${hy-R*.62} ${-R+1} ${hy-4} Z" opacity=".92"/>`,
    mai_bang:`<path d="M${-R-2} ${hy+8} Q${-R-3} ${top-8} 0 ${top-5} Q${R+3} ${top-8} ${R+2} ${hy+8} L${R-4} ${hy-8} H${-R+4} Z"/>`,
    mu_len:`<path d="M${-R-2} ${hy-R*.25} Q${-R-3} ${top-10} 0 ${top-10} Q${R+3} ${top-10} ${R+2} ${hy-R*.25} Z" fill="${o.mu||'#C0392B'}"/><rect x="${-R-3}" y="${hy-R*.36}" width="${2*R+6}" height="9" rx="4.5" fill="${o.mu||'#C0392B'}" stroke="${V}" stroke-width="1.4"/><circle cx="0" cy="${top-12}" r="7" fill="#F4F1EA" stroke="${V}" stroke-width="1.3"/>`
  }[kt];
  d += `<g fill="url(#${id}tc)" stroke="${V}" stroke-width="${sw}" stroke-linejoin="round">${fringe}</g>`;
  if(o.phu_kien === 'no') d += `<g transform="translate(${-R*.62} ${top+10}) rotate(-18)"><path d="M0 0 l-11 -7 v14z M0 0 l11 -7 v14z" fill="${P.ao.hong}" stroke="${V}" stroke-width="1.3" stroke-linejoin="round"/><circle r="3.2" fill="#fff" stroke="${V}" stroke-width="1.1"/></g>`;
  if(o.phu_kien === 'bang_do') d += `<path d="M${-R+2} ${hy-R*.45} Q0 ${top-12} ${R-2} ${hy-R*.45}" stroke="${o.mau_phu_kien||P.ao.cam}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(o.tan_nhang) d += `<g fill="#B5703F" opacity=".55">${[-17,-13,-15,13,17,15].map((x,i)=>`<circle cx="${x}" cy="${hy+14+(i%3)*2.5}" r="1.1"/>`).join('')}</g>`;
  if(gia) d += `<path d="M${-R*.5} ${hy+R*.55} q${R*.5} 6 ${R} 0" stroke="#D2B8A0" stroke-width="1.2" fill="none" opacity=".7"/>`;
  if(pose === 'chao') d += `</g>`;
  if(raisedL) d += armL; if(raisedR) d += armR;
  // ánh sáng viền (rim light) trên đầu
  d += `<path d="M${-R*.7} ${hy-R*.72} Q0 ${hy-R*1.08} ${R*.7} ${hy-R*.72}" stroke="#fff" stroke-width="2" fill="none" opacity=".35" stroke-linecap="round"/>`;
  const tr = lie ? `rotate(-90) translate(${-hipY} 0)` : '';
  return `<g transform="scale(${s * flip} ${s}) ${tr}">${d}</g>`;
}

/* ----- DÀN NHÂN VẬT PHỤ ĐẶT SẴN (chưa đặt tên; bài nào cần thì đặt tên và dùng) -----
   Dùng: chibi({...CHIBI_CAST.hs_nu_vang, tu_the:'vay_tay'})                                        */
const CHIBI_CAST = {
  hs_nam_den:     { gioi:'nam', kieu_toc:'ngan', ao:'xanh' },
  hs_nam_vang:    { gioi:'nam', kieu_toc:'ngan', toc:'vang_nhat', ao:'jade', da:'sang' },
  hs_nam_do:      { gioi:'nam', kieu_toc:'xoan', toc:'do', ao:'cam', tan_nhang:true, da:'sang' },
  hs_nam_xoan:    { gioi:'nam', kieu_toc:'xoan', toc:'den', ao:'vang', da:'dam' },
  hs_nam_dinh:    { gioi:'nam', kieu_toc:'dinh', toc:'nau', ao:'do', ao_khoac:'#34495E', da:'nau' },
  hs_nam_mu_len:  { gioi:'nam', kieu_toc:'mu_len', mu:'#3B7FB8', ao:'xam', ao_khoac:'#E8A24A' },
  hs_nu_vang:     { gioi:'nu', kieu_toc:'dai', toc:'vang_nhat', ao:'hong', vay:true, quan:'#2F3E63', da:'sang', phu_kien:'bang_do' },
  hs_nu_tet:      { gioi:'nu', kieu_toc:'tet', toc:'nau_sang', ao:'jade', vay:true, quan:'#8A5A3B', tan_nhang:true },
  hs_nu_bui_doi:  { gioi:'nu', kieu_toc:'bui_doi', toc:'den', ao:'tim', vay:true, quan:'#2F3E63', da:'nau' },
  hs_nu_mai_bang: { gioi:'nu', kieu_toc:'mai_bang', toc:'den', ao:'trang', vay:true, quan:'#3B7FB8', phu_kien:'no' },
  hs_nu_do:       { gioi:'nu', kieu_toc:'bob', toc:'do', ao:'xanh', vay:true, quan:'#34495E', da:'sang' },
  hs_nu_xoan:     { gioi:'nu', kieu_toc:'xoan', toc:'nau', ao:'cam', vay:true, quan:'#6B3A3A', da:'dam', phu_kien:'bang_do', mau_phu_kien:'#E46C8C' },
  gv_nu:          { tuoi:'nguoi_lon', gioi:'nu', kieu_toc:'bui', toc:'nau', ao:'jade', vay:true, quan:'#34495E', kinh:true },
  gv_nam_vang:    { tuoi:'nguoi_lon', gioi:'nam', kieu_toc:'ngan', toc:'vang', ao:'trang', ca_vat:'#3B7FB8', ao_khoac:'#6C7A89', da:'sang' },
  bo_me_nu:       { tuoi:'nguoi_lon', gioi:'nu', kieu_toc:'duoi_ngua', toc:'den', ao:'hong', vay:true, quan:'#7B5EA7' },
  bo_me_nam:      { tuoi:'nguoi_lon', gioi:'nam', kieu_toc:'ngan', toc:'den', ao:'xanh', da:'ngam' },
  ong:            { tuoi:'gia', gioi:'nam', kieu_toc:'hoi', toc:'bac', ao:'xam', kinh:true },
  ba:             { tuoi:'gia', gioi:'nu', kieu_toc:'bui', toc:'bac', ao:'do', vay:true, quan:'#6B3A3A' },
  be_trai:        { tuoi:'tre', gioi:'nam', kieu_toc:'ngan', toc:'vang_nhat', ao:'cam', da:'sang' },
  be_gai:         { tuoi:'tre', gioi:'nu', kieu_toc:'bui_doi', toc:'den', ao:'vang', vay:true, quan:'#E46C8C' }
};
</script>
<script>/* ===== ĐỒ VẬT: bộ đồ vật, nhà cửa, xe cộ dùng chung (SVG thuần, tự vẽ, không ảnh) =====
   Mỗi hàm trả về chuỗi <g>, gốc (0,0) = giữa chân đồ vật trên mặt đất (cửa sổ: giữa mép dưới bệ).
   Cùng tỉ lệ với chibi(): ở s = 1 một học sinh cao ~170, nên dùng cùng s cho người và đồ vật trong một cảnh.
   Ánh sáng chung: từ trên bên trái. Kiểu nét: DV.vien = false (mềm, hiện đại, mặc định) | true (viền nâu giống chibi).
   Chung cho mọi hàm: { s: tỉ lệ, quay: 1|-1 (lật ngang), mau: màu chính (tên trong DV_PAL hoặc mã màu) }

   NỘI THẤT  ban({w,h,mau,tren:['sach','laptop','coc','den','binh_hoa']}) · ghe({kieu:'go'|'dem'}) · tu({kieu:'quan_ao'|'sach'})
             giuong({mau_chan}) · cua({mo, kieu:'go'|'kinh'}) · cua_so({w,h, dem, rem}) · dong_ho({gio, phut, r}) (gốc = tâm)
   NGOÀI TRỜI nha({mau_tuong, mau_mai, cu: 0..1 (rêu, dây leo)}) · lau_dai({mau_mai}) · toa_nha({kieu:'van_phong'|'chung_cu'|'truong'}) · cay({kieu:'tron'|'thong', mua:'thu', tuoi: 0..1 (lớn dần), qua: 0..1 (quả táo)})
   XE CỘ     o_to() · xe_buyt() · xe_dap({gio}) · xe_may()                                                               */
const DV_PAL = {
  go:'#B98A5A', go_sang:'#D9B283', go_toi:'#8A6440', kem:'#F4EBDD', trang:'#F7F4EE',
  jade:'#2A8167', jade_sang:'#3CA57A', jade_toi:'#14432F', cam:'#E8A24A', vang:'#F2C14E',
  xanh:'#3B7FB8', do:'#C0392B', gach:'#B5533E', xam:'#8C96A0', xam_toi:'#4A5560', tim:'#7B5EA7', hong:'#E46C8C'
};
const DV = { vien: false };
let _dvId = 0;
const _dvNs = 'dv' + Math.random().toString(36).slice(2, 6) + '_';

function _mix(hex, t){   // t > 0: pha trắng, t < 0: pha đen
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, n >> 8 & 255, n & 255];
  return '#' + ch.map(c => Math.round(t > 0 ? c + (255 - c) * t : c * (1 + t)).toString(16).padStart(2, '0')).join('');
}
const _col = (v, d) => DV_PAL[v] || v || d;

function _dv(o){
  const id = _dvNs + (++_dvId), defs = [];
  const S = (w = 1.6) => DV.vien ? `stroke="#3B2A22" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`
                                 : `stroke="#2A1D14" stroke-opacity=".22" stroke-width="${w * .55}" stroke-linejoin="round" stroke-linecap="round"`;
  const g = (name, stops, x2 = 0, y2 = 1) => {
    defs.push(`<linearGradient id="${id}${name}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ''}/>`).join('')}</linearGradient>`);
    return `url(#${id}${name})`;
  };
  const v = (name, c, a = .14, b = -.12) => g(name, [[0, _mix(c, a)], [1, _mix(c, b)]]);        // sáng trên, tối dưới
  const h = (name, c, a = .16, b = -.16) => g(name, [[0, _mix(c, a)], [1, _mix(c, b)]], 1, 0);   // sáng trái, tối phải
  const tru = (name, c) => g(name, [[0, _mix(c, -.05)], [.28, _mix(c, .28)], [.62, c], [1, _mix(c, -.28)]], 1, 0);   // khối tròn
  const kinh = (name, dem) => g(name, dem ? [[0, '#22304F'], [1, '#41557F']] : [[0, '#9ED2EC'], [.55, '#CDEAF6'], [1, '#EAF6FB']]);
  const r = (name, c) => { defs.push(`<radialGradient id="${id}${name}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${_mix(c, .3)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${_mix(c, -.25)}"/></radialGradient>`); return `url(#${id}${name})`; };
  let blurOn = false;
  const bong = (cx, cy, rx, ry = 7, op = .26) => { blurOn = true; return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#1F2A24" opacity="${op}" filter="url(#${id}bl)"/>`; };
  const ao = (x, y, w, hh = 6, op = .16) => `<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="#000" opacity="${op}"/>`;   // bóng tiếp xúc
  const phan_chieu = (x, y, w, hh) => `<path d="M${x + w * .18} ${y} L${x + w * .42} ${y} L${x + w * .12} ${y + hh} L${x - w * .12 < x ? x : x} ${y + hh} Z" fill="#fff" opacity=".28"/><path d="M${x + w * .5} ${y} L${x + w * .58} ${y} L${x + w * .28} ${y + hh} L${x + w * .2} ${y + hh} Z" fill="#fff" opacity=".18"/>`;
  const wrap = body => {
    if(blurOn) defs.push(`<filter id="${id}bl" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>`);
    const s = o.s || 1, f = o.quay === -1 ? -1 : 1;
    return `<g transform="scale(${s * f} ${s})"><defs>${defs.join('')}</defs>${body}</g>`;
  };
  return { id, S, g, v, h, tru, kinh, r, bong, ao, phan_chieu, wrap };
}

/* ================= NỘI THẤT ================= */

function _vat_tren_ban(k, x, y, c){   // đồ nhỏ đặt trên mặt bàn, (x,y) = điểm chạm mặt bàn
  const S = c.S;
  if(k === 'sach') return `<g transform="translate(${x} ${y})">
    <rect x="-22" y="-9" width="44" height="9" rx="1.5" fill="${c.v('s1', '#3B7FB8')}" ${S(1.2)}/><rect x="-20" y="-7" width="3" height="5" fill="#fff" opacity=".5"/>
    <rect x="-18" y="-17" width="38" height="8" rx="1.5" fill="${c.v('s2', '#E8A24A')}" ${S(1.2)} transform="rotate(-4 0 -13)"/>
    <rect x="-16" y="-15.5" width="34" height="2.5" fill="#FFF6E6" opacity=".8" transform="rotate(-4 0 -13)"/></g>`;
  if(k === 'laptop') return `<g transform="translate(${x} ${y})">
    <path d="M-26 0 L-22 -5 H22 L26 0 Z" fill="${c.v('lb', '#C9CED3')}" ${S(1.2)}/>
    <path d="M-20 -5 L-24 -40 H24 L20 -5 Z" fill="${c.v('lt', '#5E6973')}" ${S(1.2)}/>
    <path d="M-17 -8 L-20 -36 H20 L17 -8 Z" fill="${c.g('ls', [[0, '#7FC8E8'], [1, '#2A8167']])}"/>
    <path d="M-12 -36 L-4 -36 L-10 -8 L-17 -8 Z" fill="#fff" opacity=".22"/></g>`;
  if(k === 'coc') return `<g transform="translate(${x} ${y})">
    <path d="M7 -15 q9 0 9 6 t-9 6" fill="none" stroke="${_mix('#F4F1EA', -.2)}" stroke-width="3"/>
    <path d="M-8 -20 H8 L7 -1 Q0 1 -7 -1 Z" fill="${c.h('cc', '#F4F1EA', .1, -.2)}" ${S(1.2)}/><ellipse cx="0" cy="-20" rx="8" ry="2.4" fill="#6B4226"/>
    <path d="M-2 -26 q-3 -5 0 -9 M3 -27 q-3 -5 0 -9" stroke="#fff" stroke-width="1.5" fill="none" opacity=".6"/></g>`;
  if(k === 'den') return `<g transform="translate(${x} ${y})">
    <ellipse cx="0" cy="-2" rx="13" ry="3.5" fill="${c.v('db', '#34495E')}" ${S(1.2)}/>
    <path d="M0 -3 L-10 -34 L6 -52" fill="none" stroke="#34495E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-2 -60 L16 -44 L10 -38 Q2 -40 -6 -52 Z" fill="${c.h('dc', '#E8A24A')}" ${S(1.2)}/>
    <path d="M13 -41 L40 -6 L-6 -6 L7 -39 Z" fill="${c.g('dl', [[0, '#FFF3CF', .55], [1, '#FFF3CF', 0]])}"/></g>`;
  if(k === 'binh_hoa') return `<g transform="translate(${x} ${y})">
    <path d="M0 -18 C-4 -30 -10 -34 -12 -42 M0 -18 C2 -32 8 -36 10 -46 M0 -18 C0 -30 -2 -40 0 -50" stroke="#2A8167" stroke-width="2" fill="none"/>
    ${[[-12, -42, '#E46C8C'], [10, -46, '#F2C14E'], [0, -50, '#E8A24A']].map(([a, b, m]) => `<circle cx="${a}" cy="${b}" r="5.5" fill="${m}" ${S(1)}/><circle cx="${a}" cy="${b}" r="2" fill="#fff" opacity=".7"/>`).join('')}
    <path d="M-7 -20 H7 Q10 -10 6 0 H-6 Q-10 -10 -7 -20 Z" fill="${c.tru('bh', '#4E7F92')}" ${S(1.2)}/></g>`;
  return '';
}

function ban(o = {}){
  const c = _dv(o), S = c.S, w = o.w || 140, hh = o.h || 76, X = w / 2, d = 14, m = _col(o.mau, DV_PAL.go);
  let b = c.bong(0, 2, X * .95, 7);
  b += `<rect x="${-X + 18}" y="${-hh}" width="8" height="${hh - 10}" fill="${_mix(m, -.4)}"/><rect x="${X - 26}" y="${-hh}" width="8" height="${hh - 10}" fill="${_mix(m, -.4)}"/>`;
  b += `<path d="M${-X} ${-hh} L${-X + 12} ${-hh - d} H${X - 12} L${X} ${-hh} Z" fill="${c.g('tp', [[0, _mix(m, .12)], [1, _mix(m, .34)]])}" ${S()}/>`;
  b += `<path d="M${-X + 30} ${-hh - d + 3} H${X - 50}" stroke="#fff" stroke-width="1" opacity=".35"/><path d="M${-X + 20} ${-hh - 5} H${X - 30}" stroke="${_mix(m, -.2)}" stroke-width=".8" opacity=".5"/>`;
  b += `<rect x="${-X}" y="${-hh}" width="${w}" height="9" rx="2" fill="${c.v('fe', m)}" ${S()}/><path d="M${-X + 3} ${-hh + 1.5} H${X - 3}" stroke="#fff" stroke-width="1.2" opacity=".45"/>`;
  b += `<rect x="${-X + 8}" y="${-hh + 9}" width="${w - 16}" height="12" fill="${_mix(m, -.12)}" ${S(1.2)}/>` + c.ao(-X + 8, -hh + 9, w - 16, 4, .2);
  for(const lx of [-X + 5, X - 15]) b += `<rect x="${lx}" y="${-hh + 9}" width="10" height="${hh - 9}" rx="1.5" fill="${c.h('lg' + (lx > 0 ? 'r' : 'l'), m, .12, -.22)}" ${S(1.3)}/>`;
  const items = o.tren || [];
  items.forEach((k, i) => { b += _vat_tren_ban(k, -X + 24 + (w - 48) * (items.length === 1 ? .5 : i / (items.length - 1)), -hh - d / 2, c); });
  return c.wrap(b);
}

function ghe(o = {}){
  const c = _dv(o), S = c.S, w = 62, X = w / 2, seat = 48, m = _col(o.mau, o.kieu === 'dem' ? DV_PAL.jade : DV_PAL.go), go = o.kieu === 'dem' ? _mix(DV_PAL.go, -.25) : m;
  let b = c.bong(0, 2, X + 6, 5);
  b += `<rect x="${-X + 12}" y="${-seat}" width="6" height="${seat - 8}" fill="${_mix(go, -.4)}"/><rect x="${X - 18}" y="${-seat}" width="6" height="${seat - 8}" fill="${_mix(go, -.4)}"/>`;
  b += `<rect x="${-X + 4}" y="${-112}" width="7" height="${112 - seat}" rx="2" fill="${c.h('pl', go)}" ${S(1.3)}/><rect x="${X - 11}" y="${-112}" width="7" height="${112 - seat}" rx="2" fill="${c.h('pr', go)}" ${S(1.3)}/>`;
  if(o.kieu === 'dem'){
    b += `<rect x="${-X + 2}" y="-116" width="${w - 4}" height="54" rx="12" fill="${c.v('bk', m, .18, -.15)}" ${S()}/>`;
    b += [-12, 0, 12].map(x => `<circle cx="${x}" cy="-90" r="1.6" fill="${_mix(m, -.35)}"/>`).join('') + `<path d="M${-X + 10} -110 Q0 -114 ${X - 10} -110" stroke="#fff" stroke-width="2" fill="none" opacity=".3"/>`;
  } else {
    b += `<rect x="${-X + 4}" y="-114" width="${w - 8}" height="14" rx="5" fill="${c.v('bk', m)}" ${S(1.4)}/><rect x="${-X + 4}" y="-92" width="${w - 8}" height="10" rx="4" fill="${c.v('bk2', m)}" ${S(1.4)}/>`;
    b += `<path d="M${-X + 8} -111 H${X - 8}" stroke="#fff" stroke-width="1.2" opacity=".4"/>`;
  }
  b += `<path d="M${-X} ${-seat} L${-X + 6} ${-seat - 9} H${X - 6} L${X} ${-seat} Z" fill="${c.g('st', [[0, _mix(m, .1)], [1, _mix(m, .3)]])}" ${S()}/>`;
  b += `<rect x="${-X}" y="${-seat}" width="${w}" height="${o.kieu === 'dem' ? 10 : 7}" rx="3" fill="${c.v('se', m)}" ${S()}/>`;
  const ly = -seat + (o.kieu === 'dem' ? 10 : 7);
  for(const lx of [-X + 2, X - 9]) b += `<rect x="${lx}" y="${ly}" width="7" height="${-ly}" rx="1.5" fill="${c.h('l' + (lx > 0 ? 'r' : 'l'), go, .12, -.22)}" ${S(1.2)}/>`;
  b += c.ao(-X + 2, ly, w - 4, 3, .18);
  return c.wrap(b);
}

function tu(o = {}){
  const c = _dv(o), S = c.S, sach = o.kieu === 'sach', w = o.w || (sach ? 120 : 112), hh = o.h || 200, X = w / 2, sd = 14, m = _col(o.mau, sach ? DV_PAL.go_sang : DV_PAL.go);
  let b = c.bong(8, 2, X + 14, 7);
  b += `<path d="M${X} -6 L${X + sd} -12 V${-hh - 6} L${X} ${-hh} Z" fill="${c.v('sd', _mix(m, -.3), .05, -.1)}" ${S()}/>`;
  b += `<path d="M${-X - 3} ${-hh} L${-X - 3 + sd} ${-hh - 7} H${X + 3 + sd} L${X + 3} ${-hh} Z" fill="${_mix(m, .3)}" ${S()}/>`;
  b += `<rect x="${-X}" y="${-hh}" width="${w}" height="${hh - 6}" rx="2" fill="${c.h('fr', m, .1, -.12)}" ${S()}/>`;
  b += `<rect x="${-X - 3}" y="${-hh}" width="${w + 6}" height="9" rx="2" fill="${c.v('cn', _mix(m, .05))}" ${S(1.4)}/>`;
  b += `<rect x="${-X + 6}" y="-7" width="10" height="7" fill="${_mix(m, -.35)}"/><rect x="${X - 16}" y="-7" width="10" height="7" fill="${_mix(m, -.35)}"/>`;
  if(sach){
    const top = -hh + 14, bot = -16, n = 4, sh = (bot - top) / n;
    b += `<rect x="${-X + 7}" y="${top}" width="${w - 14}" height="${bot - top}" fill="${c.v('in', _mix(m, -.42), .05, -.05)}"/>`;
    const BK = ['#2A8167', '#E8A24A', '#3B7FB8', '#C0392B', '#F2C14E', '#7B5EA7', '#14432F', '#E46C8C', '#4E7F92'];
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for(let i = 0; i < n; i++){
      const y0 = top + sh * (i + 1);
      let x = -X + 10;
      if(i === 0){   // chậu cây nhỏ ở ngăn trên
        b += `<g transform="translate(${X - 26} ${y0})"><path d="M-9 -14 H9 L7 0 H-7 Z" fill="${c.tru('pt', '#E8A24A')}" ${S(1)}/>${[[-9, -30, -1], [9, -32, 1], [0, -36, 0]].map(([a, bb, k]) => `<path d="M0 -14 Q${a * .4} ${bb * .6} ${a} ${bb} Q${a * .2 + k * 4} ${bb * .7} 0 -14Z" fill="${k ? '#3CA57A' : '#2A8167'}" ${S(.9)}/>`).join('')}</g>`;
      }
      const lim = i === 0 ? X - 40 : X - 10;
      while(x < lim - 6){
        const bw = 6 + Math.round(rnd() * 6), bh = sh - 6 - Math.round(rnd() * sh * .35), col = BK[Math.floor(rnd() * BK.length)];
        if(i === 2 && x > 0 && x < 14){ b += `<rect x="${x}" y="${y0 - bh + 2}" width="${bw}" height="${bh - 2}" rx="1" fill="${c.h('b' + i + Math.round(x), col)}" ${S(.9)} transform="rotate(14 ${x} ${y0})"/>`; x += bw + 10; continue; }
        b += `<rect x="${x}" y="${y0 - bh}" width="${bw}" height="${bh}" rx="1" fill="${c.h('b' + i + Math.round(x + 60), col)}" ${S(.9)}/><rect x="${x + 1.5}" y="${y0 - bh + 5}" width="${bw - 3}" height="2" fill="#fff" opacity=".45"/>`;
        x += bw + (rnd() < .15 ? 3 : 0.5);
      }
      if(i === 3) b += `<rect x="${X - 34}" y="${y0 - 20}" width="24" height="20" rx="2" fill="${c.v('hp', '#F4EBDD')}" ${S(1)}/><path d="M${X - 30} ${y0 - 13} H${X - 14}" stroke="${_mix('#F4EBDD', -.3)}" stroke-width="1.5"/>`;
      b += `<rect x="${-X + 7}" y="${y0}" width="${w - 14}" height="5" fill="${c.v('sf' + i, m)}" ${S(1)}/>` + c.ao(-X + 7, y0 - 3, w - 14, 3, .12);
    }
    b += `<rect x="${-X + 7}" y="${top}" width="${w - 14}" height="4" fill="#000" opacity=".2"/>`;
  } else {
    const t = -hh + 16, dh = hh - 70;
    for(const [x0, k] of [[-X + 6, 'l'], [2, 'r']]){
      b += `<rect x="${x0}" y="${t}" width="${X - 8}" height="${dh}" rx="3" fill="${c.h('d' + k, m, .14, -.08)}" ${S(1.3)}/>`;
      b += `<rect x="${x0 + 7}" y="${t + 10}" width="${X - 22}" height="${dh * .52}" rx="3" fill="none" stroke="${_mix(m, -.22)}" stroke-width="1.6"/><rect x="${x0 + 7}" y="${t + 20 + dh * .52}" width="${X - 22}" height="${dh * .36}" rx="3" fill="none" stroke="${_mix(m, -.22)}" stroke-width="1.6"/>`;
      b += `<path d="M${x0 + 8} ${t + 12} L${x0 + 16} ${t + 12}" stroke="#fff" stroke-width="1.2" opacity=".35"/>`;
    }
    b += `<rect x="-8" y="${t + dh * .42}" width="3.5" height="22" rx="1.7" fill="${c.h('hl', '#C9CED3', .3, -.3)}" ${S(.8)}/><rect x="4.5" y="${t + dh * .42}" width="3.5" height="22" rx="1.7" fill="${c.h('hr', '#C9CED3', .3, -.3)}" ${S(.8)}/>`;
    b += `<rect x="${-X + 6}" y="${t + dh + 6}" width="${w - 12}" height="34" rx="3" fill="${c.v('dr', m)}" ${S(1.3)}/><rect x="-14" y="${t + dh + 21}" width="28" height="4" rx="2" fill="${c.h('dh', '#C9CED3', .3, -.3)}" ${S(.8)}/>`;
  }
  return c.wrap(b);
}

function giuong(o = {}){
  const c = _dv(o), S = c.S, L = 224, X = L / 2, m = _col(o.mau, DV_PAL.jade), go = _col(o.mau_chan, DV_PAL.go);
  let b = c.bong(0, 2, X + 4, 8);
  b += `<rect x="${-X}" y="-104" width="16" height="104" rx="5" fill="${c.h('hb', go)}" ${S()}/><path d="M${-X} -96 Q${-X + 8} -112 ${-X + 16} -96" fill="${_mix(go, .1)}" ${S(1.2)}/>`;
  b += `<rect x="${-X + 12}" y="-40" width="${L - 20}" height="22" rx="3" fill="${c.v('fr', go)}" ${S()}/>` + c.ao(-X + 12, -40, L - 20, 3, .14);
  b += `<rect x="${-X + 14}" y="-60" width="${L - 26}" height="22" rx="8" fill="${c.v('mt', '#F7F4EE', .1, -.1)}" ${S()}/>`;
  b += `<path d="M${-X + 20} -54 Q${-X + 30} -80 ${-X + 62} -70 Q${-X + 70} -58 ${-X + 60} -54 Z" fill="${c.v('pw', '#FFFFFF', 0, -.12)}" ${S(1.3)}/>`;
  b += `<path d="M${-X + 58} -66 Q${-X + 70} -76 ${-X + 90} -70 L${X - 14} -66 Q${X - 4} -62 ${X - 8} -34 L${-X + 66} -34 Q${-X + 54} -48 ${-X + 58} -66 Z" fill="${c.v('bl', m, .16, -.14)}" ${S()}/>`;

function cay(o = {}){
  const c = _dv(o), S = c.S, thu = o.mua === 'thu';
  const L1 = thu ? '#E8A24A' : '#3CA57A', L2 = thu ? '#C9742E' : '#2A8167', L3 = thu ? '#F2C14E' : '#5CBF8E';
  let b = c.bong(0, 2, 44, 8, .24);
  if(o.kieu === 'thong'){
    b += `<rect x="-8" y="-40" width="16" height="40" fill="${c.h('tk', '#8A5A3B')}" ${S()}/>`;
    [[-40, 64, 96], [-92, 52, 84], [-140, 38, 70]].forEach(([y, r, hh], i) => {
      b += `<path d="M${-r} ${y} Q0 ${y + 12} ${r} ${y} L0 ${y - hh} Z" fill="${c.h('p' + i, i % 2 ? '#2A8167' : '#237257', .18, -.2)}" ${S()}/><path d="M${-r * .5} ${y - 6} L0 ${y - hh + 10}" stroke="#fff" stroke-width="2" opacity=".15"/>`;
    });

  }
  const tuoi = o.tuoi == null ? 1 : Math.max(0, Math.min(1, +o.tuoi));   // 0 cây non mới trồng → 1 cổ thụ
  if(tuoi < 1){ const k = .28 + .72 * tuoi;
    const nho = cay({ ...o, s: 1, tuoi: 1, qua: tuoi > .6 ? o.qua : 0, quay: 1 });
    const coc = tuoi < .3 ? `<path d="M-16 0 V-70" stroke="#A67C52" stroke-width="3.5" stroke-linecap="round"/><path d="M-16 -46 L-2 -40" stroke="#8A6440" stroke-width="2" stroke-dasharray="3 2"/>` : '';
    return c.wrap(`${coc}<g transform="scale(${k.toFixed(3)})">${nho}</g>`); }
  b += `<path d="M-9 0 Q-6 -50 -7 -86 L-28 -120 L-22 -122 L-2 -96 L0 -130 L6 -130 L6 -98 L26 -124 L31 -120 L9 -84 Q7 -40 11 0 Z" fill="${c.h('tk', '#8A5A3B', .15, -.25)}" ${S()}/>`;

  blobs.forEach(([x, y, r, col], i) => b += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c.r('lf' + i, col)}" ${S()}/>`);
  b += [[-16, -196, 12], [-52, -156, 8], [20, -150, 9]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${L3}" opacity=".55"/>`).join('');
  b += `<path d="M-60 -110 Q0 -84 60 -110" stroke="#000" stroke-width="8" opacity=".08" fill="none"/>`;
  if(o.qua) b += [[-40, -128], [30, -140], [-8, -168], [18, -104], [-58, -150], [52, -118]].slice(0, Math.max(1, Math.round(6 * Math.min(1, +o.qua)))).map(([x, y], i) => `<g transform="translate(${x} ${y})"><path d="M0 -6 q1 -5 4 -6" stroke="#6B4A30" stroke-width="1.6" fill="none"/><circle r="6.5" fill="${c.r('qa' + i, '#C0392B')}" stroke="#8A2A20" stroke-width=".8"/><circle cx="-2" cy="-2" r="1.8" fill="#fff" opacity=".5"/></g>`).join('');
  if(thu) b += [[-60, -8], [40, -4], [58, -12], [-30, -3]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="5" ry="2.5" fill="#E8A24A" transform="rotate(20 ${x} ${y})"/>`).join('');
  return c.wrap(b);
}

<script>/* ===== ĐỒ VẬT BỔ SUNG (vẽ cho Bài 3, dùng chung cho mọi bài; cần do-vat.js nạp trước) =====
   Cùng quy ước do-vat.js: gốc (0,0) = giữa chân trên mặt đất, s = 1 cùng tỉ lệ chibi (người cao ~170).
   xich_du({h}) · bong_da() (gốc = tâm) · hang_rao({w}) · loi_di_da({n, buoc}) (gốc = viên đầu) · rap_phim({dong: 0..1})
   khung_thanh() · sach_cam_tay({mau}) (gốc = giữa đáy) · cay_dua() · ghe_nam_bien({mau}) · sao_lan({so}) (gốc = tâm; không có so thì là sao trơn)
   bong_bay({mau, chu}) (gốc = cuối dây)
   cong({kieu, mo, chu, s}) (BỘ CỔNG dùng chung; gốc = giữa chân; rộng 190, cao khoảng 300; mo = 0 đóng .. 1 mở hẳn; chu = chữ khắc trên biển cổng)
       kieu: 'moi_ngay' | 'ngay_luc_nay' (Bài 1) · 'thong_thai' | 'nham_lan' (Bài 9, 10, 11) · 'clb' (Bài 10, có dây nhung)
             'toi' | 'lui' (Bài 12, đồng hồ quay xuôi / ngược) · 'tuoi_tho' (Bài 15, ảnh cũ) · 'neu_nhu' (Bài 24, 25, thế giới "nếu như")
       vùng chạm: g.cong-o (ô cửa), g.cong-bien (biển chữ)
       Hiệu ứng (cần trình duyệt): cong_mo(g, o) cửa mở hẳn (chọn đúng) · cong_he_dong(g, o) cửa hé ra rồi đóng sập, rung (chọn sai).
       g là thẻ <g> KHÔNG có transform riêng (đặt nó bên trong thẻ <g transform="translate(...)">). Trả về Promise; tôn trọng chế độ giảm chuyển động.
   CẢNH NỀN (toạ độ cảnh, không qua _dv): nen_san_bong(W, H, gy) · nen_bai_bien(W, H, gy)                              */

function xich_du(o = {}){   // xích đu treo; h = độ cao điểm treo tính từ đất
  const c = _dv(o), S = c.S, h = o.h || 150, sy = -34;
  let b = [-20, 20].map(x => `<path d="M${x} ${-h} L${x} ${sy}" stroke="#8A6440" stroke-width="2.5"/><circle cx="${x}" cy="${-h}" r="3" fill="#6B4A30"/>`).join('');
  b += `<rect x="-28" y="${sy - 2}" width="56" height="9" rx="3" fill="${c.v('ga', DV_PAL.go)}" ${S()}/><path d="M-26 ${sy} H26" stroke="#fff" stroke-width="1.5" opacity=".35"/>`;
  return c.wrap(b);
}
function bong_da(o = {}){
  const c = _dv(o), S = c.S, r = 13;
  let b = c.bong(0, r + 2, r, 3, .2) + `<circle r="${r}" fill="${c.r('bd', '#FFFDF6')}" ${S()}/>`;
  b += `<path d="M0 -5 l4.8 3.5 -1.8 5.6 h-6 l-1.8 -5.6z" fill="#1F2A24"/>` + [[0, -12], [11, -4], [7, 10], [-7, 10], [-11, -4]].map(([x, y]) => `<path d="M${x * .95} ${y * .95} l${-x * .18} ${-y * .18}" stroke="#1F2A24" stroke-width="3.2" stroke-linecap="round"/>`).join('');
  b += `<circle cx="-4" cy="-5" r="3" fill="#fff" opacity=".6"/>`;
  return c.wrap(b);
}
function hang_rao(o = {}){   // hàng rào gỗ, gốc = giữa chân
  const c = _dv(o), S = c.S, w = o.w || 300, h = 46, n = Math.max(2, Math.round(w / 26)), x0 = -w / 2;
  let b = `<rect x="${x0}" y="${-h + 10}" width="${w}" height="6" rx="2" fill="${c.v('r1', DV_PAL.go_sang)}" ${S(1)}/><rect x="${x0}" y="${-h + 26}" width="${w}" height="6" rx="2" fill="${c.v('r2', DV_PAL.go_sang)}" ${S(1)}/>`;
  for(let i = 0; i <= n; i++){ const x = x0 + i * w / n; b += `<path d="M${x - 6} 0 V${-h + 4} L${x} ${-h - 4} L${x + 6} ${-h + 4} V0 Z" fill="${c.h('p' + (i % 2), '#E8D2A8', .1, -.14)}" ${S()}/>`; }
  return c.wrap(b);
}
function loi_di_da(o = {}){   // lối đi lát đá, n viên đi dần sang phải; gốc = viên đầu
  const c = _dv(o), n = o.n || 5, buoc = o.buoc || 46;
  let b = '';
  for(let i = 0; i < n; i++){ const x = i * buoc, rx = 16 + i * 2.2, ry = 5 + i * .7;
    b += `<ellipse cx="${x}" cy="${i * 5}" rx="${rx}" ry="${ry}" fill="${c.v('d' + (i % 2), i % 2 ? '#C9CED3' : '#D9DEE2', .1, -.1)}"/><ellipse cx="${x - rx * .3}" cy="${i * 5 - ry * .3}" rx="${rx * .4}" ry="${ry * .35}" fill="#fff" opacity=".35"/>`; }
  return c.wrap(b);
}
function rap_phim(o = {}){   // mặt tiền rạp phim có biển đèn, quầy vé kéo cửa cuốn (dong: 0 mở → 1 đóng hẳn); gốc = giữa chân
  const c = _dv(o), S = c.S, dong = Math.max(0, Math.min(1, +o.dong || 0)), W = 320, H = 200, X = W / 2;
  let b = c.bong(0, 2, X + 10, 8, .22) + `<rect x="${-X}" y="${-H}" width="${W}" height="${H}" fill="${c.v('tg', '#3B2F5C', .08, -.15)}" ${S()}/>`;
  b += `<rect x="${-X - 8}" y="${-H - 44}" width="${W + 16}" height="48" rx="8" fill="#1D1733" stroke="#E46C8C" stroke-width="4"/>` + Array.from({ length: 14 }, (_, i) => `<circle cx="${-X + 4 + i * (W - 8) / 13}" cy="${-H - 40}" r="3.4" fill="#FFE08A"/><circle cx="${-X + 4 + i * (W - 8) / 13}" cy="${-H}" r="3.4" fill="#FFE08A"/>`).join('');
  b += `<text x="0" y="${-H - 10}" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="32" font-weight="800" letter-spacing="2.5" fill="#FFF6E6">STAR CINEMA</text>`;
  // áp phích
  [[-X + 18, '#E8A24A'], [X - 78, '#3B7FB8']].forEach(([x, m], i) => { b += `<rect x="${x}" y="${-H + 18}" width="60" height="84" rx="4" fill="#FFF6E6" ${S(1)}/><rect x="${x + 5}" y="${-H + 23}" width="50" height="60" fill="${m}"/><circle cx="${x + 30}" cy="${-H + 48}" r="12" fill="#FFF6E6" opacity=".8"/><path d="M${x + 12} ${-H + 83} L${x + 30} ${-H + 60} L${x + 48} ${-H + 83}Z" fill="#1D1733" opacity=".4"/><rect x="${x + 8}" y="${-H + 88}" width="44" height="5" rx="2" fill="${m}" opacity=".7"/>`; });
  // quầy vé ở giữa: ô kính, người bán, cửa cuốn
  const bx = -58, by = -H + 30, bw = 116, bh = 96;
  b += `<rect x="${bx - 8}" y="${by - 10}" width="${bw + 16}" height="${bh + 44}" rx="6" fill="#2A2345" ${S()}/><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4" fill="${c.g('kv', [[0, '#FFE7A8'], [1, '#F6C98B']])}"/>`;
  b += `<g transform="translate(${bx + bw / 2} ${by + bh - 4})"><circle cy="-44" r="15" fill="#F6CBA8"/><path d="M-15 -48 q15 -18 30 0 q-2 -14 -15 -14 q-13 0 -15 14z" fill="#2B1D16"/><path d="M-20 0 q0 -24 20 -26 q20 2 20 26z" fill="#C0392B"/></g>`;
  b += `<rect x="${bx - 6}" y="${by + bh}" width="${bw + 12}" height="12" rx="3" fill="#8A6440"/><path d="M${bx + 14} ${by + bh + 22} h24 v12 h-24z M${bx + bw - 38} ${by + bh + 22} h24 v12 h-24z" fill="#F2C14E" opacity=".9"/>`;
  if(dong > 0){ const hh = bh * dong; b += `<rect x="${bx}" y="${by}" width="${bw}" height="${hh}" fill="${c.v('cc', '#8C96A0', .15, -.1)}" ${S(1)}/>` + Array.from({ length: Math.floor(hh / 8) }, (_, i) => `<path d="M${bx} ${by + 7 + i * 8} H${bx + bw}" stroke="#5E6973" stroke-width="1.4"/>`).join('') + `<rect x="${bx - 4}" y="${by + hh - 4}" width="${bw + 8}" height="7" rx="2" fill="#5E6973"/>`; }
  b += `<rect x="${bx - 8}" y="${by - 16}" width="${bw + 16}" height="10" rx="3" fill="#E46C8C"/>`;
  // cửa kính và bậc thềm
  b += `<rect x="${X - 88}" y="-80" width="70" height="80" rx="3" fill="${c.kinh('ck', 1)}" stroke="#F2C14E" stroke-width="3"/><path d="M${X - 53} -80 V0" stroke="#F2C14E" stroke-width="2"/>`;
  b += `<rect x="${-X - 12}" y="-8" width="${W + 24}" height="8" fill="#6C7A89"/><rect x="${-X - 20}" y="0" width="${W + 40}" height="6" fill="#4A5560"/>`;
  return c.wrap(b);
}
function khung_thanh(o = {}){   // khung thành có lưới; gốc = giữa vạch cầu môn
  const c = _dv(o), W = 150, H = 82, X = W / 2;
  let b = c.bong(0, 2, X, 6, .18);
  for(let i = 0; i <= 10; i++) b += `<path d="M${-X + i * W / 10} ${-H} L${-X + 14 + i * (W - 28) / 10} -8" stroke="#fff" stroke-width="1.2" opacity=".6"/>`;
  for(let j = 1; j < 6; j++) b += `<path d="M${-X + j * 2.4} ${-H + j * (H - 8) / 6} H${X - j * 2.4}" stroke="#fff" stroke-width="1.2" opacity=".6"/>`;
  b += `<path d="M${-X} 0 V${-H} H${X} V0" fill="none" stroke="#FFFDF6" stroke-width="7" stroke-linejoin="round"/><path d="M${-X} 0 V${-H} H${X} V0" fill="none" stroke="#C9CED3" stroke-width="2" transform="translate(2 1)" opacity=".7"/>`;
  return c.wrap(b);
}
function sach_cam_tay(o = {}){   // cuốn sách bìa rõ (dùng cho "cùng một cuốn tiểu thuyết")
  const c = _dv(o), S = c.S, m = _col(o.mau, DV_PAL.xanh);
  let b = `<rect x="-17" y="-44" width="34" height="44" rx="3" fill="${c.h('bia', m)}" ${S()}/><rect x="-17" y="-44" width="6" height="44" rx="2" fill="${_mix(m, -.3)}"/>`;
  b += `<path d="M-6 -34 h17 M-6 -29 h12" stroke="#FFF6E6" stroke-width="2.6" stroke-linecap="round"/><path d="M3 -20 l2.4 4.8 5.2 .8 -3.8 3.6 .9 5.2 -4.7 -2.5 -4.7 2.5 .9 -5.2 -3.8 -3.6 5.2 -.8z" fill="#F2C14E"/>`;
  b += `<rect x="15" y="-42" width="3" height="40" fill="#FFFDF6"/>`;
  return c.wrap(b);
}
function cay_dua(o = {}){
  const c = _dv(o), S = c.S;
  let b = c.bong(20, 2, 40, 6, .2) + `<path d="M-6 0 Q-2 -80 34 -170 L44 -166 Q12 -80 8 0 Z" fill="${c.h('td', '#A67C52', .15, -.2)}" ${S()}/>`;
  for(let i = 1; i < 9; i++){ const t = i / 9, x = lerp_(1, 39, t * t), y = -170 * t; b += `<path d="M${x - 7} ${y} q7 3 14 0" stroke="#7A5638" stroke-width="1.5" fill="none"/>`; }
  const top = [39, -172];
  [[-80, -30], [-40, -60], [10, -70], [60, -50], [90, -10]].forEach(([dx, dy], i) => { const [x, y] = top;
    b += `<path d="M${x} ${y} Q${x + dx * .5} ${y + dy - 10} ${x + dx} ${y + dy + 30} Q${x + dx * .45} ${y + dy + 6} ${x} ${y + 6} Z" fill="${c.v('la' + i, i % 2 ? '#2A8167' : '#3CA57A', .15, -.15)}" ${S(1)}/>`; });
  b += [[33, -164], [45, -162], [39, -156]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="${c.r('dua', '#8A6440')}"/>`).join('');
  return c.wrap(b);
}
const lerp_ = (a, b, t) => a + (b - a) * t;
function ghe_nam_bien(o = {}){
  const c = _dv(o), S = c.S, m = _col(o.mau, DV_PAL.cam);
  let b = c.bong(0, 2, 60, 6, .2) + `<path d="M-58 -26 L40 -26 L62 -66 L50 -70 L30 -34 L-58 -34 Z" fill="${m}" ${S()}/>`;
  b += Array.from({ length: 5 }, (_, i) => `<path d="M${-50 + i * 18} -34 v8" stroke="#fff" stroke-width="6"/>`).join('') + `<path d="M36 -34 L52 -64" stroke="#fff" stroke-width="5"/>`;
  b += `<path d="M-50 -26 L-54 0 M30 -26 L36 0 M-10 -26 L-12 0" stroke="#6B4A30" stroke-width="4" stroke-linecap="round"/>`;
  return c.wrap(b);
}
function sao_lan(o = {}){   // huy hiệu sao đếm số lần (so = 1, 2, 3...)
  const c = _dv(o), S = c.S, r = 20, sao = Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .45 : r; return `${(Math.cos(a) * q).toFixed(1)},${(Math.sin(a) * q).toFixed(1)}`; }).join(' ');
  let b = `<circle r="${r + 5}" fill="#FFE7A8" opacity=".45"/><polygon points="${sao}" fill="${c.r('sa', '#F2C14E')}" stroke="#B7791F" stroke-width="1.8" stroke-linejoin="round"/>`;
  if(o.so != null) b += `<text y="7.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="21" font-weight="800" fill="#7A4E12">${o.so}</text>`;
  return c.wrap(b);
}
function bong_bay(o = {}){   // bóng bay; gốc = cuối dây; chu: chữ trên bóng (tuỳ chọn)
  const c = _dv(o), m = _col(o.mau, DV_PAL.do);
  let b = `<path d="M0 0 q-6 -20 0 -34 q6 -12 0 -24" stroke="#8A6440" stroke-width="1.6" fill="none"/><path d="M-5 -58 h10 l-5 7z" fill="${m}"/>`;
  b += `<ellipse cx="0" cy="-100" rx="38" ry="44" fill="${c.r('bb', m)}"/><ellipse cx="-13" cy="-118" rx="8" ry="13" fill="#fff" opacity=".4" transform="rotate(-25 -13 -118)"/>`;
  if(o.chu) b += `<text x="0" y="-94" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="17" font-weight="800" font-style="italic" fill="#fff">${o.chu}</text>`;
  return c.wrap(b);
}
/* ---------- cảnh nền (toạ độ cảnh) ---------- */
function nen_san_bong(W = 760, H = 300, gy = 196){
  const id = 'nsb' + Math.random().toString(36).slice(2, 6);
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6DBB84"/><stop offset="1" stop-color="#3CA57A"/></linearGradient></defs>`;
  s += `<rect y="${gy}" width="${W}" height="${H - gy}" fill="url(#${id})"/>` + Array.from({ length: Math.ceil(W / 80) }, (_, i) => i % 2 ? `<rect x="${i * 80}" y="${gy}" width="80" height="${H - gy}" fill="#fff" opacity=".06"/>` : '').join('');
  s += `<path d="M20 ${gy + 50} H${W - 20}" stroke="#fff" stroke-width="3" opacity=".8"/><path d="M${W / 2} ${gy + 6} V${H}" stroke="#fff" stroke-width="3" opacity=".5"/><ellipse cx="${W / 2}" cy="${gy + 58}" rx="70" ry="20" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>`;
  s += `<path d="M${W - 180} ${gy + 6} L${W - 200} ${gy + 76} H${W - 20}" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/>`;
  s += `<rect y="${gy - 4}" width="${W}" height="6" fill="#2A8167"/>` + Array.from({ length: Math.ceil(W / 12) }, (_, i) => `<path d="M${i * 12} ${gy - 36} V${gy}" stroke="#8C96A0" stroke-width="1" opacity=".55"/>`).join('') + `<path d="M0 ${gy - 36} H${W} M0 ${gy - 20} H${W}" stroke="#8C96A0" stroke-width="1.2" opacity=".55"/>`;
  return s;
}
function nen_bai_bien(W = 360, H = 250, gy = 190){
  const id = 'nbb' + Math.random().toString(36).slice(2, 6);
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F79A6B"/><stop offset=".55" stop-color="#FCC48A"/><stop offset="1" stop-color="#FDE3B8"/></linearGradient></defs><rect width="${W}" height="${gy - 40}" fill="url(#${id})"/>`;
  s += `<circle cx="${W * .74}" cy="${gy - 90}" r="30" fill="#FFF3C4"/><circle cx="${W * .74}" cy="${gy - 90}" r="46" fill="#FFF3C4" opacity=".3"/>`;
  s += `<rect y="${gy - 42}" width="${W}" height="46" fill="#3B7FB8"/>` + [0, 1, 2].map(i => `<path d="M0 ${gy - 34 + i * 12} ${Array.from({ length: Math.ceil(W / 30) }, (_, k) => `q7.5 -5 15 0 t15 0`).join(' ')}" stroke="#9ED2EC" stroke-width="2" fill="none" opacity="${.7 - i * .2}"/>`).join('');
  s += `<path d="M0 ${gy} Q${W / 2} ${gy - 10} ${W} ${gy} V${H} H0Z" fill="#F2D59B"/><path d="M0 ${gy + 2} Q${W / 2} ${gy - 8} ${W} ${gy + 2}" stroke="#fff" stroke-width="4" opacity=".6" fill="none"/>`;
  return s;
}
const _CONG = {   // đá cổng, lòng cổng (2 màu trên dưới), màu biểu tượng
  moi_ngay:     { da: '#D9CBB0', long: ['#BFE9F5', '#FFF3CF'], ic: '#2A8167', cua: '#2A8167' },   // xanh thương hiệu
  ngay_luc_nay: { da: '#CFD8DC', long: ['#FFE3E3', '#FFF8F2'], ic: '#C0392B', cua: '#D9604A' },
  thong_thai:   { da: '#E9D9A6', long: ['#FFF6D6', '#FFE7A8'], ic: '#B7791F', cua: '#D9A441' },
  nham_lan:     { da: '#B8B0C8', long: ['#D9DEE8', '#9AA6BC'], ic: '#7B5EA7', cua: '#9AA6BC' },
  clb:          { da: '#2B2F4A', long: ['#1B1F3A', '#3A2F5E'], ic: '#FF5FA2', cua: '#3A2F5E' },
  toi:          { da: '#D9CBB0', long: ['#FFE0B8', '#BFE9F5'], ic: '#3B7FB8', cua: '#4F8FC6' },
  lui:          { da: '#CDBFA5', long: ['#E8DCC2', '#C9B79C'], ic: '#8A6440', cua: '#9C7A55' },
  tuoi_tho:     { da: '#CFC4E6', long: ['#B9C6F2', '#E9D6F5'], ic: '#7B5EA7', cua: '#9A86CC' },   // tím (người dùng chọn 01/10)
  neu_nhu:      { da: '#CDE6DD', long: ['#CFEAF6', '#FDF3E7'], ic: '#2A8167', cua: '#6FB7C2' }   // xanh trời nhạt + kem (người dùng chọn 01/10)
};
function cong(o = {}){   // bộ cổng nhiều kiểu; gốc = giữa chân
  const c = _dv(o), S = c.S, k = _CONG[o.kieu] ? o.kieu : 'thong_thai', C = _CONG[k], mo = Math.max(0, Math.min(1, o.mo ?? 0));
  const R = 95, r = 66, top = -205, F = "font-family=\"'Be Vietnam Pro',sans-serif\" font-weight=\"800\"";
  const vom = (rr, y0) => `M${-rr} ${y0} V${top} A${rr} ${rr} 0 0 1 ${rr} ${top} V${y0}`;
  const lo = `M${-r} 0 V${top} A${r} ${r} 0 0 1 ${r} ${top} V0 Z`;   // ô cửa
  let b = c.bong(0, 2, 120, 8, .24);
  if(k === 'thong_thai') b += `<g opacity="${.35 + mo * .5}">${Array.from({ length: 9 }, (_, i) => { const a = Math.PI * (1.05 + i * .1125); return `<path d="M${Math.cos(a) * 110} ${top + Math.sin(a) * 110} L${Math.cos(a) * 150} ${top + Math.sin(a) * 150}" stroke="#F2C14E" stroke-width="6" stroke-linecap="round"/>`; }).join('')}</g>`;
  const nghieng = k === 'nham_lan' ? ' transform="skewX(-5) rotate(-2)"' : '';
  b += `<g${nghieng}>`;
  // lòng cổng
  b += `<defs><clipPath id="${c.id}lo"><path d="${lo}"/></clipPath></defs>`;
  b += `<g class="cong-o" clip-path="url(#${c.id}lo)"><path d="${lo}" fill="${c.g('long', [[0, C.long[0]], [1, C.long[1]]])}"/>`;
  if(k === 'moi_ngay'){ b += `<circle cx="0" cy="-150" r="26" fill="#F2C14E" opacity=".9"/>` + [-40, 30].map(x => `<ellipse cx="${x}" cy="-205" rx="22" ry="9" fill="#fff" opacity=".9"/>`).join('') + `<path d="M-66 -40 Q0 -70 66 -40 V0 H-66Z" fill="#9ED6A6"/>`; }
  if(k === 'ngay_luc_nay'){ b += `<rect x="-46" y="-178" width="92" height="66" rx="8" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 8" opacity=".55"/><circle cx="0" cy="-145" r="10" fill="#C0392B" opacity=".75"/>`; }
  if(k === 'thong_thai'){ b += `<ellipse cx="0" cy="-120" rx="70" ry="120" fill="#fff" opacity="${.35 + mo * .45}"/>`; }
  if(k === 'nham_lan'){ b += `<path d="M-50 -250 L40 -20 M20 -260 L-40 -10" stroke="#fff" stroke-width="10" opacity=".35"/>` + `<path d="M0 -150 m-30 0 a30 30 0 1 1 30 30 a18 18 0 1 1 -18 -18" fill="none" stroke="#7B5EA7" stroke-width="4" opacity=".55"/>`; }
  if(k === 'clb'){ b += Array.from({ length: 26 }, (_, i) => `<circle cx="${-60 + (i * 47) % 120}" cy="${-250 + (i * 71) % 240}" r="${i % 3 ? 2 : 3.5}" fill="${['#FF5FA2', '#5FE3D0', '#F2C14E'][i % 3]}" opacity=".8"/>`).join(''); }

function _cong_chay(g, o, tu, den, ms, ease){
  return new Promise(res => { const t0 = performance.now();
    const buoc = t => { const k = Math.min(1, (t - t0) / ms); g.innerHTML = cong({ ...o, mo: tu + (den - tu) * ease(k) }); k < 1 ? requestAnimationFrame(buoc) : res(); };

const _cong_giam = () => typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;

async function cong_he_dong(g, o = {}){   // chọn sai: cửa hé ra cho thấy bên trong, rồi đóng sập lại và rung

<script>/* ===== GAMESHOW: SÂN KHẤU, BẢNG KỶ LỤC, ĐẢO, BÌNH TƯỚI, CÚP, MẶT TRỜI (vẽ cho Bài 7, dùng chung; cần do-vat.js, do-vat-them.js nạp trước) =====
   Cùng quy ước do-vat.js: gốc (0,0) = giữa chân trên mặt đất, s = 1 cùng tỉ lệ chibi (người cao ~170). Không viền, màu bảng team.
   san_khau_gameshow(W, H, gy, {buc, sang}) (CẢNH NỀN, toạ độ cảnh: rèm xanh ngọc hai bên, diềm có bóng đèn, hai luồng đèn, sàn gỗ;

   dao({co: 'nho' | 'vua' | 'lon'}) (đảo giữa biển, có cây dừa; gốc = tâm mặt nước)
   binh_tuoi({nghieng, nuoc}) (bình tưới; gốc = giữa đáy; nghieng = độ nghiêng, nuoc: tia nước rơi từ vòi)
   cup() (cúp vàng có ngôi sao; gốc = giữa đáy)
   mat_troi({tia}) (mặt trời có tia; gốc = tâm; tia = số tia)                                                                    */

const _sao5 = (r, ri = r * .45, cx = 0, cy = 0) => Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? ri : r; return `${(cx + Math.cos(a) * q).toFixed(1)},${(cy + Math.sin(a) * q).toFixed(1)}`; }).join(' ');

function san_khau_gameshow(W = 640, H = 360, gy = 300, o = {}){
  const c = _dv({}), X0 = -W, X1 = 2 * W, cx = W / 2, sg = o.sang ?? 1;
  let b = `<rect x="${X0}" y="${-H}" width="${X1 - X0}" height="${gy + H}" fill="${c.v('tuong', '#F6E7CF', .35, -.06)}"/>`;
  // vầng sáng sau thẻ và các ô vuông mờ trên tường

  for(let k = 1; k < 6; k++) b += `<path d="M${X0} ${gy + k * k * 4} H${X1}" stroke="#B98A5A" stroke-opacity="${.5 - k * .06}" stroke-width="1.4"/>`;
  b += `<rect x="${X0}" y="${gy - 3}" width="${X1 - X0}" height="6" fill="#8A6440" opacity=".35"/>`;

    b += `<polygon points="${x - 10},${-10} ${x + 10},${-10} ${cx + d * 20 + 120},${gy} ${cx + d * 20 - 120},${gy}" fill="#FFF6D8" class="sk-den" data-op=".32" opacity="${.32 * sg}"/>`;
    b += `<ellipse cx="${cx + d * 20}" cy="${gy + 6}" rx="130" ry="12" fill="#FFF6D8" class="sk-den" data-op=".45" opacity="${.45 * sg}"/>`;
  });

    b += `<ellipse cx="${cx}" cy="${gy + 14}" rx="104" ry="18" fill="${c.v('buc_t', '#2A8167', .05, -.25)}"/><rect x="${cx - 104}" y="${gy - 4}" width="208" height="18" fill="${c.h('buc_h', '#2A8167', .2, -.25)}"/>`;
    b += `<ellipse cx="${cx}" cy="${gy - 4}" rx="104" ry="18" fill="${c.v('buc_m', '#FDF3E7', .2, -.06)}"/><ellipse cx="${cx}" cy="${gy - 4}" rx="104" ry="18" fill="none" stroke="#F2C14E" stroke-width="3"/>`;
  }
  // rèm hai bên (nếp gấp sáng tối), buộc dây vàng
  const rem = d => {
    const xa = d < 0 ? X0 : X1, xb = d < 0 ? W * .13 : W * .87, xm = d < 0 ? W * .02 : W * .98;
    let r = `<path d="M${xa} ${-H} H${xb} Q${xb - d * 8} ${gy * .45} ${xm} ${gy * .62} Q${xb - d * 4} ${gy * .8} ${xb + d * 6} ${gy + 6} H${xa} Z" fill="${c.h('rem' + d, '#2A8167', d < 0 ? -.1 : .12, d < 0 ? .12 : -.1)}"/>`;
    for(let k = 1; k <= 4; k++){ const t = k * W * .03; r += `<path d="M${xb + d * t} ${-H} Q${xb + d * t - d * 6} ${gy * .45} ${xm + d * t * .3} ${gy * .62} Q${xb + d * t * .8} ${gy * .82} ${xb + d * (t + 6)} ${gy + 6}" stroke="${k % 2 ? '#14432F' : '#5DB894'}" stroke-opacity="${k % 2 ? .28 : .35}" stroke-width="7" fill="none"/>`; }
    r += `<ellipse cx="${xm + d * 8}" cy="${gy * .62}" rx="10" ry="7" fill="#F2C14E"/><ellipse cx="${xm + d * 6}" cy="${gy * .62 - 2}" rx="4" ry="2.5" fill="#fff" opacity=".5"/>`;
    return r;
  };
  b += rem(-1) + rem(1);

  b += `<rect x="${X0}" y="${-H}" width="${X1 - X0}" height="${H + 30}" fill="${c.v('diem', '#14432F', .12, 0)}"/>`;
  let ri = '';
  for(let x = X0; x < X1; x += 48) ri += `Q${x + 24} 52 ${x + 48} 30 `;
  b += `<path d="M${X0} 30 ${ri}V20 H${X0} Z" fill="#1F5E4B"/><path d="M${X0} 30 ${ri}" stroke="#F2C14E" stroke-width="3" fill="none"/>`;

  let i = 0;

  b += `<rect class="sk-loe" x="${X0}" y="${-H}" width="${X1 - X0}" height="${H * 3}" fill="#FFF8E6" opacity="0" pointer-events="none"/>`;

}

function san_khau_bat(g, o = {}){
  const ms = o.ms || 1500, toi = g.querySelector('.sk-toi'), loe = g.querySelector('.sk-loe');
  const den = [...g.querySelectorAll('.sk-den')], bong = [...g.querySelectorAll('.sk-bong')].sort((a, b) => a.dataset.x - b.dataset.x);

    bong.forEach((e, i) => e.setAttribute('opacity', p >= .05 + .4 * i / Math.max(1, bong.length - 1) ? 1 : 0));   // bóng đèn sáng lần lượt
    const q = tron(p, .45, .8), ease = 1 - Math.pow(1 - q, 3);

}

function bang_ky_luc(o = {}){

  b += `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="16" fill="${c.v('nen', '#1F5E4B', .08, -.18)}"/>`;
  b += `<rect x="${-w / 2 + 6}" y="${-h / 2 + 5}" width="${w - 12}" height="${h * .22}" rx="11" fill="#fff" opacity=".07"/>`;
  b += `<circle cy="${-h / 2 - 3}" r="15" fill="${c.r('hc', '#F2C14E')}"/><polygon points="${_sao5(9, 4, 0, -h / 2 - 3)}" fill="#2A8167"/>`;
  for(let i = 0; i < tong; i++){
    const hang = i < cot ? 0 : 1, k = hang ? i - cot : i, n = hang ? tong - cot : cot, x = (k - (n - 1) / 2) * gx, y = (hang - .5) * h * .44 + h * .04, on = i < sao;
    b += `<g class="sao${on ? ' sang' : ''}" data-i="${i}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">`
       + `<circle class="hao-quang" r="${r * 1.12}" fill="#FFE7A8" opacity="${on ? .22 : 0}"/>`
       + `<polygon class="tat" points="${_sao5(r)}" fill="#2E7560" stroke="#4E9A82" stroke-width="1.4" stroke-linejoin="round"/>`
       + `<polygon class="bat" points="${_sao5(r)}" fill="${c.r('sa', '#F2C14E')}" stroke="#B7791F" stroke-width="1.4" stroke-linejoin="round" opacity="${on ? 1 : 0}"/></g>`;
  }

}

// cây dừa mập cho đảo: gốc = chân thân; h = chiều cao thân, ng = độ nghiêng (+ sang phải)
function _dua_dao(c, h, ng, k){

  b += `<path d="M0 -140 C-38 -140 -56 -120 -58 -98 C-59 -84 -64 -76 -70 -62 C-80 -36 -74 -4 -38 -2 H38 C74 -4 80 -36 70 -62 C64 -76 59 -84 58 -98 C56 -120 38 -140 0 -140 Z" fill="url(#${id}x)"/>`;
  // mặt kem có chỏm nhọn trên trán, bụng kem
  b += `<path d="M0 -126 C-9 -114 -26 -110 -42 -104 C-58 -96 -60 -78 -50 -68 C-34 -58 34 -58 50 -68 C60 -78 58 -96 42 -104 C26 -110 9 -114 0 -126 Z" fill="url(#${id}k)"/>`;
  b += `<ellipse cx="0" cy="-34" rx="58" ry="38" fill="url(#${id}k)"/>`;
  // chân
  [-1, 1].forEach(d => { b += `<ellipse cx="${d * 40}" cy="-4" rx="14" ry="7" fill="#F6EAD8"/>`; });
  // tay: hai bàn tay nhỏ trước ngực (có bóng nhẹ cho nổi trên bụng kem); bam = tay phải giơ lên
  const tay = (x, y, d) => `<ellipse cx="${x}" cy="${y + 3}" rx="10" ry="7" fill="#000" opacity=".07"/><ellipse cx="${x}" cy="${y}" rx="9.5" ry="8" fill="#FFF8EE"/><path d="M${x - d * 4} ${y - 4} q${d * 5} 4 0 9" stroke="${P.vuot}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  b += tay(-15, -62, 1);
  b += o.bam ? `<path d="M58 -62 Q70 -80 72 -96" stroke="url(#${id}x)" stroke-width="13" stroke-linecap="round"/>` + tay(73, -101, -1) : tay(15, -62, -1);
  // má, râu
  [-1, 1].forEach(d => { b += `<circle cx="${d * 34}" cy="-80" r="8" fill="${P.hong}" opacity=".75"/><path d="M${d * 50} -90 h${d * 9} M${d * 50} -84 h${d * 9}" stroke="${P.mieng}" stroke-width="1.8" stroke-linecap="round"/>`; });
  // mắt
  const mat = x => ({
    vui: `<path d="M${x - 5} -90 Q${x} -97 ${x + 5} -90" stroke="${P.mat}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    ngac_nhien: `<ellipse cx="${x}" cy="-92" rx="5.5" ry="7" fill="${P.mat}"/><circle cx="${x - 1.5}" cy="-95" r="1.6" fill="#fff"/>`,
    buon: `<ellipse cx="${x}" cy="-91" rx="4.5" ry="5.5" fill="${P.mat}"/><path d="M${x - 6} ${x < 0 ? -99 : -104} L${x + 6} ${x < 0 ? -104 : -99}" stroke="${P.mieng}" stroke-width="1.6" stroke-linecap="round"/>`,
    boi_roi: `<ellipse cx="${x}" cy="-91" rx="4.5" ry="5.5" fill="${P.mat}"/>`
  }[bc] || `<ellipse cx="${x}" cy="-92" rx="6.2" ry="8" fill="${P.mat}"/><circle cx="${x - 1.8}" cy="-95" r="1.8" fill="#fff" opacity=".85"/>`);
  b += mat(-22) + mat(22);
  // mũi, miệng
  b += `<path d="M-3 -86 h6 l-3 3.5 z" fill="#E98C80"/>`;
  if(o.mieng_mo || bc === 'ngac_nhien') b += `<ellipse cx="0" cy="-77" rx="${bc === 'ngac_nhien' ? 3.5 : 4.5}" ry="${bc === 'ngac_nhien' ? 4 : 3.5}" fill="#8E4A3E"/>`;
  else if(bc === 'buon') b += `<path d="M-6 -75 q6 -5 12 0" stroke="${P.mieng}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  else if(bc === 'boi_roi') b += `<path d="M-6 -77 q3 -2 6 0 t6 0" stroke="${P.mieng}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  else b += `<path d="M-8 -80 q4 5 8 0 q4 5 8 0" stroke="${P.mieng}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  return `<g transform="scale(${s * f} ${s})">${defs}${b}</g>`;
}

function com_mat(o = {}){   // avatar tròn cho ô lời thoại
  return `<circle r="58" fill="#E8F6F0"/><g transform="translate(0 52) scale(.72)">${com({ ...o, s: 1 })}</g>`;
}

if(typeof module !== 'undefined') module.exports = Object.assign(module.exports || {}, { COM_PAL, com, com_mat });
